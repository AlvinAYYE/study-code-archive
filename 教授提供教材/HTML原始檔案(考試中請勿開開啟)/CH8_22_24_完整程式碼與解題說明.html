03cspan class=\"code-line\" data-line=\"27\">\u003cspan class=\"lineno\" aria-hidden=\"true\">27\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"28\">\u003cspan class=\"lineno\" aria-hidden=\"true\">28\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"n\">putchar\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sc\">&#39;\\n&#39;\u003c/span>\u003cspan class=\"p\">);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"29\">\u003cspan class=\"lineno\" aria-hidden=\"true\">29\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">return\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">EXIT_SUCCESS\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"30\">\u003cspan class=\"lineno\" aria-hidden=\"true\">30\u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>","build":"gcc -std=c17 -Wall -Wextra -Wpedantic 07_deal_cards.c -o 07_deal_cards"}],"notes":[{"page":42,"title":"案例 07｜不重複發牌與狀態表","text":"【本頁目標】\n案例 07｜不重複發牌與狀態表\n完整題目：先確認任務、輸入、輸出與限制\n\n【教師講解】\n先不要展示解答。請學生用自己的話重述任務，再指出輸入格式、輸出格式與無效資料的處理。從 4 種花色、13 種點數的牌組發出 n 張不重複的牌，用二維布林表記錄已發出的牌。 0 ≤ n ≤ 52。點數 23456789tjqka；花色 cdhs。同一實作／種子可重現；跨編譯器不保證相同牌序。\n\n【完整規格】\n任務：從 4 種花色、13 種點數的牌組發出 n 張不重複的牌，用二維布林表記錄已發出的牌。\n輸入：標準輸入：張數 n 與 unsigned 整數亂數種子 seed。\n輸出：輸出 n 個二字元牌碼，例如 7c；牌碼間以空白分隔。n=0 只輸出換行。\n限制：0 ≤ n ≤ 52。點數 23456789tjqka；花色 cdhs。同一實作／種子可重現；跨編譯器不保證相同牌序。\n範例輸入：\n5 1\n範例輸出：\n5 張合法、互不重複的牌\n（精確序列依 C 函式庫而異）\n\n【課堂提問】\n發到重複牌時，能否把 dealt 加一？\n\n【參考答案】\n不可以。dealt 代表成功輸出的不同牌張數，而不是抽樣嘗試次數。只有確認新牌後才增加。\n\n【來源與增補】\nA pp.49–55\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":43,"title":"案例 07｜核心解法與圖解","text":"【本頁目標】\n案例 07｜核心解法與圖解\n不重複發牌與狀態表\n\n【教師講解】\n依下列順序帶讀圖解：1. rand()%4 與 rand()%13 取得花色、點數。 2. in_hand[suit][rank] 已為 true 就重新抽。 3. 新牌才標記、輸出並增加 dealt；查表轉成牌碼。 rand()%n 可能有模數偏差；這是陣列與狀態管理練習，不是公平抽獎或密碼用途的亂數設計。\n\n【課堂提問】\n發到重複牌時，能否把 dealt 加一？\n\n【參考答案】\n不可以。dealt 代表成功輸出的不同牌張數，而不是抽樣嘗試次數。只有確認新牌後才增加。\n\n【來源與增補】\nA pp.49–55\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":44,"title":"案例 07｜完整程式 1/2","text":"【本頁目標】\n案例 07｜完整程式 1/2\n07_deal_cards.c\n\n【教師講解】\n本頁為 07_deal_cards.c 的第 1/2 段，對應原始檔第 1～15 行。所有程式頁依序接續，沒有省略程式碼。以 4×13 的布林表追蹤每張牌，const 字元表用於把索引轉成點數和花色。輸入張數上限 52，避免要求不可能的手牌。\n\n【程式帶讀】\n對應 07_deal_cards.c，原始碼第 1～15 行。這是完整檔案第 1/2 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n#include \u003cstdbool.h>\n#include \u003cstdio.h>\n#include \u003cstdlib.h>\n#define SUITS 4\n#define RANKS 13\n\nint main(void) {\n    const char ranks[] = \"23456789tjqka\";\n    const char suits[] = \"cdhs\";\n    bool in_hand[SUITS][RANKS] = {{false}};\n    int n;\n    unsigned seed;\n    if (scanf(\"%d%u\", &n, &seed) != 2 || n \u003c 0 || n > 52) {\n        fputs(\"Expected count 0..52 and unsigned seed\\n\", stderr);\n        return EXIT_FAILURE;\n\n【課堂提問】\n發到重複牌時，能否把 dealt 加一？\n\n【參考答案】\n不可以。dealt 代表成功輸出的不同牌張數，而不是抽樣嘗試次數。只有確認新牌後才增加。\n\n【來源與增補】\nA pp.49–55\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":45,"title":"案例 07｜完整程式 2/2","text":"【本頁目標】\n案例 07｜完整程式 2/2\n07_deal_cards.c\n\n【教師講解】\n本頁為 07_deal_cards.c 的第 2/2 段，對應原始檔第 16～30 行。所有程式頁依序接續，沒有省略程式碼。初始化亂數種子後反覆挑選 suit 與 rank。只有未出現的牌才標記、輸出並增加已發張數。測試重點是不重複與有效牌值，不是跨平台固定的亂數輸出。\n\n【程式帶讀】\n對應 07_deal_cards.c，原始碼第 16～30 行。這是完整檔案第 2/2 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n    }\n    srand(seed);\n    int dealt = 0;\n    while (dealt \u003c n) {\n        int suit = rand() % SUITS;\n        int rank = rand() % RANKS;\n        if (in_hand[suit][rank]) continue;\n        in_hand[suit][rank] = true;\n        printf(\"%c%c%s\", ranks[rank], suits[suit],\n               dealt + 1 == n ? \"\" : \" \");\n        ++dealt;\n    }\n    putchar('\\n');\n    return EXIT_SUCCESS;\n}\n\n【課堂提問】\n發到重複牌時，能否把 dealt 加一？\n\n【參考答案】\n不可以。dealt 代表成功輸出的不同牌張數，而不是抽樣嘗試次數。只有確認新牌後才增加。\n\n【來源與增補】\nA pp.49–55\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":46,"title":"案例 07｜測試與常見錯誤","text":"【本頁目標】\n案例 07｜測試與常見錯誤\n先預測結果，再執行；不只測一般資料。\n\n【教師講解】\n依表格逐組測試，確認返回狀態、stdout、stderr 與檔案內容。rand()%n 可能有模數偏差；這是陣列與狀態管理練習，不是公平抽獎或密碼用途的亂數設計。 對隨機或平台相依輸出，應測試性質，而不是把單一次執行結果當成唯一答案。\n\n【測試判讀】\n不發牌｜n=0｜空行｜不進入發牌迴圈\n一般｜n=5，seed=1｜5 張且不重複｜驗證性質，不鎖定跨平台牌序\n整副牌｜n=52｜52 個互異合法牌碼｜狀態表覆蓋完整牌組\n超量｜n=53｜立即失敗｜避免永遠等不到新牌\n可重現｜同一執行檔，同 seed｜兩次牌序相同｜可重現實驗\n本頁列出教學代表測試。附件測試器另外包含一般值、邊界與錯誤路徑；未模擬磁碟滿載、斷電、併發或所有作業系統。\n\n【課堂提問】\n發到重複牌時，能否把 dealt 加一？\n\n【參考答案】\n不可以。dealt 代表成功輸出的不同牌張數，而不是抽樣嘗試次數。只有確認新牌後才增加。\n\n【來源與增補】\nA pp.49–55\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"}],"source_tests":["不發牌｜n=0｜空行｜不進入發牌迴圈","一般｜n=5，seed=1｜5 張且不重複｜驗證性質，不鎖定跨平台牌序","整副牌｜n=52｜52 個互異合法牌碼｜狀態表覆蓋完整牌組","超量｜n=53｜立即失敗｜避免永遠等不到新牌","可重現｜同一執行檔，同 seed｜兩次牌序相同｜可重現實驗"],"annotation":{"lines":[[8,17,"設定狀態與種子","四種花色、十三種點數組成 52 個布林格；n=0 仍合法。"],[19,26,"只有新牌才推進 dealt","重複牌走 continue，不消耗名額；查表轉成二字元牌碼。"],[28,29,"結束條件依已發張數","不以抽樣次數作為發牌數；重抽也是程式流程的一部分。"]],"boundary":"HTML 使用 xorshift32 產生可觀察的教學牌序，不模仿 C 函式庫 rand。C 測試驗證張數、牌碼合法與不重複，不固定跨平台的精確牌序。"}},{"task":"寫一個命令列工具，接收一個檔名，檢查本次是否能以讀取模式成功開啟並關閉。","input":"命令列：canopen filename；不從鍵盤另外讀取檔名。","output":"成功：stdout 顯示檔案可開啟。失敗：stderr 顯示原因，回傳 EXIT_FAILURE。","limits":"argc 必須為 2；以本次 fopen 的結果為準。可開啟不代表內容正確，也不保證未來仍可開啟。","sample_in":"canopen sample.txt","sample_out":"sample.txt can be opened","id":"08","num":8,"title":"命令列檔案開啟檢查器","chapter":"22","tag":"原稿案例補強","pages":[55,59],"source":"B pp.38–42｜C pp.6–9","logic":["先驗證 argc，再使用 argv[1]。","fopen 回傳 NULL 就停止；保存 errno 後才輸出訊息。","成功開啟也要檢查 fclose；不要把錯誤訊息寫入 stdout。"],"pitfall":"先用「檔案是否存在」判斷再 fopen 仍可能失敗；權限與狀態可能改變，應檢查真正要做的操作。","question":"argc 為 2 時，argv[0] 與 argv[1] 分別是什麼？","answer":"argv[0] 是程式名稱字串，argv[1] 是使用者傳入的檔名；argv[argc] 是空指標。","codes":[{"filename":"08_canopen.c","pages":[57,58],"code":"#include \u003cerrno.h>\n#include \u003cstdio.h>\n#include \u003cstdlib.h>\n \nint main(int argc, char *argv[]) {\n    if (argc != 2) {\n        fputs(\"usage: canopen filename\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    errno = 0;\n    FILE *fp = fopen(argv[1], \"r\");\n    if (fp == NULL) {\n        int saved_errno = errno;\n        fprintf(stderr, \"Cannot open: %s\\n\", argv[1]);\n        if (saved_errno != 0) {\n            errno = saved_errno;\n            perror(\"fopen\");\n        }\n        return EXIT_FAILURE;\n    }\n    if (fclose(fp) != 0) {\n        fputs(\"Close failed\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    printf(\"%s can be opened\\n\", argv[1]);\n    return EXIT_SUCCESS;\n}\n","sha256":"a10e9a43377c0d79964b06308e7fb400ac5f67a0e0592825bd49d1f3d151ee95","lineCount":27,"html":"\u003cspan class=\"code-line\" data-line=\"1\">\u003cspan class=\"lineno\" aria-hidden=\"true\">1\u003c/span>\u003cspan class=\"cp\">#include\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"cpf\">&lt;errno.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"2\">\u003cspan class=\"lineno\" aria-hidden=\"true\">2\u003c/span>\u003cspan class=\"cp\">#include\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"cpf\">&lt;stdio.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"3\">\u003cspan class=\"lineno\" aria-hidden=\"true\">3\u003c/span>\u003cspan class=\"cp\">#include\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"cpf\">&lt;stdlib.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"4\">\u003cspan class=\"lineno\" aria-hidden=\"true\">4\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"5\">\u003cspan class=\"lineno\" aria-hidden=\"true\">5\u003c/span>\u003cspan class=\"kt\">int\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">main\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"kt\">int\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">argc\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"kt\">char\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">*\u003c/span>\u003cspan class=\"n\">argv\u003c/span>\u003cspan class=\"p\">[])\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">{\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"6\">\u003cspan class=\"lineno\" aria-hidden=\"true\">6\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">if\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">argc\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">!=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">2\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">{\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"7\">\u003cspan class=\"lineno\" aria-hidden=\"true\">7\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"n\">fputs\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s\">&quot;usage: canopen filename\u003c/span>\u003cspan class=\"se\">\\n\u003c/span>\u003cspan class=\"s\">&quot;\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">stderr\u003c/span>\u003cspan class=\"p\">);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"8\">\u003cspan class=\"lineno\" aria-hidden=\"true\">8\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"k\">return\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">EXIT_FAILURE\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"9\">\u003cspan class=\"lineno\" aria-hidden=\"true\">9\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"10\">\u003cspan class=\"lineno\" aria-hidden=\"true\">10\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"n\">errno\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"11\">\u003cspan class=\"lineno\" aria-hidden=\"true\">11\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"kt\">FILE\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">*\u003c/span>\u003cspan class=\"n\">fp\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">fopen\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">argv\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">],\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s\">&quot;r&quot;\u003c/span>\u003cspan class=\"p\">);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"12\">\u003cspan class=\"lineno\" aria-hidden=\"true\">12\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">if\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">fp\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">==\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nb\">NULL\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">{\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"13\">\u003cspan class=\"lineno\" aria-hidden=\"true\">13\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"kt\">int\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">saved_errno\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">errno\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"14\">\u003cspan class=\"lineno\" aria-hidden=\"true\">14\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"n\">fprintf\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">stderr\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s\">&quot;Cannot open: %s\u003c/span>\u003cspan class=\"se\">\\n\u003c/span>\u003cspan class=\"s\">&quot;\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">argv\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">]);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"15\">\u003cspan class=\"lineno\" aria-hidden=\"true\">15\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"k\">if\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">saved_errno\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">!=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">{\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"16\">\u003cspan class=\"lineno\" aria-hidden=\"true\">16\u003c/span>\u003cspan class=\"w\">            \u003c/span>\u003cspan class=\"n\">errno\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">saved_errno\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"17\">\u003cspan class=\"lineno\" aria-hidden=\"true\">17\u003c/span>\u003cspan class=\"w\">            \u003c/span>\u003cspan class=\"n\">perror\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s\">&quot;fopen&quot;\u003c/span>\u003cspan class=\"p\">);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"18\">\u003cspan class=\"lineno\" aria-hidden=\"true\">18\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"19\">\u003cspan class=\"lineno\" aria-hidden=\"true\">19\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"k\">return\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">EXIT_FAILURE\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"20\">\u003cspan class=\"lineno\" aria-hidden=\"true\">20\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"21\">\u003cspan class=\"lineno\" aria-hidden=\"true\">21\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">if\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">fclose\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">fp\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">!=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">{\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"22\">\u003cspan class=\"lineno\" aria-hidden=\"true\">22\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"n\">fputs\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s\">&quot;Close failed\u003c/span>\u003cspan class=\"se\">\\n\u003c/span>\u003cspan class=\"s\">&quot;\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">stderr\u003c/span>\u003cspan class=\"p\">);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"23\">\u003cspan class=\"lineno\" aria-hidden=\"true\">23\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"k\">return\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">EXIT_FAILURE\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"24\">\u003cspan class=\"lineno\" aria-hidden=\"true\">24\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"25\">\u003cspan class=\"lineno\" aria-hidden=\"true\">25\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"n\">printf\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s\">&quot;%s can be opened\u003c/span>\u003cspan class=\"se\">\\n\u003c/span>\u003cspan class=\"s\">&quot;\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">argv\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">]);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"26\">\u003cspan class=\"lineno\" aria-hidden=\"true\">26\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">return\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">EXIT_SUCCESS\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"27\">\u003cspan class=\"lineno\" aria-hidden=\"true\">27\u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>","build":"gcc -std=c17 -Wall -Wextra -Wpedantic 08_canopen.c -o 08_canopen"}],"notes":[{"page":55,"title":"案例 08｜命令列檔案開啟檢查器","text":"【本頁目標】\n案例 08｜命令列檔案開啟檢查器\n完整題目：先確認任務、輸入、輸出與限制\n\n【教師講解】\n先不要展示解答。請學生用自己的話重述任務，再指出輸入格式、輸出格式與無效資料的處理。寫一個命令列工具，接收一個檔名，檢查本次是否能以讀取模式成功開啟並關閉。 argc 必須為 2；以本次 fopen 的結果為準。可開啟不代表內容正確，也不保證未來仍可開啟。\n\n【完整規格】\n任務：寫一個命令列工具，接收一個檔名，檢查本次是否能以讀取模式成功開啟並關閉。\n輸入：命令列：canopen filename；不從鍵盤另外讀取檔名。\n輸出：成功：stdout 顯示檔案可開啟。失敗：stderr 顯示原因，回傳 EXIT_FAILURE。\n限制：argc 必須為 2；以本次 fopen 的結果為準。可開啟不代表內容正確，也不保證未來仍可開啟。\n範例輸入：\ncanopen sample.txt\n範例輸出：\nsample.txt can be opened\n\n【課堂提問】\nargc 為 2 時，argv[0] 與 argv[1] 分別是什麼？\n\n【參考答案】\nargv[0] 是程式名稱字串，argv[1] 是使用者傳入的檔名；argv[argc] 是空指標。\n\n【來源與增補】\nB pp.38–42｜C pp.6–9\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":56,"title":"案例 08｜核心解法與圖解","text":"【本頁目標】\n案例 08｜核心解法與圖解\n命令列檔案開啟檢查器\n\n【教師講解】\n依下列順序帶讀圖解：1. 先驗證 argc，再使用 argv[1]。 2. fopen 回傳 NULL 就停止；保存 errno 後才輸出訊息。 3. 成功開啟也要檢查 fclose；不要把錯誤訊息寫入 stdout。 先用「檔案是否存在」判斷再 fopen 仍可能失敗；權限與狀態可能改變，應檢查真正要做的操作。\n\n【課堂提問】\nargc 為 2 時，argv[0] 與 argv[1] 分別是什麼？\n\n【參考答案】\nargv[0] 是程式名稱字串，argv[1] 是使用者傳入的檔名；argv[argc] 是空指標。\n\n【來源與增補】\nB pp.38–42｜C pp.6–9\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":57,"title":"案例 08｜完整程式 1/2","text":"【本頁目標】\n案例 08｜完整程式 1/2\n08_canopen.c\n\n【教師講解】\n本頁為 08_canopen.c 的第 1/2 段，對應原始檔第 1～14 行。所有程式頁依序接續，沒有省略程式碼。先檢查 argc 才能使用 argv[1]；把 errno 清零後呼叫 fopen，成功與否由 fp 是否為 NULL 決定。\n\n【程式帶讀】\n對應 08_canopen.c，原始碼第 1～14 行。這是完整檔案第 1/2 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n#include \u003cerrno.h>\n#include \u003cstdio.h>\n#include \u003cstdlib.h>\n\nint main(int argc, char *argv[]) {\n    if (argc != 2) {\n        fputs(\"usage: canopen filename\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    errno = 0;\n    FILE *fp = fopen(argv[1], \"r\");\n    if (fp == NULL) {\n        int saved_errno = errno;\n        fprintf(stderr, \"Cannot open: %s\\n\", argv[1]);\n\n【課堂提問】\nargc 為 2 時，argv[0] 與 argv[1] 分別是什麼？\n\n【參考答案】\nargv[0] 是程式名稱字串，argv[1] 是使用者傳入的檔名；argv[argc] 是空指標。\n\n【來源與增補】\nB pp.38–42｜C pp.6–9\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":58,"title":"案例 08｜完整程式 2/2","text":"【本頁目標】\n案例 08｜完整程式 2/2\n08_canopen.c\n\n【教師講解】\n本頁為 08_canopen.c 的第 2/2 段，對應原始檔第 15～27 行。所有程式頁依序接續，沒有省略程式碼。失敗時先保存 errno，避免診斷輸出改變它，再視情況以 perror 補充原因。成功路徑仍檢查 fclose，不把開檔成功當成整段流程已成功。\n\n【程式帶讀】\n對應 08_canopen.c，原始碼第 15～27 行。這是完整檔案第 2/2 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n        if (saved_errno != 0) {\n            errno = saved_errno;\n            perror(\"fopen\");\n        }\n        return EXIT_FAILURE;\n    }\n    if (fclose(fp) != 0) {\n        fputs(\"Close failed\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    printf(\"%s can be opened\\n\", argv[1]);\n    return EXIT_SUCCESS;\n}\n\n【課堂提問】\nargc 為 2 時，argv[0] 與 argv[1] 分別是什麼？\n\n【參考答案】\nargv[0] 是程式名稱字串，argv[1] 是使用者傳入的檔名；argv[argc] 是空指標。\n\n【來源與增補】\nB pp.38–42｜C pp.6–9\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":59,"title":"案例 08｜測試與常見錯誤","text":"【本頁目標】\n案例 08｜測試與常見錯誤\n先預測結果，再執行；不只測一般資料。\n\n【教師講解】\n依表格逐組測試，確認返回狀態、stdout、stderr 與檔案內容。先用「檔案是否存在」判斷再 fopen 仍可能失敗；權限與狀態可能改變，應檢查真正要做的操作。 對隨機或平台相依輸出，應測試性質，而不是把單一次執行結果當成唯一答案。\n\n【測試判讀】\n檔案存在｜sample.txt｜成功並關閉｜正常流程\n不存在｜absent.txt｜失敗；stderr｜不能使用 NULL 串流\n漏參數｜canopen｜usage 訊息；失敗｜先驗證 argc\n多參數｜canopen a b｜usage 訊息；失敗｜介面規格固定\n本頁列出教學代表測試。附件測試器另外包含一般值、邊界與錯誤路徑；未模擬磁碟滿載、斷電、併發或所有作業系統。\n\n【課堂提問】\nargc 為 2 時，argv[0] 與 argv[1] 分別是什麼？\n\n【參考答案】\nargv[0] 是程式名稱字串，argv[1] 是使用者傳入的檔名；argv[argc] 是空指標。\n\n【來源與增補】\nB pp.38–42｜C pp.6–9\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"}],"source_tests":["檔案存在｜sample.txt｜成功並關閉｜正常流程","不存在｜absent.txt｜失敗；stderr｜不能使用 NULL 串流","漏參數｜canopen｜usage 訊息；失敗｜先驗證 argc","多參數｜canopen a b｜usage 訊息；失敗｜介面規格固定"],"annotation":{"lines":[[5,8,"先檢查 argc","argv[1] 是命令列引數，不是以 scanf 讀取；參數不足時不得直接解參考。"],[10,20,"保存失敗當下的診斷","fopen 回傳 NULL 是主要失敗訊號；先保存 errno，避免後續輸出擾動診斷狀態。"],[21,26,"關閉成功才回報成功","開啟成功不代表關閉必然成功；診斷寫到 stderr，正常結果寫到 stdout。"]],"boundary":"互動的「檔案存在／缺少／關閉失敗」是虛擬情境，不會存取電腦路徑。作業系統的 perror 字串不被當作固定答案。"}},{"task":"讀入一行日期，接受 YYYY-MM-DD 或 YYYY/MM/DD，驗證實際日曆日期後，統一輸出 YYYY-MM-DD。","input":"一行 10 個字元的日期；允許行尾 LF、CRLF 或最後一行無換行。","output":"有效日期：輸出正規化結果；無效：stderr 訊息並失敗。","limits":"1900～2099 年；年月日必須分別為 4/2/2 位數；兩個分隔符須相同。不能有多餘字元或空白。輸入為無 NUL 的文字。","sample_in":"2024/02/29","sample_out":"2024-02-29","id":"09","num":9,"title":"日期字串：格式合法不等於日期存在","chapter":"22","tag":"新增案例","pages":[68,73],"source":"B pp.132–135,161–171｜新增","logic":["fgets 取得一整行，只移除行尾 CR/LF。","先驗證長度與數字位置，再以 sscanf 拆欄位。","檢查月份、閏年與當月天數，最後 snprintf 並檢查截斷。"],"pitfall":"只檢查 sscanf 回傳 3 或 5，只能證明欄位解析成功，不能證明日期在日曆中存在。","question":"為何本題先檢查數字位置，再呼叫 sscanf？","answer":"先確定欄位恰好是 4/2/2 位數，避免寬度只是上限而非固定長度的誤解，也讓數值一定在可表示範圍內。","codes":[{"filename":"09_date_parser.c","pages":[70,71,72],"code":"#include \u003cctype.h>\n#include \u003cstdio.h>\n#include \u003cstdlib.h>\n#include \u003cstring.h>\n \nint main(void) {\n    char line[64], sep1, sep2, extra;\n    int y, m, d;\n    if (fgets(line, sizeof line, stdin) == NULL) {\n        fputs(\"Missing date\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    size_t len = strlen(line);\n    if (len > 0 && line[len - 1] == '\\n') --len;\n    if (len > 0 && line[len - 1] == '\\r') --len;\n    if (len != 10) {\n        fputs(\"Expected YYYY-MM-DD or YYYY/MM/DD\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n ">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"47\">\u003cspan class=\"lineno\" aria-hidden=\"true\">47\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"48\">\u003cspan class=\"lineno\" aria-hidden=\"true\">48\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"n\">puts\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">out\u003c/span>\u003cspan class=\"p\">);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"49\">\u003cspan class=\"lineno\" aria-hidden=\"true\">49\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">return\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">EXIT_SUCCESS\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"50\">\u003cspan class=\"lineno\" aria-hidden=\"true\">50\u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>","build":"gcc -std=c17 -Wall -Wextra -Wpedantic 09_date_parser.c -o 09_date_parser"}],"notes":[{"page":68,"title":"案例 09｜日期字串：格式合法不等於日期存在","text":"【本頁目標】\n案例 09｜日期字串：格式合法不等於日期存在\n完整題目：先確認任務、輸入、輸出與限制\n\n【教師講解】\n先不要展示解答。請學生用自己的話重述任務，再指出輸入格式、輸出格式與無效資料的處理。讀入一行日期，接受 YYYY-MM-DD 或 YYYY/MM/DD，驗證實際日曆日期後，統一輸出 YYYY-MM-DD。 1900～2099 年；年月日必須分別為 4/2/2 位數；兩個分隔符須相同。不能有多餘字元或空白。輸入為無 NUL 的文字。\n\n【完整規格】\n任務：讀入一行日期，接受 YYYY-MM-DD 或 YYYY/MM/DD，驗證實際日曆日期後，統一輸出 YYYY-MM-DD。\n輸入：一行 10 個字元的日期；允許行尾 LF、CRLF 或最後一行無換行。\n輸出：有效日期：輸出正規化結果；無效：stderr 訊息並失敗。\n限制：1900～2099 年；年月日必須分別為 4/2/2 位數；兩個分隔符須相同。不能有多餘字元或空白。輸入為無 NUL 的文字。\n範例輸入：\n2024/02/29\n範例輸出：\n2024-02-29\n\n【課堂提問】\n為何本題先檢查數字位置，再呼叫 sscanf？\n\n【參考答案】\n先確定欄位恰好是 4/2/2 位數，避免寬度只是上限而非固定長度的誤解，也讓數值一定在可表示範圍內。\n\n【來源與增補】\nB pp.132–135,161–171｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":69,"title":"案例 09｜核心解法與圖解","text":"【本頁目標】\n案例 09｜核心解法與圖解\n日期字串：格式合法不等於日期存在\n\n【教師講解】\n依下列順序帶讀圖解：1. fgets 取得一整行，只移除行尾 CR/LF。 2. 先驗證長度與數字位置，再以 sscanf 拆欄位。 3. 檢查月份、閏年與當月天數，最後 snprintf 並檢查截斷。 只檢查 sscanf 回傳 3 或 5，只能證明欄位解析成功，不能證明日期在日曆中存在。\n\n【課堂提問】\n為何本題先檢查數字位置，再呼叫 sscanf？\n\n【參考答案】\n先確定欄位恰好是 4/2/2 位數，避免寬度只是上限而非固定長度的誤解，也讓數值一定在可表示範圍內。\n\n【來源與增補】\nB pp.132–135,161–171｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":70,"title":"案例 09｜完整程式 1/3","text":"【本頁目標】\n案例 09｜完整程式 1/3\n09_date_parser.c\n\n【教師講解】\n本頁為 09_date_parser.c 的第 1/3 段，對應原始檔第 1～17 行。所有程式頁依序接續，沒有省略程式碼。以 fgets 取得有限長度文字，僅去掉末端 LF 與 CR；要求日期本體恰為 10 字元，不接受尾端雜字。\n\n【程式帶讀】\n對應 09_date_parser.c，原始碼第 1～17 行。這是完整檔案第 1/3 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n#include \u003cctype.h>\n#include \u003cstdio.h>\n#include \u003cstdlib.h>\n#include \u003cstring.h>\n\nint main(void) {\n    char line[64], sep1, sep2, extra;\n    int y, m, d;\n    if (fgets(line, sizeof line, stdin) == NULL) {\n        fputs(\"Missing date\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    size_t len = strlen(line);\n    if (len > 0 && line[len - 1] == '\\n') --len;\n    if (len > 0 && line[len - 1] == '\\r') --len;\n    if (len != 10) {\n        fputs(\"Expected YYYY-MM-DD or YYYY/MM/DD\\n\", stderr);\n\n【課堂提問】\n為何本題先檢查數字位置，再呼叫 sscanf？\n\n【參考答案】\n先確定欄位恰好是 4/2/2 位數，避免寬度只是上限而非固定長度的誤解，也讓數值一定在可表示範圍內。\n\n【來源與增補】\nB pp.132–135,161–171｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":71,"title":"案例 09｜完整程式 2/3","text":"【本頁目標】\n案例 09｜完整程式 2/3\n09_date_parser.c\n\n【教師講解】\n本頁為 09_date_parser.c 的第 2/3 段，對應原始檔第 18～34 行。所有程式頁依序接續，沒有省略程式碼。先驗證數字位置及分隔符，再使用有欄寬的 sscanf 取得年月日。年份限制 1900～2099，兩個分隔符必須相同。\n\n【程式帶讀】\n對應 09_date_parser.c，原始碼第 18～34 行。這是完整檔案第 2/3 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n        return EXIT_FAILURE;\n    }\n    line[len] = '\\0';\n    for (size_t i = 0; i \u003c len; ++i) {\n        if (i != 4 && i != 7 &&\n            !isdigit((unsigned char)line[i])) {\n            fputs(\"Invalid date digits\\n\", stderr);\n            return EXIT_FAILURE;\n        }\n    }\n    if (sscanf(line, \"%4d%c%2d%c%2d%c\",\n               &y, &sep1, &m, &sep2, &d, &extra) != 5 ||\n        sep1 != sep2 || (sep1 != '-' && sep1 != '/') ||\n        y \u003c 1900 || y > 2099 || m \u003c 1 || m > 12) {\n        fputs(\"Invalid date format/range\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n\n【課堂提問】\n為何本題先檢查數字位置，再呼叫 sscanf？\n\n【參考答案】\n先確定欄位恰好是 4/2/2 位數，避免寬度只是上限而非固定長度的誤解，也讓數值一定在可表示範圍內。\n\n【來源與增補】\nB pp.132–135,161–171｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":72,"title":"案例 09｜完整程式 3/3","text":"【本頁目標】\n案例 09｜完整程式 3/3\n09_date_parser.c\n\n【教師講解】\n本頁為 09_date_parser.c 的第 3/3 段，對應原始檔第 35～50 行。所有程式頁依序接續，沒有省略程式碼。依月份及閏年規則驗證日期範圍，最後以 snprintf 建立 YYYY-MM-DD。檢查回傳長度，完整輸出才回報成功。\n\n【程式帶讀】\n對應 09_date_parser.c，原始碼第 35～50 行。這是完整檔案第 3/3 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n    const int days[] = {31,28,31,30,31,30,31,31,30,31,30,31};\n    int leap = y % 400 == 0 || (y % 4 == 0 && y % 100 != 0);\n    int limit = days[m - 1] + (m == 2 && leap);\n    if (d \u003c 1 || d > limit) {\n        fputs(\"Invalid day\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    char out[11];\n    int written = snprintf(out, sizeof out, \"%04d-%02d-%02d\", y, m, d);\n    if (written \u003c 0 || (size_t)written >= sizeof out) {\n        fputs(\"Formatting failed\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    puts(out);\n    return EXIT_SUCCESS;\n}\n\n【課堂提問】\n為何本題先檢查數字位置，再呼叫 sscanf？\n\n【參考答案】\n先確定欄位恰好是 4/2/2 位數，避免寬度只是上限而非固定長度的誤解，也讓數值一定在可表示範圍內。\n\n【來源與增補】\nB pp.132–135,161–171｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":73,"title":"案例 09｜測試與常見錯誤","text":"【本頁目標】\n案例 09｜測試與常見錯誤\n先預測結果，再執行；不只測一般資料。\n\n【教師講解】\n依表格逐組測試，確認返回狀態、stdout、stderr 與檔案內容。只檢查 sscanf 回傳 3 或 5，只能證明欄位解析成功，不能證明日期在日曆中存在。 對隨機或平台相依輸出，應測試性質，而不是把單一次執行結果當成唯一答案。\n\n【測試判讀】\n閏年｜2024/02/29｜2024-02-29｜可被 4 整除且非百年例外\n平年｜2025-02-29｜失敗｜成功解析不代表日期存在\n百年例外｜1900-02-29｜失敗｜1900 不是閏年\n分隔符混用｜2024-02/29｜失敗｜兩個分隔符需一致\n尾端垃圾｜2024-02-29x｜失敗｜不可只接受合法前綴\n本頁列出教學代表測試。附件測試器另外包含一般值、邊界與錯誤路徑；未模擬磁碟滿載、斷電、併發或所有作業系統。\n\n【課堂提問】\n為何本題先檢查數字位置，再呼叫 sscanf？\n\n【參考答案】\n先確定欄位恰好是 4/2/2 位數，避免寬度只是上限而非固定長度的誤解，也讓數值一定在可表示範圍內。\n\n【來源與增補】\nB pp.132–135,161–171｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"}],"source_tests":["閏年｜2024/02/29｜2024-02-29｜可被 4 整除且非百年例外","平年｜2025-02-29｜失敗｜成功解析不代表日期存在","百年例外｜1900-02-29｜失敗｜1900 不是閏年","分隔符混用｜2024-02/29｜失敗｜兩個分隔符需一致","尾端垃圾｜2024-02-29x｜失敗｜不可只接受合法前綴"],"annotation":{"lines":[[9,20,"限制輸入的外觀","讀取後僅移除尾端 LF／CR，長度必須是 10；不會任意 trim 掉前後空白。"],[21,34,"分開檢查字元與欄位","先確認數字所在位置，再檢查 sscanf 的成功數、兩個分隔符及年月範圍。"],[35,48,"判斷日曆，再格式化","天數表搭配閏年規則，最後以 11 格陣列容納 10 字元與 NUL，並檢查 snprintf 結果。"]],"boundary":"日期圖解沿用 1900～2099 年及固定 4/2/2 位格式，不擴充成任意地區的日期解析器。"}},{"task":"複製任意文字或二進位檔案，保留所有位元組。實作逐字元與區塊兩版，且不得覆寫任何既有目的檔。","input":"命令列：copy_character source new_destination，或 copy_block source new_destination。","output":"成功：目的檔每個位元組與來源一致，stdout 顯示 Copy complete。","limits":"目的檔必須不存在；使用 C17 的 wbx 建立。檢查讀、寫、關閉錯誤；失敗時嘗試刪除本次建立的不完整檔。","sample_in":"copy_block input.bin copy.bin","sample_out":"Copy complete\ncopy.bin 與 input.bin 位元組完全一致","id":"10","num":10,"title":"安全複製：逐字元版與區塊版","chapter":"22","tag":"原稿案例補強","pages":[76,84],"source":"B pp.117–128,138–146｜新增防護","logic":["來源用 rb；目的用 wbx，避免既有檔案被截斷。","逐字元版：int 接 fgetc；區塊版：以 n 傳遞有效長度。","結束後查 ferror 與 fclose；任何失敗都不能宣稱複製完成。"],"pitfall":"若使用 wb，開檔當下就可能毀掉原內容。fwrite 必須寫本次 fread 回傳的 n，而不是固定 4096。","question":"區塊版的 fread(buffer,1,sizeof buffer,in) 回傳的是什麼？","answer":"回傳完整元素數；因每個元素大小設成 1 byte，所以這個案例的回傳值也就是有效位元組數。","codes":[{"filename":"10a_copy_character.c","pages":[78,79,80],"code":"#include \u003cstdio.h>\n#include \u003cstdlib.h>\n \nint main(int argc, char *argv[]) {\n    if (argc != 3) {\n        fputs(\"usage: copy_character source new_destination\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    FILE *in = fopen(argv[1], \"rb\");\n    if (in == NULL) {\n        fputs(\"Cannot open source\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    FILE *out = fopen(argv[2], \"wbx\");\n    if (out == NULL) {\n        fputs(\"Destination exists or cannot be created\\n\", stderr);\n        fclose(in);\n        return EXIT_FAILURE;\n    }\n    int ch, failed = 0;\n    while ((ch = fgetc(in)) != EOF) {\n        if (fputc(ch, out) == EOF) {\n            failed = 1;\n            break;\n        }\n    }\n    if (ferror(in)) failed = 1;\n    if (fclose(in) != 0) failed = 1;\n    if (fclose(out) != 0) failed = 1;\n    if (failed) {\n        fputs(\"Copy failed; removing partial output\\n\", stderr);\n        if (remove(argv[2]) != 0)\n            fputs(\"Warning: partial output remains\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    puts(\"Copy complete\");\n    return EXIT_SUCCESS;\n}\n","sha256":"23a380c252f18a246a16cfba9ae13eee3828b4c0ed20c6d273b5ade92e185e86","lineCount":38,"html":"\u003cspan class=\"code-line\" data-line=\"1\">\u003cspan class=\"lineno\" aria-hidden=\"true\">1\u003c/span>\u003cspan class=\"cp\">#include\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"cpf\">&lt;stdio.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"2\">\u003cspan class=\"lineno\" aria-hidden=\"true\">2\u003c/span>\u003cspan class=\"cp\">#include\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"cpf\">&lt;stdlib.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"3\">\u003cspan class=\"lineno\" aria-hidden=\"true\">3\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"4\">\u003cspan class=\"lineno\" aria-hidden=\"true\">4\u003c/span>\u003cspan class=\"kt\">int\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">main\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"kt\">int\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">argc\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"kt\">char\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">*\u003c/span>\u003cspan class=\"n\">argv\u003c/span>\u003cspan class=\"p\">[])\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">{\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"5\">\u003cspan class=\"lineno\" aria-hidden=\"true\">5\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">if\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">argc\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">!=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">3\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">{\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"6\">\u003cspan class=\"lineno\" aria-hidden=\"true\">6\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"n\">fputs\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s\">&quot;usage: copy_character source new_destination\u003c/span>\u003cspan class=\"se\">\\n\u003c/span>\u003cspan class=\"s\">&quot;\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">stderr\u003c/span>\u003cspan class=\"p\">);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"7\">\u003cspan class=\"lineno\" aria-hidden=\"true\">7\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003c ss=\"w\">    \u003c/span>\u003cspan class=\"n\">puts\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s\">&quot;Copy complete&quot;\u003c/span>\u003cspan class=\"p\">);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"39\">\u003cspan class=\"lineno\" aria-hidden=\"true\">39\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">return\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">EXIT_SUCCESS\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"40\">\u003cspan class=\"lineno\" aria-hidden=\"true\">40\u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>","build":"gcc -std=c17 -Wall -Wextra -Wpedantic 10b_copy_block.c -o 10b_copy_block"}],"notes":[{"page":76,"title":"案例 10｜安全複製：逐字元版與區塊版","text":"【本頁目標】\n案例 10｜安全複製：逐字元版與區塊版\n完整題目：先確認任務、輸入、輸出與限制\n\n【教師講解】\n先不要展示解答。請學生用自己的話重述任務，再指出輸入格式、輸出格式與無效資料的處理。複製任意文字或二進位檔案，保留所有位元組。實作逐字元與區塊兩版，且不得覆寫任何既有目的檔。 目的檔必須不存在；使用 C17 的 wbx 建立。檢查讀、寫、關閉錯誤；失敗時嘗試刪除本次建立的不完整檔。\n\n【完整規格】\n任務：複製任意文字或二進位檔案，保留所有位元組。實作逐字元與區塊兩版，且不得覆寫任何既有目的檔。\n輸入：命令列：copy_character source new_destination，或 copy_block source new_destination。\n輸出：成功：目的檔每個位元組與來源一致，stdout 顯示 Copy complete。\n限制：目的檔必須不存在；使用 C17 的 wbx 建立。檢查讀、寫、關閉錯誤；失敗時嘗試刪除本次建立的不完整檔。\n範例輸入：\ncopy_block input.bin copy.bin\n範例輸出：\nCopy complete\ncopy.bin 與 input.bin 位元組完全一致\n\n【課堂提問】\n區塊版的 fread(buffer,1,sizeof buffer,in) 回傳的是什麼？\n\n【參考答案】\n回傳完整元素數；因每個元素大小設成 1 byte，所以這個案例的回傳值也就是有效位元組數。\n\n【來源與增補】\nB pp.117–128,138–146｜新增防護\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":77,"title":"案例 10｜核心解法與圖解","text":"【本頁目標】\n案例 10｜核心解法與圖解\n安全複製：逐字元版與區塊版\n\n【教師講解】\n依下列順序帶讀圖解：1. 來源用 rb；目的用 wbx，避免既有檔案被截斷。 2. 逐字元版：int 接 fgetc；區塊版：以 n 傳遞有效長度。 3. 結束後查 ferror 與 fclose；任何失敗都不能宣稱複製完成。 若使用 wb，開檔當下就可能毀掉原內容。fwrite 必須寫本次 fread 回傳的 n，而不是固定 4096。\n\n【課堂提問】\n區塊版的 fread(buffer,1,sizeof buffer,in) 回傳的是什麼？\n\n【參考答案】\n回傳完整元素數；因每個元素大小設成 1 byte，所以這個案例的回傳值也就是有效位元組數。\n\n【來源與增補】\nB pp.117–128,138–146｜新增防護\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":78,"title":"案例 10｜完整程式 1/3","text":"【本頁目標】\n案例 10｜完整程式 1/3\n10a_copy_character.c\n\n【教師講解】\n本頁為 10a_copy_character.c 的第 1/3 段，對應原始檔第 1～13 行。所有程式頁依序接續，沒有省略程式碼。驗證來源與目的路徑參數；來源以 rb 開啟，目的以 wbx 建立，已存在的目的檔必須保留不動。\n\n【程式帶讀】\n對應 10a_copy_character.c，原始碼第 1～13 行。這是完整檔案第 1/3 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n#include \u003cstdio.h>\n#include \u003cstdlib.h>\n\nint main(int argc, char *argv[]) {\n    if (argc != 3) {\n        fputs(\"usage: copy_character source new_destination\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    FILE *in = fopen(argv[1], \"rb\");\n    if (in == NULL) {\n        fputs(\"Cannot open source\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n\n【課堂提問】\n區塊版的 fread(buffer,1,sizeof buffer,in) 回傳的是什麼？\n\n【參考答案】\n回傳完整元素數；因每個元素大小設成 1 byte，所以這個案例的回傳值也就是有效位元組數。\n\n【來源與增補】\nB pp.117–128,138–146｜新增防護\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":79,"title":"案例 10｜完整程式 2/3","text":"【本頁目標】\n案例 10｜完整程式 2/3\n10a_copy_character.c\n\n【教師講解】\n本頁為 10a_copy_character.c 的第 2/3 段，對應原始檔第 14～26 行。所有程式頁依序接續，沒有省略程式碼。目的建立失敗就關閉已取得的來源；成功後用 int 接收 fgetc，以 EOF 作讀取結束訊號，逐字元檢查 fputc。\n\n【程式帶讀】\n對應 10a_copy_character.c，原始碼第 14～26 行。這是完整檔案第 2/3 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n    FILE *out = fopen(argv[2], \"wbx\");\n    if (out == NULL) {\n        fputs(\"Destination exists or cannot be created\\n\", stderr);\n        fclose(in);\n        return EXIT_FAILURE;\n    }\n    int ch, failed = 0;\n    while ((ch = fgetc(in)) != EOF) {\n        if (fputc(ch, out) == EOF) {\n            failed = 1;\n            break;\n        }\n    }\n\n【課堂提問】\n區塊版的 fread(buffer,1,sizeof buffer,in) 回傳的是什麼？\n\n【參考答案】\n回傳完整元素數；因每個元素大小設成 1 byte，所以這個案例的回傳值也就是有效位元組數。\n\n【來源與增補】\nB pp.117–128,138–146｜新增防護\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":80,"title":"案例 10｜完整程式 3/3","text":"【本頁目標】\n案例 10｜完整程式 3/3\n10a_copy_character.c\n\n【教師講解】\n本頁為 10a_copy_character.c 的第 3/3 段，對應原始檔第 27～38 行。所有程式頁依序接續，沒有省略程式碼。迴圈結束不立即宣告成功；檢查 ferror 及兩次 fclose。任何失敗只移除本次新建的部分目的檔，並回傳失敗。\n\n【程式帶讀】\n對應 10a_copy_character.c，原始碼第 27～38 行。這是完整檔案第 3/3 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n    if (ferror(in)) failed = 1;\n    if (fclose(in) != 0) failed = 1;\n    if (fclose(out) != 0) failed = 1;\n    if (failed) {\n        fputs(\"Copy failed; removing partial output\\n\", stderr);\n        if (remove(argv[2]) != 0)\n            fputs(\"Warning: partial output remains\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    puts(\"Copy complete\");\n    return EXIT_SUCCESS;\n}\n\n【課堂提問】\n區塊版的 fread(buffer,1,sizeof buffer,in) 回傳的是什麼？\n\n【參考答案】\n回傳完整元素數；因每個元素大小設成 1 byte，所以這個案例的回傳值也就是有效位元組數。\n\n【來源與增補】\nB pp.117–128,138–146｜新增防護\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":81,"title":"案例 10｜完整程式 1/3","text":"【本頁目標】\n案例 10｜完整程式 1/3\n10b_copy_block.c\n\n【教師講解】\n本頁為 10b_copy_block.c 的第 1/3 段，對應原始檔第 1～14 行。所有程式頁依序接續，沒有省略程式碼。建立與逐字元版相同的命令列與開檔契約。先 rb 開來源，再以 wbx 拒絕覆寫目的檔。\n\n【程式帶讀】\n對應 10b_copy_block.c，原始碼第 1～14 行。這是完整檔案第 1/3 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n#include \u003cstdio.h>\n#include \u003cstdlib.h>\n\nint main(int argc, char *argv[]) {\n    if (argc != 3) {\n        fputs(\"usage: copy_block source new_destination\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    FILE *in = fopen(argv[1], \"rb\");\n    if (in == NULL) {\n        fputs(\"Cannot open source\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    FILE *out = fopen(argv[2], \"wbx\");\n\n【課堂提問】\n區塊版的 fread(buffer,1,sizeof buffer,in) 回傳的是什麼？\n\n【參考答案】\n回傳完整元素數；因每個元素大小設成 1 byte，所以這個案例的回傳值也就是有效位元組數。\n\n【來源與增補】\nB pp.117–128,138–146｜新增防護\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":82,"title":"案例 10｜完整程式 2/3","text":"【本頁目標】\n案例 10｜完整程式 2/3\n10b_copy_block.c\n\n【教師講解】\n本頁為 10b_copy_block.c 的第 2/3 段，對應原始檔第 15～27 行。所有程式頁依序接續，沒有省略程式碼。使用 unsigned char buffer[4096] 搬移原始 bytes。fread 的 size 為 1，回傳值因此直接是有效 byte 數 n；fwrite 必須使用 n。\n\n【程式帶讀】\n對應 10b_copy_block.c，原始碼第 15～27 行。這是完整檔案第 2/3 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n    if (out == NULL) {\n        fputs(\"Destination exists or cannot be created\\n\", stderr);\n        fclose(in);\n        return EXIT_FAILURE;\n    }\n    unsigned char buffer[4096];\n    size_t n;\n    int failed = 0;\n    while ((n = fread(buffer, 1, sizeof buffer, in)) > 0) {\n        if (fwrite(buffer, 1, n, out) != n) {\n            failed = 1;\n            break;\n        }\n\n【課堂提問】\n區塊版的 fread(buffer,1,sizeof buffer,in) 回傳的是什麼？\n\n【參考答案】\n回傳完整元素數；因每個元素大小設成 1 byte，所以這個案例的回傳值也就是有效位元組數。\n\n【來源與增補】\nB pp.117–128,138–146｜新增防護\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":83,"title":"案例 10｜完整程式 3/3","text":"【本頁目標】\n案例 10｜完整程式 3/3\n10b_copy_block.c\n\n【教師講解】\n本頁為 10b_copy_block.c 的第 3/3 段，對應原始檔第 28～40 行。所有程式頁依序接續，沒有省略程式碼。短讀後檢查來源錯誤，並檢查輸入與輸出的關閉結果。失敗時清理本次新建的部分檔案；成功才印出 Copy complete。\n\n【程式帶讀】\n對應 10b_copy_block.c，原始碼第 28～40 行。這是完整檔案第 3/3 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n    }\n    if (ferror(in)) failed = 1;\n    if (fclose(in) != 0) failed = 1;\n    if (fclose(out) != 0) failed = 1;\n    if (failed) {\n        fputs(\"Copy failed; removing partial output\\n\", stderr);\n        if (remove(argv[2]) != 0)\n            fputs(\"Warning: partial output remains\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    puts(\"Copy complete\");\n    return EXIT_SUCCESS;\n}\n\n【課堂提問】\n區塊版的 fread(buffer,1,sizeof buffer,in) 回傳的是什麼？\n\n【參考答案】\n回傳完整元素數；因每個元素大小設成 1 byte，所以這個案例的回傳值也就是有效位元組數。\n\n【來源與增補】\nB pp.117–128,138–146｜新增防護\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":84,"title":"案例 10｜測試與常見錯誤","text":"【本頁目標】\n案例 10｜測試與常見錯誤\n先預測結果，再執行；不只測一般資料。\n\n【教師講解】\n依表格逐組測試，確認返回狀態、stdout、stderr 與檔案內容。若使用 wb，開檔當下就可能毀掉原內容。fwrite 必須寫本次 fread 回傳的 n，而不是固定 4096。 對隨機或平台相依輸出，應測試性質，而不是把單一次執行結果當成唯一答案。\n\n【測試判讀】\n二進位｜含 00、1A、FF 的檔案｜位元組完全一致｜不能當成 C 字串\n空檔｜0 bytes｜建立 0-byte 目的檔｜EOF 不是錯誤\n區塊邊界｜4096 / 4097 bytes｜無遺失、無額外資料｜最後一塊只寫 n bytes\n目的已存在｜既有檔內容 KEEP｜失敗；KEEP 不變｜x 模式拒絕覆寫\n同一路徑｜來源=目的｜失敗；來源不變｜避免先截斷來源\n本頁列出教學代表測試。附件測試器另外包含一般值、邊界與錯誤路徑；未模擬磁碟滿載、斷電、併發或所有作業系統。\n\n【課堂提問】\n區塊版的 fread(buffer,1,sizeof buffer,in) 回傳的是什麼？\n\n【參考答案】\n回傳完整元素數；因每個元素大小設成 1 byte，所以這個案例的回傳值也就是有效位元組數。\n\n【來源與增補】\nB pp.117–128,138–146｜新增防護\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"}],"source_tests":["二進位｜含 00、1A、FF 的檔案｜位元組完全一致｜不能當成 C 字串","空檔｜0 bytes｜建立 0-byte 目的檔｜EOF 不是錯誤","區塊邊界｜4096 / 4097 bytes｜無遺失、無額外資料｜最後一塊只寫 n bytes","目的已存在｜既有檔內容 KEEP｜失敗；KEEP 不變｜x 模式拒絕覆寫","同一路徑｜來源=目的｜失敗；來源不變｜避免先截斷來源"],"annotation":{"lines":[[9,19,"先開來源，再新建目的檔","rb 保留所有 byte；wbx 要求目的檔不存在。已有目的檔時直接失敗，不截斷舊資料。"],[21,28,"兩種複製粒度","逐字元版用 int 保存 fgetc 回傳值；區塊版用 n 表示本次 fread 真正讀到的 byte 數，最後一塊不能仍寫滿 4096。"],[29,39,"完成條件包含關閉","檢查讀取錯誤及關閉結果；任一失敗只嘗試清理本次產物，不宣稱已完成可靠磁碟交易。"]],"boundary":"本區行號解說主要對應 10b 區塊版；兩份完整程式都可切換查看。互動故障注入為教學模型，與測試紀錄中的實際檔案操作分開列示。"}},{"task":"建立五筆整數庫存的二進位檔，讀出索引 2 的舊值，再直接改成 99，最後重讀整個檔案確認結果。","input":"命令列：stock_update new_binary_file。初始資料固定為 10、20、35、40、50。","output":"顯示 old=35 new=99，及更新後的五筆整數。","limits":"目的檔必須不存在；第 3 筆＝索引 2。原生 int 格式僅限相同實作讀寫；這是定位練習，不提供交易式還原。","sample_in":"stock_update stock.bin","sample_out":"old=35 new=99\n10 20 99 40 50","id":"11","num":11,"title":"直接更新庫存檔的第 3 筆","chapter":"22","tag":"新增案例","pages":[89,94],"source":"B pp.138–160｜原庫存案例改編","logic":["先 wbx 寫入初始陣列，關閉後以 rb+ 重開。","位置 = 2×sizeof(int)；先 fseek 再讀出舊值。","讀→寫前重新定位；寫→讀前再定位到檔首。"],"pitfall":"第 k 筆以 0-based 索引 k 計算 offset；更換平台不能假設 int 永遠是 4 bytes，也不能忽略位元組順序。","question":"讀完索引 2 後，為什麼不能直接 fwrite 覆寫該筆？","answer":"讀取後檔案位置已前進到下一筆，且更新串流的讀→寫需要定位；必須重新 fseek 回索引 2 的起點。","codes":[{"filename":"11_stock_update.c","pages":[91,92,93],"code":"#include \u003cstdio.h>\n#include \u003cstdlib.h>\n \nint main(int argc, char *argv[]) {\n    int stock[5] = {10, 20, 35, 40, 50};\n    int updated = 99, previous;\n    int failed = 0;\n    if (argc != 2) {\n        fputs(\"usage: stock_update new_binary_file\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    FILE *fp = fopen(argv[1], \"wbx\");\n    if (fp == NULL) {\n        fputs(\"Cannot create new stock file\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    if (fwrite(stock, sizeof stock[0], 5, fp) != 5) failed = 1;\n    if (fclose(fp) != 0) failed = 1;\n    if (failed) {\n        fputs(\"Initial write failed\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    fp = fopen(argv[1], \"rb+\");\n    if (fp == NULL) {\n        fputs(\"Cannot reopen stock file\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    long offset = 2L * (long)sizeof stock[0];\n    if (fseek(fp, offset, SEEK_SET) != 0 ||\n        fread(&previous, sizeof previous, 1, fp) != 1 ||\n        fseek(fp, offset, SEEK_SET) != 0 ||\n        fwrite(&updated, sizeof updated, 1, fp) != 1 ||\n        fseek(fp, 0L, SEEK_SET) != 0 ||\n        fread(stock, sizeof stock[0], 5, fp) != 5) {\n        fputs(\"Record update/read failed\\n\", stderr);\n        failed = 1;\n    }\n    if (fclose(fp) != 0) failed = 1;\n    if (failed) return EXIT_FAILURE;\n    printf(\"old=%d new=%d\\n\", previous, stock[2]);\n    for (int i = 0; \"> \u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">||\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"33\">\u003cspan class=\"lineno\" aria-hidden=\"true\">33\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"n\">fseek\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">fp\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mf\">0L\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">SEEK_SET\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">!=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">||\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"34\">\u003cspan class=\"lineno\" aria-hidden=\"true\">34\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"n\">fread\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">stock\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"k\">sizeof\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">stock\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">],\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">5\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">fp\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">!=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">5\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">{\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"35\">\u003cspan class=\"lineno\" aria-hidden=\"true\">35\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"n\">fputs\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s\">&quot;Record update/read failed\u003c/span>\u003cspan class=\"se\">\\n\u003c/span>\u003cspan class=\"s\">&quot;\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">stderr\u003c/span>\u003cspan class=\"p\">);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"36\">\u003cspan class=\"lineno\" aria-hidden=\"true\">36\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"n\">failed\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"37\">\u003cspan class=\"lineno\" aria-hidden=\"true\">37\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"38\">\u003cspan class=\"lineno\" aria-hidden=\"true\">38\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">if\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">fclose\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">fp\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">!=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">failed\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"39\">\u003cspan class=\"lineno\" aria-hidden=\"true\">39\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">if\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">failed\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"k\">return\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">EXIT_FAILURE\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"40\">\u003cspan class=\"lineno\" aria-hidden=\"true\">40\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"n\">printf\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s\">&quot;old=%d new=%d\u003c/span>\u003cspan class=\"se\">\\n\u003c/span>\u003cspan class=\"s\">&quot;\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">previous\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">stock\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">2\u003c/span>\u003cspan class=\"p\">]);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"41\">\u003cspan class=\"lineno\" aria-hidden=\"true\">41\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">for\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"kt\">int\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">&lt;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">5\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">++\u003c/span>\u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"42\">\u003cspan class=\"lineno\" aria-hidden=\"true\">42\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"n\">printf\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s\">&quot;%d%c&quot;\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">stock\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"p\">],\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">==\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">4\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">?\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"sc\">&#39;\\n&#39;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"sc\">&#39; &#39;\u003c/span>\u003cspan class=\"p\">);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"43\">\u003cspan class=\"lineno\" aria-hidden=\"true\">43\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">return\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">EXIT_SUCCESS\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"44\">\u003cspan class=\"lineno\" aria-hidden=\"true\">44\u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>","build":"gcc -std=c17 -Wall -Wextra -Wpedantic 11_stock_update.c -o 11_stock_update"}],"notes":[{"page":89,"title":"案例 11｜直接更新庫存檔的第 3 筆","text":"【本頁目標】\n案例 11｜直接更新庫存檔的第 3 筆\n完整題目：先確認任務、輸入、輸出與限制\n\n【教師講解】\n先不要展示解答。請學生用自己的話重述任務，再指出輸入格式、輸出格式與無效資料的處理。建立五筆整數庫存的二進位檔，讀出索引 2 的舊值，再直接改成 99，最後重讀整個檔案確認結果。 目的檔必須不存在；第 3 筆＝索引 2。原生 int 格式僅限相同實作讀寫；這是定位練習，不提供交易式還原。\n\n【完整規格】\n任務：建立五筆整數庫存的二進位檔，讀出索引 2 的舊值，再直接改成 99，最後重讀整個檔案確認結果。\n輸入：命令列：stock_update new_binary_file。初始資料固定為 10、20、35、40、50。\n輸出：顯示 old=35 new=99，及更新後的五筆整數。\n限制：目的檔必須不存在；第 3 筆＝索引 2。原生 int 格式僅限相同實作讀寫；這是定位練習，不提供交易式還原。\n範例輸入：\nstock_update stock.bin\n範例輸出：\nold=35 new=99\n10 20 99 40 50\n\n【課堂提問】\n讀完索引 2 後，為什麼不能直接 fwrite 覆寫該筆？\n\n【參考答案】\n讀取後檔案位置已前進到下一筆，且更新串流的讀→寫需要定位；必須重新 fseek 回索引 2 的起點。\n\n【來源與增補】\nB pp.138–160｜原庫存案例改編\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":90,"title":"案例 11｜核心解法與圖解","text":"【本頁目標】\n案例 11｜核心解法與圖解\n直接更新庫存檔的第 3 筆\n\n【教師講解】\n依下列順序帶讀圖解：1. 先 wbx 寫入初始陣列，關閉後以 rb+ 重開。 2. 位置 = 2×sizeof(int)；先 fseek 再讀出舊值。 3. 讀→寫前重新定位；寫→讀前再定位到檔首。 第 k 筆以 0-based 索引 k 計算 offset；更換平台不能假設 int 永遠是 4 bytes，也不能忽略位元組順序。\n\n【課堂提問】\n讀完索引 2 後，為什麼不能直接 fwrite 覆寫該筆？\n\n【參考答案】\n讀取後檔案位置已前進到下一筆，且更新串流的讀→寫需要定位；必須重新 fseek 回索引 2 的起點。\n\n【來源與增補】\nB pp.138–160｜原庫存案例改編\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":91,"title":"案例 11｜完整程式 1/3","text":"【本頁目標】\n案例 11｜完整程式 1/3\n11_stock_update.c\n\n【教師講解】\n本頁為 11_stock_update.c 的第 1/3 段，對應原始檔第 1～15 行。所有程式頁依序接續，沒有省略程式碼。建立含五筆原生 int 的新二進位檔。使用 wbx 確保不覆寫既有檔案，並檢查最初 fwrite 與 fclose。\n\n【程式帶讀】\n對應 11_stock_update.c，原始碼第 1～15 行。這是完整檔案第 1/3 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n#include \u003cstdio.h>\n#include \u003cstdlib.h>\n\nint main(int argc, char *argv[]) {\n    int stock[5] = {10, 20, 35, 40, 50};\n    int updated = 99, previous;\n    int failed = 0;\n    if (argc != 2) {\n        fputs(\"usage: stock_update new_binary_file\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    FILE *fp = fopen(argv[1], \"wbx\");\n    if (fp == NULL) {\n        fputs(\"Cannot create new stock file\\n\", stderr);\n        return EXIT_FAILURE;\n\n【課堂提問】\n讀完索引 2 後，為什麼不能直接 fwrite 覆寫該筆？\n\n【參考答案】\n讀取後檔案位置已前進到下一筆，且更新串流的讀→寫需要定位；必須重新 fseek 回索引 2 的起點。\n\n【來源與增補】\nB pp.138–160｜原庫存案例改編\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":92,"title":"案例 11｜完整程式 2/3","text":"【本頁目標】\n案例 11｜完整程式 2/3\n11_stock_update.c\n\n【教師講解】\n本頁為 11_stock_update.c 的第 2/3 段，對應原始檔第 16～30 行。所有程式頁依序接續，沒有省略程式碼。以 rb+ 重新開啟，計算索引 2 的 byte 位移。先定位再讀舊值；讀取會前進，因此改寫前必須再次定位。\n\n【程式帶讀】\n對應 11_stock_update.c，原始碼第 16～30 行。這是完整檔案第 2/3 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n    }\n    if (fwrite(stock, sizeof stock[0], 5, fp) != 5) failed = 1;\n    if (fclose(fp) != 0) failed = 1;\n    if (failed) {\n        fputs(\"Initial write failed\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    fp = fopen(argv[1], \"rb+\");\n    if (fp == NULL) {\n        fputs(\"Cannot reopen stock file\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    long offset = 2L * (long)sizeof stock[0];\n    if (fseek(fp, offset, SEEK_SET) != 0 ||\n        fread(&previous, sizeof previous, 1, fp) != 1 ||\n\n【課堂提問】\n讀完索引 2 後，為什麼不能直接 fwrite 覆寫該筆？\n\n【參考答案】\n讀取後檔案位置已前進到下一筆，且更新串流的讀→寫需要定位；必須重新 fseek 回索引 2 的起點。\n\n【來源與增補】\nB pp.138–160｜原庫存案例改編\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":93,"title":"案例 11｜完整程式 3/3","text":"【本頁目標】\n案例 11｜完整程式 3/3\n11_stock_update.c\n\n【教師講解】\n本頁為 11_stock_update.c 的第 3/3 段，對應原始檔第 31～44 行。所有程式頁依序接續，沒有省略程式碼。寫入新值後定位回開頭以便重新讀取。檢查讀寫與關閉結果，列出舊值、新值與完整陣列。此格式只適用同一實作，不提供跨平台或交易保證。\n\n【程式帶讀】\n對應 11_stock_update.c，原始碼第 31～44 行。這是完整檔案第 3/3 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n        fseek(fp, offset, SEEK_SET) != 0 ||\n        fwrite(&updated, sizeof updated, 1, fp) != 1 ||\n        fseek(fp, 0L, SEEK_SET) != 0 ||\n        fread(stock, sizeof stock[0], 5, fp) != 5) {\n        fputs(\"Record update/read failed\\n\", stderr);\n        failed = 1;\n    }\n    if (fclose(fp) != 0) failed = 1;\n    if (failed) return EXIT_FAILURE;\n    printf(\"old=%d new=%d\\n\", previous, stock[2]);\n    for (int i = 0; i \u003c 5; ++i)\n        printf(\"%d%c\", stock[i], i == 4 ? '\\n' : ' ');\n    return EXIT_SUCCESS;\n}\n\n【課堂提問】\n讀完索引 2 後，為什麼不能直接 fwrite 覆寫該筆？\n\n【參考答案】\n讀取後檔案位置已前進到下一筆，且更新串流的讀→寫需要定位；必須重新 fseek 回索引 2 的起點。\n\n【來源與增補】\nB pp.138–160｜原庫存案例改編\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":94,"title":"案例 11｜測試與常見錯誤","text":"【本頁目標】\n案例 11｜測試與常見錯誤\n先預測結果，再執行；不只測一般資料。\n\n【教師講解】\n依表格逐組測試，確認返回狀態、stdout、stderr 與檔案內容。第 k 筆以 0-based 索引 k 計算 offset；更換平台不能假設 int 永遠是 4 bytes，也不能忽略位元組順序。 對隨機或平台相依輸出，應測試性質，而不是把單一次執行結果當成唯一答案。\n\n【測試判讀】\n一般｜新檔 stock.bin｜35→99，其餘不變｜精準更新一筆\n檔案內容｜5 個原生 int｜10 20 99 40 50｜整檔驗證\n既有檔案｜再次執行同檔名｜失敗；不重建｜避免覆寫\n漏參數｜stock_update｜usage；失敗｜命令列契約\n本頁列出教學代表測試。附件測試器另外包含一般值、邊界與錯誤路徑；未模擬磁碟滿載、斷電、併發或所有作業系統。\n\n【課堂提問】\n讀完索引 2 後，為什麼不能直接 fwrite 覆寫該筆？\n\n【參考答案】\n讀取後檔案位置已前進到下一筆，且更新串流的讀→寫需要定位；必須重新 fseek 回索引 2 的起點。\n\n【來源與增補】\nB pp.138–160｜原庫存案例改編\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"}],"source_tests":["一般｜新檔 stock.bin｜35→99，其餘不變｜精準更新一筆","檔案內容｜5 個原生 int｜10 20 99 40 50｜整檔驗證","既有檔案｜再次執行同檔名｜失敗；不重建｜避免覆寫","漏參數｜stock_update｜usage；失敗｜命令列契約"],"annotation":{"lines":[[5,18,"先建立可重現的五筆資料","初始值固定 10、20、35、40、50；用 wbx 防止覆寫既有檔案。"],[28,34,"更新必須重新定位","先讀出索引 2 的舊值，再 fseek 到同一位置寫入 99；寫後回到檔首重新讀取。"],[35,43,"失敗不能偽裝成功","檢查定位、讀寫與關閉；原生 int 檔只用於相同實作的定位練習。"]],"boundary":"sizeof(int) 的切換只改變圖解的位移假設，不改動固定 C 程式，更不宣稱原生 int 二進位資料可跨平台交換。"}},{"task":"讀入一行成績，不只判斷是否以數字開頭，還要拒絕超大整數、尾端垃圾、空白行與超長輸入。","input":"標準輸入的一行無 NUL 文字；允許數字前後空白及正號。","output":"有效：score=value。無效：stderr 回報 No number、Trailing text、Out of range 等。","limits":"數值 0～100；單行最多 126 bytes（不含 LF）；不接受小數或第二個值。最末行可不含換行。","sample_in":"  +86  ","sample_out":"score=86","id":"12","num":12,"title":"嚴格讀取一個 0～100 分的整數","chapter":"24","tag":"新增案例","pages":[100,105],"source":"B pp.103–104,132–135｜C pp.6–9｜新增","logic":["fgets 限制讀取容量；過長輸入整行拒絕。","errno=0 後 strtol，保留 end 指標。","依序檢查沒讀到數字、ERANGE／範圍、尾端非空白；成功才設定輸出值。"],"pitfall":"atoi 無法清楚區分「合法 0」與轉換失敗；只看 errno 也無法偵測 86abc。","question":"為何 *out=(int)value 要放在所有檢查之後？","answer":"只有值已落在 0～100，且沒有尾端垃圾時才承諾成功；如此失敗不會把半合法結果交給呼叫端。","codes":[{"filename":"12_strict_score.c","pages":[102,103,104],"code":"#include \u003cctype.h>\n#include \u003cerrno.h>\n#include \u003cstdio.h>\n#include \u003cstdlib.h>\n#include \u003cstring.h>\n \nenum Status { OK, NO_NUMBER, TRAILING, OUT_OF_RANGE };\n \nstatic enum Status parse_score(const char *text, int *out) {\n    char *end;\n    errno = 0;\n    long value = strtol(text, &end, 10);\n    if (end == text) return NO_NUMBER;\n    if (errno == ERANGE || value \u003c 0 || value > 100)\n        return OUT_OF_RANGE;\n    while (isspace((unsigned char)*end)) ++end;\n    if (*end != '\\0') return TRAILING;\n    *out = (int)value;\n    return OK;\n}\n \nint main(void) {\n    char line[128];\n    int score;\n    if (fgets(line, sizeof line, stdin) == NULL) {\n        fputs(ferror(stdin) ? \"Read error\\n\" : \"No input\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    if (strchr(line, '\\n') == NULL && !feof(stdin)) {\n        fputs(\"Line too long (max 126 bytes)\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    enum Status status = parse_score(line, &score);\n    if (status != OK) {\n        const char *message[] = {\n            \"OK\", \"No number\", \"Trailing text\", \"Out of range\"\n        };\n        fprintf(stderr, \"%s\\n\", message[status]);\n        return EXIT_FAILURE;\n    }\n    printf(\"score=%d\\n\", score);\n    return EXIT_SUCCESS;\n}\n","sha256":"11609dd13c773c3ddd2dee8b4c7e3a6861e254b5ece5b65af34b746af5cf13a8","lineCount":43,"html":"\u003cspan class=\"code-line\" data-line=\"1\">\u003cspan class=\"lineno\"
