ass=\"w\"> \u003c/span>\u003cspan class=\"o\">&amp;\u003c/span>\u003cspan class=\"n\">score\u003c/span>\u003cspan class=\"p\">);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"34\">\u003cspan class=\"lineno\" aria-hidden=\"true\">34\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">if\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">status\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">!=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">OK\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">{\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"35\">\u003cspan class=\"lineno\" aria-hidden=\"true\">35\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"k\">const\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"kt\">char\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">*\u003c/span>\u003cspan class=\"n\">message\u003c/span>\u003cspan class=\"p\">[]\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">{\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"36\">\u003cspan class=\"lineno\" aria-hidden=\"true\">36\u003c/span>\u003cspan class=\"w\">            \u003c/span>\u003cspan class=\"s\">&quot;OK&quot;\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s\">&quot;No number&quot;\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s\">&quot;Trailing text&quot;\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s\">&quot;Out of range&quot;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"37\">\u003cspan class=\"lineno\" aria-hidden=\"true\">37\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"p\">};\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"38\">\u003cspan class=\"lineno\" aria-hidden=\"true\">38\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"n\">fprintf\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">stderr\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s\">&quot;%s\u003c/span>\u003cspan class=\"se\">\\n\u003c/span>\u003cspan class=\"s\">&quot;\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">message\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">status\u003c/span>\u003cspan class=\"p\">]);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"39\">\u003cspan class=\"lineno\" aria-hidden=\"true\">39\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"k\">return\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">EXIT_FAILURE\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"40\">\u003cspan class=\"lineno\" aria-hidden=\"true\">40\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"41\">\u003cspan class=\"lineno\" aria-hidden=\"true\">41\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"n\">printf\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s\">&quot;score=%d\u003c/span>\u003cspan class=\"se\">\\n\u003c/span>\u003cspan class=\"s\">&quot;\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">score\u003c/span>\u003cspan class=\"p\">);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"42\">\u003cspan class=\"lineno\" aria-hidden=\"true\">42\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">return\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">EXIT_SUCCESS\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"43\">\u003cspan class=\"lineno\" aria-hidden=\"true\">43\u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>","build":"gcc -std=c17 -Wall -Wextra -Wpedantic 12_strict_score.c -o 12_strict_score"}],"notes":[{"page":100,"title":"案例 12｜嚴格讀取一個 0～100 分的整數","text":"【本頁目標】\n案例 12｜嚴格讀取一個 0～100 分的整數\n完整題目：先確認任務、輸入、輸出與限制\n\n【教師講解】\n先不要展示解答。請學生用自己的話重述任務，再指出輸入格式、輸出格式與無效資料的處理。讀入一行成績，不只判斷是否以數字開頭，還要拒絕超大整數、尾端垃圾、空白行與超長輸入。 數值 0～100；單行最多 126 bytes（不含 LF）；不接受小數或第二個值。最末行可不含換行。\n\n【完整規格】\n任務：讀入一行成績，不只判斷是否以數字開頭，還要拒絕超大整數、尾端垃圾、空白行與超長輸入。\n輸入：標準輸入的一行無 NUL 文字；允許數字前後空白及正號。\n輸出：有效：score=value。無效：stderr 回報 No number、Trailing text、Out of range 等。\n限制：數值 0～100；單行最多 126 bytes（不含 LF）；不接受小數或第二個值。最末行可不含換行。\n範例輸入：\n  +86  \n範例輸出：\nscore=86\n\n【課堂提問】\n為何 *out=(int)value 要放在所有檢查之後？\n\n【參考答案】\n只有值已落在 0～100，且沒有尾端垃圾時才承諾成功；如此失敗不會把半合法結果交給呼叫端。\n\n【來源與增補】\nB pp.103–104,132–135｜C pp.6–9｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":101,"title":"案例 12｜核心解法與圖解","text":"【本頁目標】\n案例 12｜核心解法與圖解\n嚴格讀取一個 0～100 分的整數\n\n【教師講解】\n依下列順序帶讀圖解：1. fgets 限制讀取容量；過長輸入整行拒絕。 2. errno=0 後 strtol，保留 end 指標。 3. 依序檢查沒讀到數字、ERANGE／範圍、尾端非空白；成功才設定輸出值。 atoi 無法清楚區分「合法 0」與轉換失敗；只看 errno 也無法偵測 86abc。\n\n【課堂提問】\n為何 *out=(int)value 要放在所有檢查之後？\n\n【參考答案】\n只有值已落在 0～100，且沒有尾端垃圾時才承諾成功；如此失敗不會把半合法結果交給呼叫端。\n\n【來源與增補】\nB pp.103–104,132–135｜C pp.6–9｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":102,"title":"案例 12｜完整程式 1/3","text":"【本頁目標】\n案例 12｜完整程式 1/3\n12_strict_score.c\n\n【教師講解】\n本頁為 12_strict_score.c 的第 1/3 段，對應原始檔第 1～15 行。所有程式頁依序接續，沒有省略程式碼。狀態 enum 把成功、缺少數字、尾端雜字及範圍錯誤分開。strtol 前將 errno 清零，轉換後用 end 與 ERANGE 判斷。\n\n【程式帶讀】\n對應 12_strict_score.c，原始碼第 1～15 行。這是完整檔案第 1/3 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n#include \u003cctype.h>\n#include \u003cerrno.h>\n#include \u003cstdio.h>\n#include \u003cstdlib.h>\n#include \u003cstring.h>\n\nenum Status { OK, NO_NUMBER, TRAILING, OUT_OF_RANGE };\n\nstatic enum Status parse_score(const char *text, int *out) {\n    char *end;\n    errno = 0;\n    long value = strtol(text, &end, 10);\n    if (end == text) return NO_NUMBER;\n    if (errno == ERANGE || value \u003c 0 || value > 100)\n        return OUT_OF_RANGE;\n\n【課堂提問】\n為何 *out=(int)value 要放在所有檢查之後？\n\n【參考答案】\n只有值已落在 0～100，且沒有尾端垃圾時才承諾成功；如此失敗不會把半合法結果交給呼叫端。\n\n【來源與增補】\nB pp.103–104,132–135｜C pp.6–9｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":103,"title":"案例 12｜完整程式 2/3","text":"【本頁目標】\n案例 12｜完整程式 2/3\n12_strict_score.c\n\n【教師講解】\n本頁為 12_strict_score.c 的第 2/3 段，對應原始檔第 16～29 行。所有程式頁依序接續，沒有省略程式碼。略過尾端空白時把字元轉成 unsigned char 再交給 isspace。全部合法才寫入 *out。主程式以 fgets 控制輸入長度。\n\n【程式帶讀】\n對應 12_strict_score.c，原始碼第 16～29 行。這是完整檔案第 2/3 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n    while (isspace((unsigned char)*end)) ++end;\n    if (*end != '\\0') return TRAILING;\n    *out = (int)value;\n    return OK;\n}\n\nint main(void) {\n    char line[128];\n    int score;\n    if (fgets(line, sizeof line, stdin) == NULL) {\n        fputs(ferror(stdin) ? \"Read error\\n\" : \"No input\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    if (strchr(line, '\\n') == NULL && !feof(stdin)) {\n\n【課堂提問】\n為何 *out=(int)value 要放在所有檢查之後？\n\n【參考答案】\n只有值已落在 0～100，且沒有尾端垃圾時才承諾成功；如此失敗不會把半合法結果交給呼叫端。\n\n【來源與增補】\nB pp.103–104,132–135｜C pp.6–9｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":104,"title":"案例 12｜完整程式 3/3","text":"【本頁目標】\n案例 12｜完整程式 3/3\n12_strict_score.c\n\n【教師講解】\n本頁為 12_strict_score.c 的第 3/3 段，對應原始檔第 30～43 行。所有程式頁依序接續，沒有省略程式碼。主程式拒絕過長或讀取失敗的資料，依狀態回報可理解的錯誤文字。只有 OK 才使用 score；不要把有效輸出值和錯誤碼混用。\n\n【程式帶讀】\n對應 12_strict_score.c，原始碼第 30～43 行。這是完整檔案第 3/3 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n        fputs(\"Line too long (max 126 bytes)\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    enum Status status = parse_score(line, &score);\n    if (status != OK) {\n        const char *message[] = {\n            \"OK\", \"No number\", \"Trailing text\", \"Out of range\"\n        };\n        fprintf(stderr, \"%s\\n\", message[status]);\n        return EXIT_FAILURE;\n    }\n    printf(\"score=%d\\n\", score);\n    return EXIT_SUCCESS;\n}\n\n【課堂提問】\n為何 *out=(int)value 要放在所有檢查之後？\n\n【參考答案】\n只有值已落在 0～100，且沒有尾端垃圾時才承諾成功；如此失敗不會把半合法結果交給呼叫端。\n\n【來源與增補】\nB pp.103–104,132–135｜C pp.6–9｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":105,"title":"案例 12｜測試與常見錯誤","text":"【本頁目標】\n案例 12｜測試與常見錯誤\n先預測結果，再執行；不只測一般資料。\n\n【教師講解】\n依表格逐組測試，確認返回狀態、stdout、stderr 與檔案內容。atoi 無法清楚區分「合法 0」與轉換失敗；只看 errno 也無法偵測 86abc。 對隨機或平台相依輸出，應測試性質，而不是把單一次執行結果當成唯一答案。\n\n【測試判讀】\n一般｜  +86  ｜score=86｜允許前後空白\n尾端垃圾｜86abc｜Trailing text｜不能只接受數字前綴\n超大整數｜60 個 9｜Out of range｜使用 ERANGE\n空白行｜只有空白／換行｜No number｜end==text\n超長一行｜200 個字元｜Line too long｜不可默默截斷\n本頁列出教學代表測試。附件測試器另外包含一般值、邊界與錯誤路徑；未模擬磁碟滿載、斷電、併發或所有作業系統。\n\n【課堂提問】\n為何 *out=(int)value 要放在所有檢查之後？\n\n【參考答案】\n只有值已落在 0～100，且沒有尾端垃圾時才承諾成功；如此失敗不會把半合法結果交給呼叫端。\n\n【來源與增補】\nB pp.103–104,132–135｜C pp.6–9｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"}],"source_tests":["一般｜  +86  ｜score=86｜允許前後空白","尾端垃圾｜86abc｜Trailing text｜不能只接受數字前綴","超大整數｜60 個 9｜Out of range｜使用 ERANGE","空白行｜只有空白／換行｜No number｜end==text","超長一行｜200 個字元｜Line too long｜不可默默截斷"],"annotation":{"lines":[[10,15,"數字開頭不代表整行合法","strtol 前 errno=0；先檢查沒有數字，再檢查 ERANGE 與題目範圍。"],[16,19,"尾端只能有空白","跳過空白後仍有字元便是 TRAILING；所有檢查通過才設定 *out，保留呼叫端舊值。"],[24,42,"讀取策略與解析策略分工","fgets 限制容量，長行拒絕；主程式依狀態輸出易讀訊息，不用 assert 驗證外部輸入。"]],"boundary":"來源以一行無 NUL 文字為約定，最多 126 bytes 不含 LF。互動使用 BigInt 判斷巨大整數；不把 JavaScript 數值範圍當成 C long 的範圍。"}},{"task":"讀入數值後計算平方根。外部不合法輸入必須以正常錯誤路徑拒絕；assert 僅記錄驗證後的內部不變量。","input":"標準輸入：一個可由 double 表示的數值文字。","output":"有效：輸出 sqrt=結果（小數 6 位）；無效：stderr 訊息並失敗。","limits":"只接受有限且非負的值；NaN、正負無窮大與負數拒絕。定義 NDEBUG 後，外部驗證仍須有效。","sample_in":"4","sample_out":"sqrt=2.000000","id":"13","num":13,"title":"外部驗證與 assert 的分工","chapter":"24","tag":"原稿案例補強","pages":[107,110],"source":"C pp.3–5｜新增防護","logic":["if 檢查轉換結果、isfinite(x) 與 x≥0。","assert(x≥0) 說明程式到這裡應滿足的條件。","用一般版與 -DNDEBUG 版跑同一批測試。"],"pitfall":"不可寫 assert(scanf(...)==1)；NDEBUG 啟用時，連讀取輸入的副作用都可能消失。","question":"assert 關閉之後，這個程式會接受負數嗎？","answer":"不會。外部驗證在 if 中，與 assert 是否啟用無關；assert 只是協助檢查內部邏輯。","codes":[{"filename":"13_assert_sqrt.c","pages":[109],"code":"#include \u003cassert.h>\n#include \u003cmath.h>\n#include \u003cstdio.h>\n#include \u003cstdlib.h>\n \nint main(void) {\n    double x;\n    if (scanf(\"%lf\", &x) != 1 || !isfinite(x) || x \u003c 0.0) {\n        fputs(\"Expected a finite, nonnegative value\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    assert(x >= 0.0);  /* Internal invariant; no side effects. */\n    printf(\"sqrt=%.6f\\n\", sqrt(x));\n    return EXIT_SUCCESS;\n}\n","sha256":"e6692d35d679c67674c3a31bcff0678b3a666277968342798977e307d421742d","lineCount":15,"html":"\u003cspan class=\"code-line\" data-line=\"1\">\u003cspan class=\"lineno\" aria-hidden=\"true\">1\u003c/span>\u003cspan class=\"cp\">#include\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"cpf\">&lt;assert.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"2\">\u003cspan class=\"lineno\" aria-hidden=\"true\">2\u003c/span>\u003cspan class=\"cp\">#include\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"cpf\">&lt;math.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"3\">\u003cspan class=\"lineno\" aria-hidden=\"true\">3\u003c/span>\u003cspan class=\"cp\">#include\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"cpf\">&lt;stdio.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"4\">\u003cspan class=\"lineno\" aria-hidden=\"true\">4\u003c/span>\u003cspan class=\"cp\">#include\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"cpf\">&lt;stdlib.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"5\">\u003cspan class=\"lineno\" aria-hidden=\"true\">5\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"6\">\u003cspan class=\"lineno\" aria-hidden=\"true\">6\u003c/span>\u003cspan class=\"kt\">int\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">main\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"kt\">void\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">{\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"7\">\u003cspan class=\"lineno\" aria-hidden=\"true\">7\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"kt\">double\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">x\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"8\">\u003cspan class=\"lineno\" aria-hidden=\"true\">8\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">if\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">scanf\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s\">&quot;%lf&quot;\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">&amp;\u003c/span>\u003cspan class=\"n\">x\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">!=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">||\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">!\u003c/span>\u003cspan class=\"n\">isfinite\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">x\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">||\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">x\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">&lt;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mf\">0.0\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">{\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"9\">\u003cspan class=\"lineno\" aria-hidden=\"true\">9\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"n\">fputs\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s\">&quot;Expected a finite, nonnegative value\u003c/span>\u003cspan class=\"se\">\\n\u003c/span>\u003cspan class=\"s\">&quot;\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">stderr\u003c/span>\u003cspan class=\"p\">);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"10\">\u003cspan class=\"lineno\" aria-hidden=\"true\">10\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"k\">return\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">EXIT_FAILURE\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"11\">\u003cspan class=\"lineno\" aria-hidden=\"true\">11\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"12\">\u003cspan class=\"lineno\" aria-hidden=\"true\">12\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"n\">assert\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">x\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">&gt;=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mf\">0.0\u003c/span>\u003cspan class=\"p\">);\u003c/span>\u003cspan class=\"w\">  \u003c/span>\u003cspan class=\"cm\">/* Internal invariant; no side effects. */\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"13\">\u003cspan class=\"lineno\" aria-hidden=\"true\">13\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"n\">printf\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s\">&quot;sqrt=%.6f\u003c/span>\u003cspan class=\"se\">\\n\u003c/span>\u003cspan class=\"s\">&quot;\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">sqrt\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">x\u003c/span>\u003cspan class=\"p\">));\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"14\">\u003cspan class=\"lineno\" aria-hidden=\"true\">14\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">return\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">EXIT_SUCCESS\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"15\">\u003cspan class=\"lineno\" aria-hidden=\"true\">15\u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>","build":"gcc -std=c17 -Wall -Wextra -Wpedantic 13_assert_sqrt.c -o 13_assert_sqrt -lm"}],"notes":[{"page":107,"title":"案例 13｜外部驗證與 assert 的分工","text":"【本頁目標】\n案例 13｜外部驗證與 assert 的分工\n完整題目：先確認任務、輸入、輸出與限制\n\n【教師講解】\n先不要展示解答。請學生用自己的話重述任務，再指出輸入格式、輸出格式與無效資料的處理。讀入數值後計算平方根。外部不合法輸入必須以正常錯誤路徑拒絕；assert 僅記錄驗證後的內部不變量。 只接受有限且非負的值；NaN、正負無窮大與負數拒絕。定義 NDEBUG 後，外部驗證仍須有效。\n\n【完整規格】\n任務：讀入數值後計算平方根。外部不合法輸入必須以正常錯誤路徑拒絕；assert 僅記錄驗證後的內部不變量。\n輸入：標準輸入：一個可由 double 表示的數值文字。\n輸出：有效：輸出 sqrt=結果（小數 6 位）；無效：stderr 訊息並失敗。\n限制：只接受有限且非負的值；NaN、正負無窮大與負數拒絕。定義 NDEBUG 後，外部驗證仍須有效。\n範例輸入：\n4\n範例輸出：\nsqrt=2.000000\n\n【課堂提問】\nassert 關閉之後，這個程式會接受負數嗎？\n\n【參考答案】\n不會。外部驗證在 if 中，與 assert 是否啟用無關；assert 只是協助檢查內部邏輯。\n\n【來源與增補】\nC pp.3–5｜新增防護\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":108,"title":"案例 13｜核心解法與圖解","text":"【本頁目標】\n案例 13｜核心解法與圖解\n外部驗證與 assert 的分工\n\n【教師講解】\n依下列順序帶讀圖解：1. if 檢查轉換結果、isfinite(x) 與 x≥0。 2. assert(x≥0) 說明程式到這裡應滿足的條件。 3. 用一般版與 -DNDEBUG 版跑同一批測試。 不可寫 assert(scanf(...)==1)；NDEBUG 啟用時，連讀取輸入的副作用都可能消失。\n\n【課堂提問】\nassert 關閉之後，這個程式會接受負數嗎？\n\n【參考答案】\n不會。外部驗證在 if 中，與 assert 是否啟用無關；assert 只是協助檢查內部邏輯。\n\n【來源與增補】\nC pp.3–5｜新增防護\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":109,"title":"案例 13｜完整程式 1/1","text":"【本頁目標】\n案例 13｜完整程式 1/1\n13_assert_sqrt.c\n\n【教師講解】\n本頁為 13_assert_sqrt.c 的第 1/1 段，對應原始檔第 1～15 行。所有程式頁依序接續，沒有省略程式碼。先用 if 檢查轉換成功、有限值與非負條件，再以無副作用的 assert 驗證內部不變條件，最後計算 sqrt。加入 -DNDEBUG 之後，外部驗證仍然執行。\n\n【程式帶讀】\n對應 13_assert_sqrt.c，原始碼第 1～15 行。這是完整檔案第 1/1 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n#include \u003cassert.h>\n#include \u003cmath.h>\n#include \u003cstdio.h>\n#include \u003cstdlib.h>\n\nint main(void) {\n    double x;\n    if (scanf(\"%lf\", &x) != 1 || !isfinite(x) || x \u003c 0.0) {\n        fputs(\"Expected a finite, nonnegative value\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    assert(x >= 0.0);  /* Internal invariant; no side effects. */\n    printf(\"sqrt=%.6f\\n\", sqrt(x));\n    return EXIT_SUCCESS;\n}\n\n【課堂提問】\nassert 關閉之後，這個程式會接受負數嗎？\n\n【參考答案】\n不會。外部驗證在 if 中，與 assert 是否啟用無關；assert 只是協助檢查內部邏輯。\n\n【來源與增補】\nC pp.3–5｜新增防護\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":110,"title":"案例 13｜測試與常見錯誤","text":"【本頁目標】\n案例 13｜測試與常見錯誤\n先預測結果，再執行；不只測一般資料。\n\n【教師講解】\n依表格逐組測試，確認返回狀態、stdout、stderr 與檔案內容。不可寫 assert(scanf(...)==1)；NDEBUG 啟用時，連讀取輸入的副作用都可能消失。 對隨機或平台相依輸出，應測試性質，而不是把單一次執行結果當成唯一答案。\n\n【測試判讀】\n有效｜4｜sqrt=2.000000｜正常路徑\n邊界｜0｜sqrt=0.000000｜合法輸入\n負數｜−1｜一般錯誤返回｜不依賴 abort\n特殊值｜nan / inf｜失敗｜有限性檢查\n移除 assert｜-DNDEBUG 後輸入 −1｜仍失敗｜輸入驗證不可消失\n本頁列出教學代表測試。附件測試器另外包含一般值、邊界與錯誤路徑；未模擬磁碟滿載、斷電、併發或所有作業系統。\n\n【課堂提問】\nassert 關閉之後，這個程式會接受負數嗎？\n\n【參考答案】\n不會。外部驗證在 if 中，與 assert 是否啟用無關；assert 只是協助檢查內部邏輯。\n\n【來源與增補】\nC pp.3–5｜新增防護\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"}],"source_tests":["有效｜4｜sqrt=2.000000｜正常路徑","邊界｜0｜sqrt=0.000000｜合法輸入","負數｜−1｜一般錯誤返回｜不依賴 abort","特殊值｜nan / inf｜失敗｜有限性檢查","移除 assert｜-DNDEBUG 後輸入 −1｜仍失敗｜輸入驗證不可消失"],"annotation":{"lines":[[7,11,"可恢復的外部錯誤用 if","先檢查 scanf、isfinite 與非負條件，因此 NaN、無窮與負數在到達 assert 前就被拒絕。"],[12,14,"assert 描述已成立的不變量","assert 不執行輸入或其他必要副作用；NDEBUG 只移除斷言，不移除前面的外部驗證。"]],"boundary":"NDEBUG 開關是圖解；測試區另附真正以 -DNDEBUG 編譯後的 10 組結果。互動平方根只示範十進位格式與有限顯示範圍，完整 C 程式以來源規格為準。"}},{"task":"依序計算 log(−1)、log(0)、log(1)，觀察數學函式的結果與錯誤分類，不把平台輸出字串當成固定答案。","input":"無外部輸入；程式內的 input 陣列固定為 −1、0、1。","output":"先印 MATH_ERRNO 是否支援；逐筆印結果與 EDOM、ERANGE、none，或不支援 errno 檢查。","limits":"只有 math_errhandling 含 MATH_ERRNO 時，才以 errno 驗證錯誤分類。NaN/inf 文字與 strerror 訊息依實作。","sample_in":"直接執行 math_errno","sample_out":"支援 MATH_ERRNO 時：\n−1 → EDOM；0 → ERANGE；1 → none","id":"14","num":14,"title":"觀察 log 的 errno 診斷","chapter":"24","tag":"原稿案例補強","pages":[112,116],"source":"C pp.6–9｜勘誤／補充","logic":["先確認數學函式的錯誤回報機制。","每次呼叫 log 前把 errno 設為 0。","log 後立即保存 errno，再交給 printf／strerror 產生說明。"],"pitfall":"原稿的 1.0/0.0 不是會替你設定 errno 的函式呼叫；不能把它當作可攜的 ERANGE 示範。","question":"如果不在每次 log 前清除 errno，會發生什麼誤判？","answer":"先前失敗留下的非零值可能仍存在，後續成功呼叫就會被誤認為失敗；仍須遵守特定函式的規格。","codes":[{"filename":"14_math_errno.c","pages":[114,115],"code":"#include \u003cerrno.h>\n#include \u003cmath.h>\n#include \u003cstdio.h>\n#include \u003cstring.h>\n \nint main(void) {\n    const double input[] = {-1.0, 0.0, 1.0};\n    int has_errno = (math_errhandling & MATH_ERRNO) != 0;\n    printf(\"MATH_ERRNO=%d\\n\", has_errno);\n    for (size_t i = 0; i \u003c sizeof input / sizeof input[0]; ++i) {\n        errno = 0;\n        double result = log(input[i]);\n        int saved_errno = errno;\n        printf(\"x=%.0f result=%g \", input[i], result);\n        if (!has_errno)\n            puts(\"errno checking not supported\");\n        else if (saved_errno == 0)\n            puts(\"error=none\");\n        else {\n            const char *name = saved_errno == EDOM ? \"EDOM\" :\n                               saved_errno == ERANGE ? \"ERANGE\" : \"OTHER\";\n            printf(\"error=%s (%s)\\n\", name, strerror(saved_errno));\n        }\n    }\n    return 0;\n}\n","sha256":"37d8e91fb71565ae00f615494d22999bf474d3aa0e40de99a1f88110134c5d28","lineCount":26,"html":"\u003cspan class=\"code-line\" data-line=\"1\">\u003cspan class=\"lineno\" aria-hidden=\"true\">1\u003c/span>\u003cspan class=\"cp\">#include\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"cpf\">&lt;errno.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"2\">\u003cspan class=\"lineno\" aria-hidden=\"true\">2\u003c/span>\u003cspan class=\"cp\">#include\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"cpf\">&lt;math.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"3\">\u003cspan class=\"lineno\" aria-hidden=\"true\">3\u003c/span>\u003cspan class=\"cp\">#include\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"cpf\">&lt;stdio.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"4\">\u003cspan class=\"lineno\" aria-hidden=\"true\">4\u003c/span>\u003cspan class=\"cp\">#include\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"cpf\">&lt;string.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"5\">\u003cspan class=\"lineno\" aria-hidden=\"true\">5\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"6\">\u003cspan class=\"lineno\" aria-hidden=\"true\">6\u003c/span>\u003cspan class=\"kt\">int\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">main\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"kt\">void\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">{\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"7\">\u003cspan class=\"lineno\" aria-hidden=\"true\">7\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">const\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"kt\">double\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">input\u003c/span>\u003cspan class=\"p\">[]\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">{\u003c/span>\u003cspan class=\"mf\">-1.0\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mf\">0.0\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mf\">1.0\u003c/span>\u003cspan class=\"p\">};\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"8\">\u003cspan class=\"lineno\" aria-hidden=\"true\">8\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"kt\">int\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">has_errno\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">math_errhandling\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">&amp;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003 \"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">input\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"p\">],\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">result\u003c/span>\u003cspan class=\"p\">);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"15\">\u003cspan class=\"lineno\" aria-hidden=\"true\">15\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"k\">if\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"o\">!\u003c/span>\u003cspan class=\"n\">has_errno\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"16\">\u003cspan class=\"lineno\" aria-hidden=\"true\">16\u003c/span>\u003cspan class=\"w\">            \u003c/span>\u003cspan class=\"n\">puts\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s\">&quot;errno checking not supported&quot;\u003c/span>\u003cspan class=\"p\">);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"17\">\u003cspan class=\"lineno\" aria-hidden=\"true\">17\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"k\">else\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"k\">if\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">saved_errno\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">==\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"18\">\u003cspan class=\"lineno\" aria-hidden=\"true\">18\u003c/span>\u003cspan class=\"w\">            \u003c/span>\u003cspan class=\"n\">puts\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s\">&quot;error=none&quot;\u003c/span>\u003cspan class=\"p\">);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"19\">\u003cspan class=\"lineno\" aria-hidden=\"true\">19\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"k\">else\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">{\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"20\">\u003cspan class=\"lineno\" aria-hidden=\"true\">20\u003c/span>\u003cspan class=\"w\">            \u003c/span>\u003cspan class=\"k\">const\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"kt\">char\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">*\u003c/span>\u003cspan class=\"n\">name\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">saved_errno\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">==\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">EDOM\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">?\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s\">&quot;EDOM&quot;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">:\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"21\">\u003cspan class=\"lineno\" aria-hidden=\"true\">21\u003c/span>\u003cspan class=\"w\">                               \u003c/span>\u003cspan class=\"n\">saved_errno\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">==\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">ERANGE\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">?\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s\">&quot;ERANGE&quot;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s\">&quot;OTHER&quot;\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"22\">\u003cspan class=\"lineno\" aria-hidden=\"true\">22\u003c/span>\u003cspan class=\"w\">            \u003c/span>\u003cspan class=\"n\">printf\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s\">&quot;error=%s (%s)\u003c/span>\u003cspan class=\"se\">\\n\u003c/span>\u003cspan class=\"s\">&quot;\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">name\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">strerror\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">saved_errno\u003c/span>\u003cspan class=\"p\">));\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"23\">\u003cspan class=\"lineno\" aria-hidden=\"true\">23\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"24\">\u003cspan class=\"lineno\" aria-hidden=\"true\">24\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"25\">\u003cspan class=\"lineno\" aria-hidden=\"true\">25\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">return\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"26\">\u003cspan class=\"lineno\" aria-hidden=\"true\">26\u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>","build":"gcc -std=c17 -Wall -Wextra -Wpedantic 14_math_errno.c -o 14_math_errno -lm"}],"notes":[{"page":112,"title":"案例 14｜觀察 log 的 errno 診斷","text":"【本頁目標】\n案例 14｜觀察 log 的 errno 診斷\n完整題目：先確認任務、輸入、輸出與限制\n\n【教師講解】\n先不要展示解答。請學生用自己的話重述任務，再指出輸入格式、輸出格式與無效資料的處理。依序計算 log(−1)、log(0)、log(1)，觀察數學函式的結果與錯誤分類，不把平台輸出字串當成固定答案。 只有 math_errhandling 含 MATH_ERRNO 時，才以 errno 驗證錯誤分類。NaN/inf 文字與 strerror 訊息依實作。\n\n【完整規格】\n任務：依序計算 log(−1)、log(0)、log(1)，觀察數學函式的結果與錯誤分類，不把平台輸出字串當成固定答案。\n輸入：無外部輸入；程式內的 input 陣列固定為 −1、0、1。\n輸出：先印 MATH_ERRNO 是否支援；逐筆印結果與 EDOM、ERANGE、none，或不支援 errno 檢查。\n限制：只有 math_errhandling 含 MATH_ERRNO 時，才以 errno 驗證錯誤分類。NaN/inf 文字與 strerror 訊息依實作。\n範例輸入：\n直接執行 math_errno\n範例輸出：\n支援 MATH_ERRNO 時：\n−1 → EDOM；0 → ERANGE；1 → none\n\n【課堂提問】\n如果不在每次 log 前清除 errno，會發生什麼誤判？\n\n【參考答案】\n先前失敗留下的非零值可能仍存在，後續成功呼叫就會被誤認為失敗；仍須遵守特定函式的規格。\n\n【來源與增補】\nC pp.6–9｜勘誤／補充\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":113,"title":"案例 14｜核心解法與圖解","text":"【本頁目標】\n案例 14｜核心解法與圖解\n觀察 log 的 errno 診斷\n\n【教師講解】\n依下列順序帶讀圖解：1. 先確認數學函式的錯誤回報機制。 2. 每次呼叫 log 前把 errno 設為 0。 3. log 後立即保存 errno，再交給 printf／strerror 產生說明。 原稿的 1.0/0.0 不是會替你設定 errno 的函式呼叫；不能把它當作可攜的 ERANGE 示範。\n\n【課堂提問】\n如果不在每次 log 前清除 errno，會發生什麼誤判？\n\n【參考答案】\n先前失敗留下的非零值可能仍存在，後續成功呼叫就會被誤認為失敗；仍須遵守特定函式的規格。\n\n【來源與增補】\nC pp.6–9｜勘誤／補充\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":114,"title":"案例 14｜完整程式 1/2","text":"【本頁目標】\n案例 14｜完整程式 1/2\n14_math_errno.c\n\n【教師講解】\n本頁為 14_math_errno.c 的第 1/2 段，對應原始檔第 1～13 行。所有程式頁依序接續，沒有省略程式碼。先查詢 math_errhandling 是否支援 MATH_ERRNO，再逐項測試 -1、0、1。每次呼叫 log 之前都清零 errno。\n\n【程式帶讀】\n對應 14_math_errno.c，原始碼第 1～13 行。這是完整檔案第 1/2 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n#include \u003cerrno.h>\n#include \u003cmath.h>\n#include \u003cstdio.h>\n#include \u003cstring.h>\n\nint main(void) {\n    const double input[] = {-1.0, 0.0, 1.0};\n    int has_errno = (math_errhandling & MATH_ERRNO) != 0;\n    printf(\"MATH_ERRNO=%d\\n\", has_errno);\n    for (size_t i = 0; i \u003c sizeof input / sizeof input[0]; ++i) {\n        errno = 0;\n        double result = log(input[i]);\n        int saved_errno = errno;\n\n【課堂提問】\n如果不在每次 log 前清除 errno，會發生什麼誤判？\n\n【參考答案】\n先前失敗留下的非零值可能仍存在，後續成功呼叫就會被誤認為失敗；仍須遵守特定函式的規格。\n\n【來源與增補】\nC pp.6–9｜勘誤／補充\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":115,"title":"案例 14｜完整程式 2/2","text":"【本頁目標】\n案例 14｜完整程式 2/2\n14_math_errno.c\n\n【教師講解】\n本頁為 14_math_errno.c 的第 2/2 段，對應原始檔第 14～26 行。所有程式頁依序接續，沒有省略程式碼。立即保存 log 呼叫之後的 errno，再輸出結果與診斷。未支援時明確說明不能用 errno 檢查；診斷字串和 NaN／無限大顯示方式不作跨平台固定答案。\n\n【程式帶讀】\n對應 14_math_errno.c，原始碼第 14～26 行。這是完整檔案第 2/2 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n        printf(\"x=%.0f result=%g \", input[i], result);\n        if (!has_errno)\n            puts(\"errno checking not supported\");\n        else if (saved_errno == 0)\n            puts(\"error=none\");\n        else {\n            const char *name = saved_errno == EDOM ? \"EDOM\" :\n                               saved_errno == ERANGE ? \"ERANGE\" : \"OTHER\";\n            printf(\"error=%s (%s)\\n\", name, strerror(saved_errno));\n        }\n    }\n    return 0;\n}\n\n【課堂提問】\n如果不在每次 log 前清除 errno，會發生什麼誤判？\n\n【參考答案】\n先前失敗留下的非零值可能仍存在，後續成功呼叫就會被誤認為失敗；仍須遵守特定函式的規格。\n\n【來源與增補】\nC pp.6–9｜勘誤／補充\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":116,"title":"案例 14｜測試與常見錯誤","text":"【本頁目標】\n案例 14｜測試與常見錯誤\n先預測結果，再執行；不只測一般資料。\n\n【教師講解】\n依表格逐組測試，確認返回狀態、stdout、stderr 與檔案內容。原稿的 1.0/0.0 不是會替你設定 errno 的函式呼叫；不能把它當作可攜的 ERANGE 示範。 對隨機或平台相依輸出，應測試性質，而不是把單一次執行結果當成唯一答案。\n\n【測試判讀】\n定義域錯誤｜log(−1)｜EDOM（支援時）｜參數超出實數定義域\n極點錯誤｜log(0)｜ERANGE（支援時）｜零點的發散\n正常｜log(1)｜結果 0；none｜清除先前殘留值\n平台差異｜MATH_ERRNO 未設｜明確標示不支援｜不可宣稱 errno=0 即安全\n本頁列出教學代表測試。附件測試器另外包含一般值、邊界與錯誤路徑；未模擬磁碟滿載、斷電、併發或所有作業系統。\n\n【課堂提問】\n如果不在每次 log 前清除 errno，會發生什麼誤判？\n\n【參考答案】\n先前失敗留下的非零值可能仍存在，後續成功呼叫就會被誤認為失敗；仍須遵守特定函式的規格。\n\n【來源與增補】\nC pp.6–9｜勘誤／補充\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"}],"source_tests":["定義域錯誤｜log(−1)｜EDOM（支援時）｜參數超出實數定義域","極點錯誤｜log(0)｜ERANGE（支援時）｜零點的發散","正常｜log(1)｜結果 0；none｜清除先前殘留值","平台差異｜MATH_ERRNO 未設｜明確標示不支援｜不可宣稱 errno=0 即安全"],"annotation":{"lines":[[7,9,"先確認 errno 回報機制","math_errhandling 不含 MATH_ERRNO 時，不可以「errno 沒變」宣稱沒有數學錯誤。"],[10,13,"每次呼叫都獨立觀察","每次 log 前清零，呼叫後立刻保存 errno；這與直接使用除法運算子不是同一件事。"],[14,24,"分類與顯示分離","用符號 EDOM／ERANGE 判斷，strerror 的字句僅作平台診斷資訊。"]],"boundary":"HTML 的 NaN、−inf 是語意圖解。真正 C 輸出的大小寫、負號、錯誤碼數值與語系，以各次實測紀錄為準。"}},{"task":"從成績文字檔載入資料，全部驗證通過後才建立統計報表；任一筆不合法就停止，不產生看似成功的部分報表。","input":"命令列：grade_file input_csv new_report。每行 Sddd,score，沒有標題列。","output":"報表第一行列出 count、average、min、max、pass；後續保留輸入順序，逐列輸出 ID、成績、PASS/FAIL。","limits":"1～100 筆；ID 為 S000～S999 且不可重複；成績 0～100。無 BOM/NUL 的文字檔；禁止空白行；目的報表必須不存在。","sample_in":"S001,86\nS002,100\nS003,59\nS004,75","sample_out":"count=4 average=80.00 min=59 max=100 pass=3\nS001,86,PASS\nS002,100,PASS\nS003,59,FAIL\nS004,75,PASS","id":"15","num":15,"title":"整合專題：成績檔驗證與報表","chapter":"project","tag":"新增整合案例","pages":[119,130],"source":"A+B+C｜新增整合實作","logic":["載入：fgets 逐行取得資料，紀錄實際行號。","驗證：格式、strtol、範圍、ID 去重與容量全部通過才存入。","輸出：先完成所有驗證，再以 wx 建立報表；逐筆檢查寫入與關閉。"],"pitfall":"先輸出報表再驗證剩餘輸入，會留下半份結果。本題先完整載入與驗證，再建立目的檔。","question":"這個專題在哪三個位置直接使用陣列？","answer":"ids/scores 保存最多 100 筆資料；seen[1000] 記錄 ID 是否出現；line[128] 承接每一行文字。","codes":[{"filename":"15_grade_file.c","pages":[123,124,125,126,127,128],"code":"#include \u003cctype.h>\n#include \u003cerrno.h>\n#include \u003cstdbool.h>\n#include \u003cstdio.h>\n#include \u003cstdlib.h>\n#include \u003cstring.h>\n#define CAP 100\n \nstatic int parse_record(const char *line, int *id, int *score) {\n    if (strlen(line) \u003c 6 || line[0] != 'S' || line[4] != ',')\n        return 0;\n    for (int i = 1; i \u003c= 3; ++i)\n        if (!isdigit((unsigned char)line[i])) return 0;\n    int number = (line[1] - '0') * 100 +\n                 (line[2] - '0') * 10 + line[3] - '0';\n    char *end;\n    errno = 0;\n    long value = strtol(line + 5, &end, 10);\n    if (end == line + 5 || errno == ERANGE || value \u003c 0 || value > 100)\n        return 0;\n    while (isspace((unsigned char)*end)) ++end;\n    if (*end != '\\0') return 0;\n    *id = number;\n    *score = (int)value;\n    return 1;\n}\n \nint main(int argc, char *argv[]) {\n    if (argc != 3) {\n        fputs(\"usage: grade_file input_csv new_report\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    FILE *in = fopen(argv[1], \"r\");\n    if (in == NULL) {\n        fputs(\"Cannot open input\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    int ids[CAP], scores[CAP], n = 0, failed = 0;\n    bool seen[1000] = {false};\n    char line[128];\n    size_t line_no = 0;\n    while (fgets(line, sizeof line, in) != NULL) {\n        ++line_no;\n        int id, score;\n        if (strchr(line, '\\n') == NULL && !feof(in)) {\n            fprintf(stderr, \"Line %zu: too long\\n\", line_no);\n            failed = 1;\n            break;\n        }\n        if (!parse_record(line, &id, &score)) {\n            fprintf(stderr, \"Line %zu: invalid record\\n\", line_no);\n            failed = 1;\n            break;\n        }\n        if (seen[id] || n == CAP) {\n            fprintf(stderr, \"Line %zu: duplicate ID or capacity exceeded\\n\",\n                    line_no);\n            failed = 1;\n            break;\n        }\n        seen[id] = true;\n        ids[n] = id;\n        scores[n] = score;\n        ++n;\n    }\n    if (ferror(in)) {\n        fputs(\"Input read error\\n\", stderr);\n        failed = 1;\n    }\n    if (fclose(in) != 0) failed = 1;\n    if (failed) return EXIT_FAILURE;\n    if (n == 0) {\n        fputs(\"Empty input\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    int sum = 0, pass = 0, low = scores[0], high = scores[0];\n    for (int i = 0; i \u003c n; ++i) {\n        sum += scores[i];\n        if (scores[i] >= 60) ++pass;\n        if (scores[i] \u003c low) low = scores[i];\n        if (scores[i] > high) high = scores[i];\n    }\n    FILE *out = fopen(argv[2], \"wx\");\n    if (out == NULL) {\n        fputs(\"Report exists or cannot be created\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    if (fprintf(out, \"count=%d average=%.2f min=%d max=%d pass=%d\\n\",\n                n, (double)sum / n, low, high, pass) \u003c 0)\n        failed = 1;\n    for (int i = 0; i \u003c n && !failed; ++i)\n        if (fprintf(out, \"S%03d,%d,%s\\n\", ids[i], scores[i],\n                    scores[i] >= 60 ? \"PASS\" : \"FAIL\") \u003c 0)\n            failed = 1;\n    if (fclose(out) != 0) failed = 1;\n    if (failed) {\n        fputs(\"Report write failed\\n\", stderr);\n        if (remove(argv[2]) != 0)\n            fputs(\"Warning: partial report remains\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    puts(\"Report created\");\n    return EXIT_SUCCESS;\n}\n","sha256":"0bf83c08ff3734fcd2acf5bf4d237187964a5878a4c6443b733664622bb9efdd","lineCount":104,"html":"\u003cspan class=\"code-line\" data-line=\"1\">\u003cspan class=\"lineno\" aria-hidden=\"true\">1\u003c/span>\u003cspan class=\"cp\">#include\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"cpf\">&lt;ctype.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"2\">\u003cspan class=\"lineno\" aria-hidden=\"true\">2\u003c/span>\u003cspan class=\"cp\">#include\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"cpf\">&lt;errno.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"3\">\u003cspan class=\"lineno\" aria-hidden=\"true\">3\u003c/span>\u003cspan class=\"cp\">#include\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"cpf\">&lt;stdbool.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"4\">\u003cspan class=\"lineno\" aria-hidden=\"true\">4\u003c/span>\u003cspan class=\"cp\">#include\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"cpf\">&lt;stdio.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"5\">\u003cspan class=\"lineno\" aria-hidden=\"true\">5\u003c/span>\u003 \"p\">);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"100\">\u003cspan class=\"lineno\" aria-hidden=\"true\">100\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"k\">return\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">EXIT_FAILURE\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"101\">\u003cspan class=\"lineno\" aria-hidden=\"true\">101\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"102\">\u003cspan class=\"lineno\" aria-hidden=\"true\">102\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"n\">puts\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s\">&quot;Report created&quot;\u003c/span>\u003cspan class=\"p\">);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"103\">\u003cspan class=\"lineno\" aria-hidden=\"true\">103\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">return\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">EXIT_SUCCESS\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"104\">\u003cspan class=\"lineno\" aria-hidden=\"true\">104\u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>","build":"gcc -std=c17 -Wall -Wextra -Wpedantic 15_grade_file.c -o 15_grade_file"}],"notes":[{"page":119,"title":"案例 15｜整合專題：成績檔驗證與報表","text":"【本頁目標】\n案例 15｜整合專題：成績檔驗證與報表\n完整題目：先確認任務、輸入、輸出與限制\n\n【教師講解】\n先不要展示解答。請學生用自己的話重述任務，再指出輸入格式、輸出格式與無效資料的處理。從成績文字檔載入資料，全部驗證通過後才建立統計報表；任一筆不合法就停止，不產生看似成功的部分報表。 1～100 筆；ID 為 S000～S999 且不可重複；成績 0～100。無 BOM/NUL 的文字檔；禁止空白行；目的報表必須不存在。\n\n【完整規格】\n任務：從成績文字檔載入資料，全部驗證通過後才建立統計報表；任一筆不合法就停止，不產生看似成功的部分報表。\n輸入：命令列：grade_file input_csv new_report。每行 Sddd,score，沒有標題列。\n輸出：報表第一行列出 count、average、min、max、pass；後續保留輸入順序，逐列輸出 ID、成績、PASS/FAIL。\n限制：1～100 筆；ID 為 S000～S999 且不可重複；成績 0～100。無 BOM/NUL 的文字檔；禁止空白行；目的報表必須不存在。\n範例輸入：\nS001,86\nS002,100\nS003,59\nS004,75\n範例輸出：\ncount=4 average=80.00 min=59 max=100 pass=3\nS001,86,PASS\nS002,100,PASS\nS003,59,FAIL\nS004,75,PASS\n\n【課堂提問】\n這個專題在哪三個位置直接使用陣列？\n\n【參考答案】\nids/scores 保存最多 100 筆資料；seen[1000] 記錄 ID 是否出現；line[128] 承接每一行文字。\n\n【來源與增補】\nA+B+C｜新增整合實作\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":120,"title":"專題契約｜先說清楚哪些資料要拒絕","text":"【本頁目標】\n專題契約｜先說清楚哪些資料要拒絕\n每一條驗證規則，都應對應一個可重現的測試。\n\n【教師講解】\n讓學生區分語法規則、數值規則、容量規則與副作用規則。本題不是一般 CSV 解析器；不支援引號、欄位內逗號或標題列。這些限制明確寫出後，才有一致的驗收標準。\n\n【表格帶讀】\n項目｜接受條件｜失敗政策\n來源格式｜無標題列；Sddd,score；ID 前不可加空白｜空白行、BOM、錯誤欄位立即失敗\n分數文字｜允許前後空白與正號；完整整數 0～100｜86abc、小數、超大整數均拒絕\n記錄數量｜1～100 筆；ID 不得重複｜第 101 筆或重複 ID，指出行號\n單行長度｜最多 126 bytes；來源為無 NUL 文字｜拒絕被緩衝區截斷的一行\n報表建立｜全部輸入驗證、讀取與關閉成功之後｜使用 wx；不得覆寫既有報表\n\n【課堂提問】\n檔案裡已有 99 筆，下一筆 ID 重複，應先存入再標示錯誤嗎？\n\n【參考答案】\n不應。先驗證 ID 和容量，成功才寫入 ids[n]/scores[n] 並增加 n。\n\n【來源與增補】\nA+B+C｜新增整合實作\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":121,"title":"案例 15｜核心解法與圖解","text":"【本頁目標】\n案例 15｜核心解法與圖解\n整合專題：成績檔驗證與報表\n\n【教師講解】\n依下列順序帶讀圖解：1. 載入：fgets 逐行取得資料，紀錄實際行號。 2. 驗證：格式、strtol、範圍、ID 去重與容量全部通過才存入。 3. 輸出：先完成所有驗證，再以 wx 建立報表；逐筆檢查寫入與關閉。 先輸出報表再驗證剩餘輸入，會留下半份結果。本題先完整載入與驗證，再建立目的檔。\n\n【課堂提問】\n這個專題在哪三個位置直接使用陣列？\n\n【參考答案】\nids/scores 保存最多 100 筆資料；seen[1000] 記錄 ID 是否出現；line[128] 承接每一行文字。\n\n【來源與增補】\nA+B+C｜新增整合實作\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":122,"title":"專題資料模型｜三個陣列，三種責任","text":"【本頁目標】\n專題資料模型｜三個陣列，三種責任\n儲存資料、記錄狀態、承接輸入，不要混成同一件事。\n\n【教師講解】\n對照四筆範例，ids 與 scores 以相同索引表示同一筆資料；seen 的索引卻是數值化 ID，長度因此為 1000。line 僅是可重複使用的暫存緩衝區，不是所有資料的永久存放處。\n\n【課堂提問】\nseen[86] 代表成績 86 分已經出現過嗎？\n\n【參考答案】\n不是；seen 的索引是 ID，seen[86] 代表 S086 已經被接受。\n\n【來源與增補】\nA+B+C｜新增整合實作\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":123,"title":"案例 15｜完整程式 1/6","text":"【本頁目標】\n案例 15｜完整程式 1/6\n15_grade_file.c\n\n【教師講解】\n本頁為 15_grade_file.c 的第 1/6 段，對應原始檔第 1～18 行。所有程式頁依序接續，沒有省略程式碼。匯入必要標頭與容量定義。parse_record 先檢查長度、S 前綴與逗號位置，再驗證三位 ID 數字，避免在未驗證前就使用索引。\n\n【程式帶讀】\n對應 15_grade_file.c，原始碼第 1～18 行。這是完整檔案第 1/6 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n#include \u003cctype.h>\n#include \u003cerrno.h>\n#include \u003cstdbool.h>\n#include \u003cstdio.h>\n#include \u003cstdlib.h>\n#include \u003cstring.h>\n#define CAP 100\n\nstatic int parse_record(const char *line, int *id, int *score) {\n    if (strlen(line) \u003c 6 || line[0] != 'S' || line[4] != ',')\n        return 0;\n    for (int i = 1; i \u003c= 3; ++i)\n        if (!isdigit((unsigned char)line[i])) return 0;\n    int number = (line[1] - '0') * 100 +\n                 (line[2] - '0') * 10 + line[3] - '0';\n    char *end;\n    errno = 0;\n    long value = strtol(line + 5, &end, 10);\n\n【課堂提問】\n這個專題在哪三個位置直接使用陣列？\n\n【參考答案】\nids/scores 保存最多 100 筆資料；seen[1000] 記錄 ID 是否出現；line[128] 承接每一行文字。\n\n【來源與增補】\nA+B+C｜新增整合實作\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":124,"title":"案例 15｜完整程式 2/6","text":"【本頁目標】\n案例 15｜完整程式 2/6\n15_grade_file.c\n\n【教師講解】\n本頁為 15_grade_file.c 的第 2/6 段，對應原始檔第 19～36 行。所有程式頁依序接續，沒有省略程式碼。strtol 解析分數，檢查沒有數字、ERANGE、0～100 及尾端雜字；全部合法才把 ID 和分數交給呼叫端。主程式另驗證命令列。\n\n【程式帶讀】\n對應 15_grade_file.c，原始碼第 19～36 行。這是完整檔案第 2/6 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n    if (end == line + 5 || errno == ERANGE || value \u003c 0 || value > 100)\n        return 0;\n    while (isspace((unsigned char)*end)) ++end;\n    if (*end != '\\0') return 0;\n    *id = number;\n    *score = (int)value;\n    return 1;\n}\n\nint main(int argc, char *argv[]) {\n    if (argc != 3) {\n        fputs(\"usage: grade_file input_csv new_report\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    FILE *in = fopen(argv[1], \"r\");\n    if (in == NULL) {\n        fputs(\"Cannot open input\\n\", stderr);\n        return EXIT_FAILURE;\n\n【課堂提問】\n這個專題在哪三個位置直接使用陣列？\n\n【參考答案】\nids/scores 保存最多 100 筆資料；seen[1000] 記錄 ID 是否出現；line[128] 承接每一行文字。\n\n【來源與增補】\nA+B+C｜新增整合實作\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":125,"title":"案例 15｜完整程式 3/6","text":"【本頁目標】\n案例 15｜完整程式 3/6\n15_grade_file.c\n\n【教師講解】\n本頁為 15_grade_file.c 的第 3/6 段，對應原始檔第 37～53 行。所有程式頁依序接續，沒有省略程式碼。開啟輸入後逐行讀取，維護行號。長行或 parse_record 失敗立即標記錯誤；只有完整解析的值才進入容量與重複檢查。\n\n【程式帶讀】\n對應 15_grade_file.c，原始碼第 37～53 行。這是完整檔案第 3/6 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n    }\n    int ids[CAP], scores[CAP], n = 0, failed = 0;\n    bool seen[1000] = {false};\n    char line[128];\n    size_t line_no = 0;\n    while (fgets(line, sizeof line, in) != NULL) {\n        ++line_no;\n        int id, score;\n        if (strchr(line, '\\n') == NULL && !feof(in)) {\n            fprintf(stderr, \"Line %zu: too long\\n\", line_no);\n            failed = 1;\n            break;\n        }\n        if (!parse_record(line, &id, &score)) {\n            fprintf(stderr, \"Line %zu: invalid record\\n\", line_no);\n            failed = 1;\n            break;\n\n【課堂提問】\n這個專題在哪三個位置直接使用陣列？\n\n【參考答案】\nids/scores 保存最多 100 筆資料；seen[1000] 記錄 ID 是否出現；line[128] 承接每一行文字。\n\n【來源與增補】\nA+B+C｜新增整合實作\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":126,"title":"案例 15｜完整程式 4/6","text":"【本頁目標】\n案例 15｜完整程式 4/6\n15_grade_file.c\n\n【教師講解】\n本頁為 15_grade_file.c 的第 4/6 段，對應原始檔第 54～70 行。所有程式頁依序接續，沒有省略程式碼。透過 seen[id] 偵測重複 ID，在寫入 ids[n] 和 scores[n] 之前檢查容量。讀取結束後檢查 ferror 和 fclose；輸入失敗時仍不建立報表。\n\n【程式帶讀】\n對應 15_grade_file.c，原始碼第 54～70 行。這是完整檔案第 4/6 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n        }\n        if (seen[id] || n == CAP) {\n            fprintf(stderr, \"Line %zu: duplicate ID or capacity exceeded\\n\",\n                    line_no);\n            failed = 1;\n            break;\n        }\n        seen[id] = true;\n        ids[n] = id;\n        scores[n] = score;\n        ++n;\n    }\n    if (ferror(in)) {\n        fputs(\"Input read error\\n\", stderr);\n        failed = 1;\n    }\n    if (fclose(in) != 0) failed = 1;\n\n【課堂提問】\n這個專題在哪三個位置直接使用陣列？\n\n【參考答案】\nids/scores 保存最多 100 筆資料；seen[1000] 記錄 ID 是否出現；line[128] 承接每一行文字。\n\n【來源與增補】\nA+B+C｜新增整合實作\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":127,"title":"案例 15｜完整程式 5/6","text":"【本頁目標】\n案例 15｜完整程式 5/6\n15_grade_file.c\n\n【教師講解】\n本頁為 15_grade_file.c 的第 5/6 段，對應原始檔第 71～87 行。所有程式頁依序接續，沒有省略程式碼。確認至少一筆資料，再走訪有效陣列計算總和、極值與及格數。以 wx 建立全新的輸出檔；既有檔案保持不變。\n\n【程式帶讀】\n對應 15_grade_file.c，原始碼第 71～87 行。這是完整檔案第 5/6 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n    if (failed) return EXIT_FAILURE;\n    if (n == 0) {\n        fputs(\"Empty input\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    int sum = 0, pass = 0, low = scores[0], high = scores[0];\n    for (int i = 0; i \u003c n; ++i) {\n        sum += scores[i];\n        if (scores[i] >= 60) ++pass;\n        if (scores[i] \u003c low) low = scores[i];\n        if (scores[i] > high) high = scores[i];\n    }\n    FILE *out = fopen(argv[2], \"wx\");\n    if (out == NULL) {\n        fputs(\"Report exists or cannot be created\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n\n【課堂提問】\n這個專題在哪三個位置直接使用陣列？\n\n【參考答案】\nids/scores 保存最多 100 筆資料；seen[1000] 記錄 ID 是否出現；line[128] 承接每一行文字。\n\n【來源與增補】\nA+B+C｜新增整合實作\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":128,"title":"案例 15｜完整程式 6/6","text":"【本頁目標】\n案例 15｜完整程式 6/6\n15_grade_file.c\n\n【教師講解】\n本頁為 15_grade_file.c 的第 6/6 段，對應原始檔第 88～104 行。所有程式頁依序接續，沒有省略程式碼。檢查統計與逐筆 fprintf，也檢查 fclose。任何輸出失敗嘗試移除本次建立的部分報表；成功才回傳成功狀態。這不提供所有檔案系統的原子交易保證。\n\n【程式帶讀】\n對應 15_grade_file.c，原始碼第 88～104 行。這是完整檔案第 6/6 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n    if (fprintf(out, \"count=%d average=%.2f min=%d max=%d pass=%d\\n\",\n                n, (double)sum / n, low, high, pass) \u003c 0)\n        failed = 1;\n    for (int i = 0; i \u003c n && !failed; ++i)\n        if (fprintf(out, \"S%03d,%d,%s\\n\", ids[i], scores[i],\n                    scores[i] >= 60 ? \"PASS\" : \"FAIL\") \u003c 0)\n            failed = 1;\n    if (fclose(out) != 0) failed = 1;\n    if (failed) {\n        fputs(\"Report write failed\\n\", stderr);\n        if (remove(argv[2]) != 0)\n            fputs(\"Warning: partial report remains\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    puts(\"Report created\");\n    return EXIT_SUCCESS;\n}\n\n【課堂提問】\n這個專題在哪三個位置直接使用陣列？\n\n【參考答案】\nids/scores 保存最多 100 筆資料；seen[1000] 記錄 ID 是否出現；line[128] 承接每一行文字。\n\n【來源與增補】\nA+B+C｜新增整合實作\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":129,"title":"案例 15｜測試與常見錯誤","text":"【本頁目標】\n案例 15｜測試與常見錯誤\n先預測結果，再執行；不只測一般資料。\n\n【教師講解】\n依表格逐組測試，確認返回狀態、stdout、stderr 與檔案內容。先輸出報表再驗證剩餘輸入，會留下半份結果。本題先完整載入與驗證，再建立目的檔。 對隨機或平台相依輸出，應測試性質，而不是把單一次執行結果當成唯一答案。\n\n【測試判讀】\n正常｜題目四筆資料｜平均 80.00；及格 3｜檔案→陣列→報表\n重複 ID｜S001 出現兩次｜失敗；不產生報表｜seen[1000] 去重\n格式／數值｜86abc、101、超大整數｜失敗並指出行號｜拒絕不完整解析\n空檔／超量｜0 筆或 101 筆｜失敗；不產生報表｜有效範圍 1～100\n目的已存在｜已存在的報表｜失敗；原檔不變｜建立模式保護資料\n本頁列出教學代表測試。附件測試器另外包含一般值、邊界與錯誤路徑；未模擬磁碟滿載、斷電、併發或所有作業系統。\n\n【課堂提問】\n這個專題在哪三個位置直接使用陣列？\n\n【參考答案】\nids/scores 保存最多 100 筆資料；seen[1000] 記錄 ID 是否出現；line[128] 承接每一行文字。\n\n【來源與增補】\nA+B+C｜新增整合實作\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":130,"title":"專題結果｜正常輸出與失敗時的檔案狀態","text":"【本頁目標】\n專題結果｜正常輸出與失敗時的檔案狀態\n同樣重要的兩個答案：算出什麼，以及哪些檔案不該被改動。\n\n【教師講解】\n用四筆樣本逐筆重算總分 320、平均 80、及格 3。接著示範在第二行加入非法分數時，報表不應被建立；如果目的報表早已存在，內容應維持不變。這比只看終端機印出成功更能驗證整合行為。\n\n【課堂提問】\n輸入驗證全部通過，就可以在寫入前印出 Report created 嗎？\n\n【參考答案】\n不能。fprintf 或 fclose 仍可能失敗；完成訊息必須放在所有必要輸出成功之後。\n\n【來源與增補】\nA+B+C｜新增整合實作\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"}],"source_tests":["正常｜題目四筆資料｜平均 80.00；及格 3｜檔案→陣列→報表","重複 ID｜S001 出現兩次｜失敗；不產生報表｜seen[1000] 去重","格式／數值｜86abc、101、超大整數｜失敗並指出行號｜拒絕不完整解析","空檔／超量｜0 筆或 101 筆｜失敗；不產生報表｜有效範圍 1～100","目的已存在｜已存在的報表｜失敗；原檔不變｜建立模式保護資料"],"annotation":{"lines":[[8,23,"parse_record 專責單筆解析","確認 Sddd, 前綴，再用 strtol 檢查成績與尾端；成功才把 ID 與 score 交給呼叫端。"],[42,64,"逐筆驗證才存入陣列","保持實際行號，先檢查長度及格式，再檢查 ID 重複與 100 筆容量。"],[66,87,"來源完全通過才建立報表","先確認讀取、關閉及非空資料，再統計；以 wx 新建報表，避免覆寫既有檔。"],[88,103,"每一步輸出都要有成功證據","檢查 fprintf、逐筆寫入與 fclose；失敗時嘗試移除不完整報表，成功才輸出 Report created。"]],"boundary":"本次補充測試具體化了正常、空檔、空白行、ID 重複、超長行與容量超限等情境。所有測試遵守原題無 BOM／NUL 的來源約定；不把範圍外的資料當成已經安全驗證。"}}],"slides":[{"page":1,"title":"陣列、檔案 I/O\n與錯誤處理","notes":"【本頁目標】\n陣列、檔案 I/O 與錯誤處理\n把三章串成一條可執行、可測試的資料處理流程\n\n【教師講解】\n本教材以三份原稿共 245 頁為基礎，重排成陣列、檔案輸入輸出、錯誤處理與整合專題。保留原稿概念與主要案例；新增的規格、測試、圖解及勘誤均有標籤。先用四筆成績的資料流說明：輸入要驗證，陣列要有邊界，統計要符合題意，報表要確認寫入成功。\n\n【課堂提問】\n一個程式印出正確平均值，是否就代表整個系統正確？\n\n【參考答案】\n未必。還需要確認輸入是否合法、陣列未越界、報表確實寫入且失敗時不毀損既有資料。\n\n【來源與增補】\nA 64頁 + B 172頁 + C 9頁\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":2,"title":"課程地圖｜從儲存資料到可靠輸出","notes":"【本頁目標】\n課程地圖｜從儲存資料到可靠輸出\n15 個完整案例，16 支獨立 C 程式；每題先規格、後解法。\n\n【教師講解】\n依陣列、I/O、錯誤處理、整合專題順序授課。每個單元以一個具體能力作結，而不是要求學生背函式名稱。案例 10 提供同一題目的逐字元版與區塊版，因此程式檔比題目多一支。可依課程進度拆成多次授課，但完整題目頁應保留在解答之前。\n\n【課堂提問】\n案例 10 為何需要兩個版本？\n\n【參考答案】\n在同一輸入、輸出和錯誤處理契約下，比較資料搬移單位的差異，避免把最佳化誤當成變更題意。\n\n【來源與增補】\nA+B+C\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":3,"title":"導讀｜先分清楚三種教材內容","notes":"【本頁目標】\n導讀｜先分清楚三種教材內容\n主案例採 C17；原稿中的 C99 特性會另外指出。\n\n【教師講解】\n提醒學生：檢查 scanf 的回傳值是必要條件，卻不能把不受信任的任意長數字安全轉成 int。為降低初學陣列時的負擔，前七題把「可由型別表示」寫成測試資料前提；到了錯誤處理單元再解除這個限制，改用 fgets 加 strtol。程式碼小片段只用於解釋語法，完整案例另有獨立 .c 檔。\n\n【本頁收斂】\n案例固定順序：完整題目 → 核心解法／圖解 → 完整程式 → 測試。\n\n【課堂提問】\n為何看到 scanf 回傳 1 仍不應宣稱能處理任意外部輸入？\n\n【參考答案】\n數值轉換是否可由目標型別表示也是問題；需要可控錯誤回報時，應使用整行讀取加 strtol 與完整驗證。\n\n【來源與增補】\nA+B+C｜新增導讀\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":4,"title":"01｜陣列：同型別、多筆值、連續元素","notes":"【本頁目標】\n01｜陣列：同型別、多筆值、連續元素\n一個陣列名稱管理多筆資料；索引決定要存取哪一筆。\n\n【教師講解】\n從單一 scalar 變數與 aggregate 變數的差異切入。陣列元素型別相同，元素之間依序配置；圖上的位址假設每個 int 為 4 bytes，只是用來解釋位移，不是所有平台保證。元素 a[i] 本身可作為左值讀寫，但整個陣列不是可直接互相指定的普通 scalar。\n\n【本頁收斂】\n元素位置：base + i × sizeof(a[0])；型別大小以實作為準。\n\n【課堂提問】\nint a[5] 的最後一個元素是哪個？\n\n【參考答案】\na[4]。長度是 5，但合法索引從 0 到 4。\n\n【來源與增補】\nA pp.2–7\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":5,"title":"索引與走訪｜邊界是程式的責任","notes":"【本頁目標】\n索引與走訪｜邊界是程式的責任\nC 不保證替你檢查陣列索引；越界存取是未定義行為。\n\n【教師講解】\n對照 i\u003cN 與 i\u003c=N。示意圖把 a[N] 畫在陣列之外，強調不是某個可依賴的額外元素。越界可能看似正常、破壞其他資料或中止，不應用某次編譯結果當成標準答案。讀入資料前先確認有效筆數，走訪時再維持索引範圍。\n\n【本頁收斂】\n合法範圍永遠是 0 ≤ i \u003c N；先驗證，再索引。\n\n【課堂提問】\n為何不能把越界程式執行一次後，記住得到的輸出？\n\n【參考答案】\n因為未定義行為沒有可攜的結果保證；編譯最佳化、資料配置或平台不同都可能改變行為。\n\n【來源與增補】\nA pp.8–11\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":6,"title":"初始化｜省略的元素補零，不等於所有陣列自動歸零","notes":"【本頁目標】\n初始化｜省略的元素補零，不等於所有陣列自動歸零\n區分「有初始列」、「沒有初始列」與儲存期。\n\n【教師講解】\n原稿 p.16 提到空初始列合法，與本教材 C17 基準不合；明確標示修正而非悄悄更換。把有初始列但長度不足的零填補，和沒有初始列的區域陣列區分開。不同儲存期有不同規則，所以不要讓學生形成「大括號可有可無」的錯覺。\n\n【表格帶讀】\n宣告／片段｜有效內容或意義｜要注意什麼\nint a[6] = {1, 2};｜1 2 0 0 0 0｜有初始列但未指定的元素補零\nint a[6] = {0};｜全部元素為 0｜C17 可攜的全零寫法\nint a[] = {1, 2, 3};｜長度由初始列推得為 3｜宣告時可省略第一維長度\n區域 int a[6];｜未初始化；不可假設全為 0｜使用前逐項賦值\nstatic int a[6];｜靜態儲存期，初值全為 0｜規則來自儲存期\nint a[6] = {};｜本教材 C17 不採用｜原稿 p.16 的空初始列敘述需勘誤\n\n【課堂提問】\nint a[6]={1,2} 中，a[5] 是不確定值嗎？\n\n【參考答案】\n不是，因為有初始列；未指定的其餘元素初始化為零。\n\n【來源與增補】\nA pp.14–17｜W1 §6.7.9\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。\n【外部校核來源】\nW1 — https://www.open-std.org/jtc1/sc22/wg14/www/docs/n1570.pdf （C11 委員會草案，引用與 C17 共通的核心條款）\nW2 — https://learn.microsoft.com/en-us/cpp/overview/install-c17-support?view=msvc-170\nW3 — https://learn.microsoft.com/en-us/cpp/c-runtime-library/reference/fopen-wfopen?view=msvc-170\nW4 — https://learn.microsoft.com/en-us/cpp/c-runtime-library/reference/strtol-wcstol-strtol-l-wcstol-l?view=msvc-170"},{"page":7,"title":"指定初始化｜直接指定索引，建立稀疏表","notes":"【本頁目標】\n指定初始化｜直接指定索引，建立稀疏表\nC99 designated initializer：位置清楚，比長串 0 更容易維護。\n\n【教師講解】\n先展示 a[15] 中只有三個位置非零的例子，再展開混合初始化 c[10]。學生最常忽略指定索引後，一般值會接續從下一個位置開始。索引必須是整數常數運算式；const 查表則用於提醒此資料在程式中不應被修改。\n\n【本頁收斂】\n不要用大量看不出位置的 0；在語意重要的位置標明索引。\n\n【課堂提問】\nint c[10]={5,1,9,[4]=3,7,2,[8]=6}; 的 c[5] 是多少？\n\n【參考答案】\n7。指定 [4]=3 後，接著的一般初始值從索引 5 開始。\n\n【來源與增補】\nA pp.18–22,46–48\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":8,"title":"sizeof 與 size_t｜知道容量，也要知道適用範圍","notes":"【本頁目標】\nsizeof 與 size_t｜知道容量，也要知道適用範圍\nsizeof 陣列 / sizeof 元素，必須在「真正的陣列」上使用。\n\n【教師講解】\n以五元素 int 陣列示範 20/4=5，但數字 4 是圖解假設。C 使用 size_t，不是原稿截圖中的 C++ std::size_t。陣列作為函式參數時會調整成指標，此時 sizeof a 是指標大小；介面應另外傳入有效長度。size_t 是無號型別，倒數迴圈要避免 i>=0 永遠成立。\n\n【本頁收斂】\n用 size_t 搭配 %zu；長度與容量應成為函式契約的一部分。\n\n【課堂提問】\nvoid f(int a[]) 裡可以用 sizeof a/sizeof a[0] 算出呼叫端長度嗎？\n\n【參考答案】\n不行。參數 a 已是指標；必須由呼叫端另外傳入長度。\n\n【來源與增補】\nA pp.26–30｜W1 §6.5.3.4\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。\n【外部校核來源】\nW1 — https://www.open-std.org/jtc1/sc22/wg14/www/docs/n1570.pdf （C11 委員會草案，引用與 C17 共通的核心條款）\nW2 — https://learn.microsoft.com/en-us/cpp/overview/install-c17-support?view=msvc-170\nW3 — https://learn.microsoft.com/en-us/cpp/c-runtime-library/reference/fopen-wfopen?view=msvc-170\nW4 — https://learn.microsoft.com/en-us/cpp/c-runtime-library/reference/strtol-wcstol-strtol-l-wcstol-l?view=msvc-170"},{"page":9,"title":"副作用｜把索引更新與資料存取拆開","notes":"【本頁目標】\n副作用｜把索引更新與資料存取拆開\na[i++] = 0 與 a[i] = b[i++] 不是同一種風險。\n\n【教師講解】\n前一式只在該位置使用舊 i，之後更新 i，適當邊界下可使用。後一式同時讀 i 作左側索引又在右側修改 i，C17 下沒有需要的定序，屬未定義行為。不要引導學生猜左邊或右邊先算；用分開敘述或 for 迴圈明確安排順序。\n\n【本頁收斂】\n可讀的寫法也比較容易驗證：a[i] = b[i]; 然後再 ++i。\n\n【課堂提問】\n能不能用「賦值由右向左」證明 a[i]=b[i++] 正確？\n\n【參考答案】\n不能。運算子結合性不等於運算元求值順序；該式在 C17 下不具所需定序。\n\n【來源與增補】\nA pp.10–11｜W1 §6.5\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。\n【外部校核來源】\nW1 — https://www.open-std.org/jtc1/sc22/wg14/www/docs/n1570.pdf （C11 委員會草案，引用與 C17 共通的核心條款）\nW2 — https://learn.microsoft.com/en-us/cpp/overview/install-c17-support?view=msvc-170\nW3 — https://learn.microsoft.com/en-us/cpp/c-runtime-library/reference/fopen-wfopen?view=msvc-170\nW4 — https://learn.microsoft.com/en-us/cpp/c-runtime-library/reference/strtol-wcstol-strtol-l-wcstol-l?view=msvc-170"},{"page":10,"title":"案例 01｜反向輸出 10 筆量測值","notes":"【本頁目標】\n案例 01｜反向輸出 10 筆量測值\n完整題目：先確認任務、輸入、輸出與限制\n\n【教師講解】\n先不要展示解答。請學生用自己的話重述任務，再指出輸入格式、輸出格式與無效資料的處理。依序讀入 10 筆整數量測值，保留原本儲存順序，再由最後一筆往前輸出。不得把題目改成排序。 每筆介於 −10000～10000；缺項、非數字或超出範圍即失敗。入門數值文字約定見導讀頁。\n\n【完整規格】\n任務：依序讀入 10 筆整數量測值，保留原本儲存順序，再由最後一筆往前輸出。不得把題目改成排序。\n輸入：標準輸入：恰好 10 個整數，以空白或換行分隔。\n輸出：由第 10 筆到第 1 筆輸出；數字間一個空白，最後換行。\n限制：每筆介於 −10000～10000；缺項、非數字或超出範圍即失敗。入門數值文字約定見導讀頁。\n範例輸入：\n34 82 49 102 7 94 23 11 50 31\n範例輸出：\n31 50 11 23 94 7 102 49 82 34\n\n【課堂提問】\n為何輸出迴圈讀 a[i−1]，而不是 a[i]？\n\n【參考答案】\ni 由元素數量 10 開始；先減 1 才對應最後有效索引 9。i>0 也避免 unsigned 倒數下溢。\n\n【來源與增補】\nA pp.12–13\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":11,"title":"案例 01｜核心解法與圖解","notes":"【本頁目標】\n案例 01｜核心解法與圖解\n反向輸出 10 筆量測值\n\n【教師講解】\n依下列順序帶讀圖解：1. 先以正向迴圈填入 a[0]～a[9]。 2. 第二個迴圈從 i=10 遞減，讀取 a[i−1]。 3. 只改變輸出順序，不交換陣列元素。 錯誤的起點 a[10] 已越界；最後有效索引是 9。此題不是就地反轉。\n\n【課堂提問】\n為何輸出迴圈讀 a[i−1]，而不是 a[i]？\n\n【參考答案】\ni 由元素數量 10 開始；先減 1 才對應最後有效索引 9。i>0 也避免 unsigned 倒數下溢。\n\n【來源與增補】\nA pp.12–13\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":12,"title":"案例 01｜完整程式 1/1","notes":"【本頁目標】\n案例 01｜完整程式 1/1\n01_reverse.c\n\n【教師講解】\n本頁為 01_reverse.c 的第 1/1 段，對應原始檔第 1～17 行。所有程式頁依序接續，沒有省略程式碼。建立固定長度陣列，逐筆檢查 scanf 回傳值及範圍。讀入全部成功後才由 i=N 向下讀 a[i-1]；這只是反向輸出，沒有修改原陣列次序。\n\n【程式帶讀】\n對應 01_reverse.c，原始碼第 1～17 行。這是完整檔案第 1/1 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n#include \u003cstdio.h>\n#include \u003cstdlib.h>\n#define N 10\n\nint main(void) {\n    int a[N];\n    for (int i = 0; i \u003c N; ++i) {\n        if (scanf(\"%d\", &a[i]) != 1 ||\n            a[i] \u003c -10000 || a[i] > 10000) {\n            fputs(\"Invalid integer input\\n\", stderr);\n            return EXIT_FAILURE;\n        }\n    }\n    for (int i = N; i > 0; --i)\n        printf(\"%d%c\", a[i - 1], i == 1 ? '\\n' : ' ');\n    return EXIT_SUCCESS;\n}\n\n【課堂提問】\n為何輸出迴圈讀 a[i−1]，而不是 a[i]？\n\n【參考答案】\ni 由元素數量 10 開始；先減 1 才對應最後有效索引 9。i>0 也避免 unsigned 倒數下溢。\n\n【來源與增補】\nA pp.12–13\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":13,"title":"案例 01｜測試與常見錯誤","notes":"【本頁目標】\n案例 01｜測試與常見錯誤\n先預測結果，再執行；不只測一般資料。\n\n【教師講解】\n依表格逐組測試，確認返回狀態、stdout、stderr 與檔案內容。錯誤的起點 a[10] 已越界；最後有效索引是 9。此題不是就地反轉。 對隨機或平台相依輸出，應測試性質，而不是把單一次執行結果當成唯一答案。\n\n【測試判讀】\n正常｜10 筆題目資料｜31 50 … 82 34｜確認前後次序\n邊界｜含負值與 0｜全部正確反向｜不是數值排序\n缺項｜1 2 後結束輸入｜失敗；stderr 訊息｜不可讀未初始化值\n格式錯誤｜1 2 x｜失敗；stderr 訊息｜檢查 scanf 回傳\n本頁列出教學代表測試。附件測試器另外包含一般值、邊界與錯誤路徑；未模擬磁碟滿載、斷電、併發或所有作業系統。\n\n【課堂提問】\n為何輸出迴圈讀 a[i−1]，而不是 a[i]？\n\n【參考答案】\ni 由元素數量 10 開始；先減 1 才對應最後有效索引 9。i>0 也避免 unsigned 倒數下溢。\n\n【來源與增補】\nA pp.12–13\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":14,"title":"案例 02｜用布林陣列偵測重複數字","notes":"【本頁目標】\n案例 02｜用布林陣列偵測重複數字\n完整題目：先確認任務、輸入、輸出與限制\n\n【教師講解】\n先不要展示解答。請學生用自己的話重述任務，再指出輸入格式、輸出格式與無效資料的處理。讀入一個非負整數，從個位數往高位數檢查，找出第一個「再次出現」的數字；完全沒有重複則明確回報。 0 ≤ n ≤ 2147483647。n=0 視為一個數字 0；不保留前導零，負數與錯誤輸入拒絕。\n\n【完整規格】\n任務：讀入一個非負整數，從個位數往高位數檢查，找出第一個「再次出現」的數字；完全沒有重複則明確回報。\n輸入：標準輸入：一個十進位整數 n。\n輸出：輸出 Repeated digit: d；若無重複，輸出 No repeated digit。\n限制：0 ≤ n ≤ 2147483647。n=0 視為一個數字 0；不保留前導零，負數與錯誤輸入拒絕。\n範例輸入：\n28212\n範例輸出：\nRepeated digit: 2\n\n【課堂提問】\n為何 n=0 不使用 while(n>0) 就結束？\n\n【參考答案】\n題目把 0 視為具有一位數的有效輸入；do…while 至少執行一次，與題意一致。\n\n【來源與增補】\nA pp.23–25\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":15,"title":"案例 02｜核心解法與圖解","notes":"【本頁目標】\n案例 02｜核心解法與圖解\n用布林陣列偵測重複數字\n\n【教師講解】\n依下列順序帶讀圖解：1. seen[10] 初值全 false；索引就是數字 0～9。 2. digit=n%10 取得個位數，先檢查 seen[digit]。 3. 未出現則設 true、n/=10；do…while 讓 0 也被處理一次。 不能先把 seen[digit] 設為 true 再判斷，否則每個數字都會被誤判為重複。\n\n【課堂提問】\n為何 n=0 不使用 while(n>0) 就結束？\n\n【參考答案】\n題目把 0 視為具有一位數的有效輸入；do…while 至少執行一次，與題意一致。\n\n【來源與增補】\nA pp.23–25\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":16,"title":"案例 02｜完整程式 1/2","notes":"【本頁目標】\n案例 02｜完整程式 1/2\n02_repeated_digits.c\n\n【教師講解】\n本頁為 02_repeated_digits.c 的第 1/2 段，對應原始檔第 1～14 行。所有程式頁依序接續，沒有省略程式碼。建立長度 10 的 seen 表並全設 false。先驗證非負整數範圍，準備以十進位數字當成狀態表索引。\n\n【程式帶讀】\n對應 02_repeated_digits.c，原始碼第 1～14 行。這是完整檔案第 1/2 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n#include \u003cstdbool.h>\n#include \u003cstdio.h>\n#include \u003cstdlib.h>\n\nint main(void) {\n    bool seen[10] = {false};\n    long n;\n    int repeated = -1;\n    if (scanf(\"%ld\", &n) != 1 ||\n        n \u003c 0 || n > 2147483647L) {\n        fputs(\"Expected 0..2147483647\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    do {\n\n【課堂提問】\n為何 n=0 不使用 while(n>0) 就結束？\n\n【參考答案】\n題目把 0 視為具有一位數的有效輸入；do…while 至少執行一次，與題意一致。\n\n【來源與增補】\nA pp.23–25\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":17,"title":"案例 02｜完整程式 2/2","notes":"【本頁目標】\n案例 02｜完整程式 2/2\n02_repeated_digits.c\n\n【教師講解】\n本頁為 02_repeated_digits.c 的第 2/2 段，對應原始檔第 15～28 行。所有程式頁依序接續，沒有省略程式碼。用 do-while 讓 0 也能被處理。每次以 %10 取數字，先查表再標记；再次遇見 true 即可回報重複，最後用 /=10 移除末位。\n\n【程式帶讀】\n對應 02_repeated_digits.c，原始碼第 15～28 行。這是完整檔案第 2/2 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n        int digit = (int)(n % 10);\n        if (seen[digit]) {\n            repeated = digit;\n            break;\n        }\n        seen[digit] = true;\n        n /= 10;\n    } while (n > 0);\n    if (repeated >= 0)\n        printf(\"Repeated digit: %d\\n\", repeated);\n    else\n        puts(\"No repeated digit\");\n    return EXIT_SUCCESS;\n}\n\n【課堂提問】\n為何 n=0 不使用 while(n>0) 就結束？\n\n【參考答案】\n題目把 0 視為具有一位數的有效輸入；do…while 至少執行一次，與題意一致。\n\n【來源與增補】\nA pp.23–25\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":18,"title":"案例 02｜測試與常見錯誤","notes":"【本頁目標】\n案例 02｜測試與常見錯誤\n先預測結果，再執行；不只測一般資料。\n\n【教師講解】\n依表格逐組測試，確認返回狀態、stdout、stderr 與檔案內容。不能先把 seen[digit] 設為 true 再判斷，否則每個數字都會被誤判為重複。 對隨機或平台相依輸出，應測試性質，而不是把單一次執行結果當成唯一答案。\n\n【測試判讀】\n有重複｜28212｜Repeated digit: 2｜第 3 次取出的 2 已看過\n無重複｜9357｜No repeated digit｜各索引只設一次\n零｜0｜No repeated digit｜仍應處理一次\n零重複｜100｜Repeated digit: 0｜兩個 0 需要被辨認\n不合法｜−1｜失敗｜不可讓 digit 成負索引\n本頁列出教學代表測試。附件測試器另外包含一般值、邊界與錯誤路徑；未模擬磁碟滿載、斷電、併發或所有作業系統。\n\n【課堂提問】\n為何 n=0 不使用 while(n>0) 就結束？\n\n【參考答案】\n題目把 0 視為具有一位數的有效輸入；do…while 至少執行一次，與題意一致。\n\n【來源與增補】\nA pp.23–25\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":19,"title":"案例 03｜班級成績統計與分布","notes":"【本頁目標】\n案例 03｜班級成績統計與分布\n完整題目：先確認任務、輸入、輸出與限制\n\n【教師講解】\n先不要展示解答。請學生用自己的話重述任務，再指出輸入格式、輸出格式與無效資料的處理。讀入全班成績，計算總分、平均、最高分、最低分、及格人數，並統計五個成績區間。 1 ≤ n ≤ 100；0 ≤ 成績 ≤ 100；及格為 ≥60。分組：0–59、60–69、70–79、80–89、90–100。\n\n【完整規格】\n任務：讀入全班成績，計算總分、平均、最高分、最低分、及格人數，並統計五個成績區間。\n輸入：先輸入人數 n，再輸入 n 個整數成績。\n輸出：輸出 count、sum、min、max、average（小數 2 位）、pass 與五個 bins。\n限制：1 ≤ n ≤ 100；0 ≤ 成績 ≤ 100；及格為 ≥60。分組：0–59、60–69、70–79、80–89、90–100。\n範例輸入：\n5\n59 60 75 90 100\n範例輸出：\ncount=5 sum=384 min=59 max=100\naverage=76.80 pass=4\nbins=1 1 1 0 2\n\n【課堂提問】\n為何 bins[score/10] 不能直接用在長度 10 的陣列？\n\n【參考答案】\n100/10=10，會存取第 11 格而越界。本題採明確的五區間映射，把 90～100 合併。\n\n【來源與增補】\nA pp.8,26–30｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":20,"title":"案例 03｜核心解法與圖解","notes":"【本頁目標】\n案例 03｜核心解法與圖解\n班級成績統計與分布\n\n【教師講解】\n依下列順序帶讀圖解：1. 先驗證人數與每筆成績，再開始統計。 2. 以第一筆初始化 min/max；用同一趟掃描累加。 3. 100 分併入最後一組；平均前轉為 double。 sum/n 若先做整數除法再指定給 double，小數已經遺失；需用 (double)sum/n。\n\n【課堂提問】\n為何 bins[score/10] 不能直接用在長度 10 的陣列？\n\n【參考答案】\n100/10=10，會存取第 11 格而越界。本題採明確的五區間映射，把 90～100 合併。\n\n【來源與增補】\nA pp.8,26–30｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":21,"title":"案例 03｜完整程式 1/2","notes":"【本頁目標】\n案例 03｜完整程式 1/2\n03_score_stats.c\n\n【教師講解】\n本頁為 03_score_stats.c 的第 1/2 段，對應原始檔第 1～18 行。所有程式頁依序接續，沒有省略程式碼。配置固定容量 100 的資料陣列與五格 bins。先確認有效筆數與每筆 0～100 分的範圍；失敗時不讓未完成資料進入統計。\n\n【程式帶讀】\n對應 03_score_stats.c，原始碼第 1～18 行。這是完整檔案第 1/2 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n#include \u003cstdio.h>\n#include \u003cstdlib.h>\n#define CAP 100\n\nint main(void) {\n    int score[CAP], bins[5] = {0};\n    int n, sum = 0, pass = 0;\n    if (scanf(\"%d\", &n) != 1 || n \u003c 1 || n > CAP) {\n        fputs(\"Expected count 1..100\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    for (int i = 0; i \u003c n; ++i) {\n        if (scanf(\"%d\", &score[i]) != 1 ||\n            score[i] \u003c 0 || score[i] > 100) {\n            fputs(\"Invalid score\\n\", stderr);\n            return EXIT_FAILURE;\n        }\n    }\n\n【課堂提問】\n為何 bins[score/10] 不能直接用在長度 10 的陣列？\n\n【參考答案】\n100/10=10，會存取第 11 格而越界。本題採明確的五區間映射，把 90～100 合併。\n\n【來源與增補】\nA pp.8,26–30｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":22,"title":"案例 03｜完整程式 2/2","notes":"【本頁目標】\n案例 03｜完整程式 2/2\n03_score_stats.c\n\n【教師講解】\n本頁為 03_score_stats.c 的第 2/2 段，對應原始檔第 19～35 行。所有程式頁依序接續，沒有省略程式碼。從第一筆設定最小值與最大值，走訪 n 筆更新總分、及格數與區間。90～100 共用最後一格，避免把 100 分當成索引 5。平均值先轉 double，輸出保留兩位小數。\n\n【程式帶讀】\n對應 03_score_stats.c，原始碼第 19～35 行。這是完整檔案第 2/2 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n    int low = score[0], high = score[0];\n    for (int i = 0; i \u003c n; ++i) {\n        int s = score[i];\n        sum += s;\n        if (s \u003c low) low = s;\n        if (s > high) high = s;\n        if (s >= 60) ++pass;\n        int b = s \u003c 60 ? 0 : (s >= 90 ? 4 : s / 10 - 5);\n        ++bins[b];\n    }\n    printf(\"count=%d sum=%d min=%d max=%d\\n\",\n           n, sum, low, high);\n    printf(\"average=%.2f pass=%d\\n\", (double)sum / n, pass);\n    printf(\"bins=%d %d %d %d %d\\n\",\n           bins[0], bins[1], bins[2], bins[3], bins[4]);\n    return EXIT_SUCCESS;\n}\n\n【課堂提問】\n為何 bins[score/10] 不能直接用在長度 10 的陣列？\n\n【參考答案】\n100/10=10，會存取第 11 格而越界。本題採明確的五區間映射，把 90～100 合併。\n\n【來源與增補】\nA pp.8,26–30｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":23,"title":"案例 03｜測試與常見錯誤","notes":"【本頁目標】\n案例 03｜測試與常見錯誤\n先預測結果，再執行；不只測一般資料。\n\n【教師講解】\n依表格逐組測試，確認返回狀態、stdout、stderr 與檔案內容。sum/n 若先做整數除法再指定給 double，小數已經遺失；需用 (double)sum/n。 對隨機或平台相依輸出，應測試性質，而不是把單一次執行結果當成唯一答案。\n\n【測試判讀】\n一般｜59 60 75 90 100｜平均 76.80；及格 4｜驗證各組與平均\n單筆｜n=1，score=100｜min=max=100｜初始化不可假設 0\n分界｜0,59,60,69,70,89,100｜bins=2 2 1 1 1｜確認閉區間\n容量｜n=0 或 101｜失敗｜先驗證才寫陣列\n範圍｜score=101｜失敗｜不能當成新分組\n本頁列出教學代表測試。附件測試器另外包含一般值、邊界與錯誤路徑；未模擬磁碟滿載、斷電、併發或所有作業系統。\n\n【課堂提問】\n為何 bins[score/10] 不能直接用在長度 10 的陣列？\n\n【參考答案】\n100/10=10，會存取第 11 格而越界。本題採明確的五區間映射，把 90～100 合併。\n\n【來源與增補】\nA pp.8,26–30｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":24,"title":"案例 04｜有先後順序的最大增幅","notes":"【本頁目標】\n案例 04｜有先後順序的最大增幅\n完整題目：先確認任務、輸入、輸出與限制\n\n【教師講解】\n先不要展示解答。請學生用自己的話重述任務，再指出輸入格式、輸出格式與無效資料的處理。量測陣列中的位置代表時間。找出 max(a[j]−a[i])，且必須滿足 i\u003cj；比較雙迴圈與單次掃描兩種解法。 2 ≤ n ≤ 100；數值介於 −10000～10000。必須選兩個不同時刻；全程下降時答案可能為負。\n\n【完整規格】\n任務：量測陣列中的位置代表時間。找出 max(a[j]−a[i])，且必須滿足 i\u003cj；比較雙迴圈與單次掃描兩種解法。\n輸入：先輸入 n，再輸入 n 個整數量測值。\n輸出：同一行輸出 brute 與 linear 的結果，兩者必須相同。\n限制：2 ≤ n ≤ 100；數值介於 −10000～10000。必須選兩個不同時刻；全程下降時答案可能為負。\n範例輸入：\n5\n10 15 90 200 110\n範例輸出：\nbrute=190 linear=190\n\n【課堂提問】\n為何要先算差值，再更新 min_before？\n\n【參考答案】\n計算時 min_before 只能來自更早的位置，才能保證 i\u003cj；先更新會把當前元素當成自己的前值。\n\n【來源與增補】\nA pp.59–60｜新增線性解法\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":25,"title":"案例 04｜核心解法與圖解","notes":"【本頁目標】\n案例 04｜核心解法與圖解\n有先後順序的最大增幅\n\n【教師講解】\n依下列順序帶讀圖解：1. 暴力法枚舉所有 i\u003cj，時間 O(n²)。 2. 線性法在處理 j 前，保存 a[0..j−1] 的最小值。 3. 先用當前值計算增幅，再更新最小值；時間 O(n)、額外空間 O(1)。 不加順序限制的 max−min 是另一道題。best=0 會把全下降資料錯答成 0。\n\n【課堂提問】\n為何要先算差值，再更新 min_before？\n\n【參考答案】\n計算時 min_before 只能來自更早的位置，才能保證 i\u003cj；先更新會把當前元素當成自己的前值。\n\n【來源與增補】\nA pp.59–60｜新增線性解法\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":26,"title":"案例 04｜完整程式 1/3","notes":"【本頁目標】\n案例 04｜完整程式 1/3\n04_ordered_difference.c\n\n【教師講解】\n本頁為 04_ordered_difference.c 的第 1/3 段，對應原始檔第 1～14 行。所有程式頁依序接續，沒有省略程式碼。暴力版只枚舉 j>i 的配對。以第一組合法配對初始化 best，而不是以 0 初始化；全部遞減時答案仍可能為負。\n\n【程式帶讀】\n對應 04_ordered_difference.c，原始碼第 1～14 行。這是完整檔案第 1/3 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n#include \u003cstdio.h>\n#include \u003cstdlib.h>\n#define CAP 100\n\nstatic long long brute(const int a[], int n) {\n    long long best = (long long)a[1] - a[0];\n    for (int i = 0; i \u003c n - 1; ++i)\n        for (int j = i + 1; j \u003c n; ++j) {\n            long long d = (long long)a[j] - a[i];\n            if (d > best) best = d;\n        }\n    return best;\n}\n\n\n【課堂提問】\n為何要先算差值，再更新 min_before？\n\n【參考答案】\n計算時 min_before 只能來自更早的位置，才能保證 i\u003cj；先更新會把當前元素當成自己的前值。\n\n【來源與增補】\nA pp.59–60｜新增線性解法\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":27,"title":"案例 04｜完整程式 2/3","notes":"【本頁目標】\n案例 04｜完整程式 2/3\n04_ordered_difference.c\n\n【教師講解】\n本頁為 04_ordered_difference.c 的第 2/3 段，對應原始檔第 15～28 行。所有程式頁依序接續，沒有省略程式碼。線性版維持處理位置之前的最小值。先計算目前元素可形成的差，再更新前綴最小值。long long 的轉型在相減之前完成。\n\n【程式帶讀】\n對應 04_ordered_difference.c，原始碼第 15～28 行。這是完整檔案第 2/3 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\nstatic long long linear(const int a[], int n) {\n    int min_before = a[0];\n    long long best = (long long)a[1] - a[0];\n    for (int j = 1; j \u003c n; ++j) {\n        long long d = (long long)a[j] - min_before;\n        if (d > best) best = d;\n        if (a[j] \u003c min_before) min_before = a[j];\n    }\n    return best;\n}\n\nint main(void) {\n    int a[CAP], n;\n    if (scanf(\"%d\", &n) != 1 || n \u003c 2 || n > CAP) {\n\n【課堂提問】\n為何要先算差值，再更新 min_before？\n\n【參考答案】\n計算時 min_before 只能來自更早的位置，才能保證 i\u003cj；先更新會把當前元素當成自己的前值。\n\n【來源與增補】\nA pp.59–60｜新增線性解法\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":28,"title":"案例 04｜完整程式 3/3","notes":"【本頁目標】\n案例 04｜完整程式 3/3\n04_ordered_difference.c\n\n【教師講解】\n本頁為 04_ordered_difference.c 的第 3/3 段，對應原始檔第 29～41 行。所有程式頁依序接續，沒有省略程式碼。主程式檢查 n>=2 與每筆範圍，再對相同輸入同時呼叫暴力版和線性版。相同答案是基本測試，但還要涵蓋全遞減、相等及邊界案例。\n\n【程式帶讀】\n對應 04_ordered_difference.c，原始碼第 29～41 行。這是完整檔案第 3/3 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n        fputs(\"Expected count 2..100\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    for (int i = 0; i \u003c n; ++i) {\n        if (scanf(\"%d\", &a[i]) != 1 ||\n            a[i] \u003c -10000 || a[i] > 10000) {\n            fputs(\"Invalid sample\\n\", stderr);\n            return EXIT_FAILURE;\n        }\n    }\n    printf(\"brute=%lld linear=%lld\\n\", brute(a, n), linear(a, n));\n    return EXIT_SUCCESS;\n}\n\n【課堂提問】\n為何要先算差值，再更新 min_before？\n\n【參考答案】\n計算時 min_before 只能來自更早的位置，才能保證 i\u003cj；先更新會把當前元素當成自己的前值。\n\n【來源與增補】\nA pp.59–60｜新增線性解法\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":29,"title":"案例 04｜測試與常見錯誤","notes":"【本頁目標】\n案例 04｜測試與常見錯誤\n先預測結果，再執行；不只測一般資料。\n\n【教師講解】\n依表格逐組測試，確認返回狀態、stdout、stderr 與檔案內容。不加順序限制的 max−min 是另一道題。best=0 會把全下降資料錯答成 0。 對隨機或平台相依輸出，應測試性質，而不是把單一次執行結果當成唯一答案。\n\n【測試判讀】\n一般｜10 15 90 200 110｜190｜200−10\n全下降｜9 7 3｜−2｜不能錯設 best=0\n相同值｜4 4 4｜0｜仍須兩個位置\n兩筆邊界｜−10000 10000｜20000｜先轉 long long 再相減\n資料不足｜n=1｜失敗｜不能讀 a[1]\n本頁列出教學代表測試。附件測試器另外包含一般值、邊界與錯誤路徑；未模擬磁碟滿載、斷電、併發或所有作業系統。\n\n【課堂提問】\n為何要先算差值，再更新 min_before？\n\n【參考答案】\n計算時 min_before 只能來自更早的位置，才能保證 i\u003cj；先更新會把當前元素當成自己的前值。\n\n【來源與增補】\nA pp.59–60｜新增線性解法\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":30,"title":"二維陣列｜表格視覺，row-major 儲存","notes":"【本頁目標】\n二維陣列｜表格視覺，row-major 儲存\na[r][c]：先選第 r 列，再選該列的第 c 欄。\n\n【教師講解】\n先用 3×4 表格定位一格，再把整個表格依列攤平成記憶體。C 的最右側索引變化最快；每一列有 COLS 個元素，所以 [r][c] 的元素偏移為 r*COLS+c。此為儲存布局說明，不鼓勵用越過子陣列邊界的指標操作來取代合法索引。\n\n【本頁收斂】\n二維索引必須寫 a[r][c]；a[r,c] 會使用逗號運算子。\n\n【課堂提問】\n3×4 陣列的 a[1][2] 距陣列開頭有幾個元素的位置？\n\n【參考答案】\n1×4+2=6；若圖解假設每個元素 4 bytes，位元組偏移是 24。\n\n【來源與增補】\nA pp.36–42\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":31,"title":"二維初始化與 const 查表","notes":"【本頁目標】\n二維初始化與 const 查表\n保留內層大括號，讓每列長度與用途都看得見。\n\n【教師講解】\n將不完整的內層初始列補零與整列省略補零分開示範。單位矩陣以 r==c 決定 1 或 0，也可用指定初始化只填對角線。const 陣列如十六進位或牌碼對照表，文件化不變資料並讓編譯器協助阻止意外修改。\n\n【本頁收斂】\n目標：3×3 單位矩陣；核心條件是 row == col，不是 row + col。\n\n【課堂提問】\nint m[2][3]={{1},{2,3}} 的第二列是什麼？\n\n【參考答案】\n2、3、0。內層初始列不足時，該列剩餘元素補零。\n\n【來源與增補】\nA pp.39–48\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":32,"title":"案例 05｜三台設備 × 四時段產量表","notes":"【本頁目標】\n案例 05｜三台設備 × 四時段產量表\n完整題目：先確認任務、輸入、輸出與限制\n\n【教師講解】\n先不要展示解答。請學生用自己的話重述任務，再指出輸入格式、輸出格式與無效資料的處理。用二維陣列保存三台設備在四個時段的產量，計算每台設備總產量、每時段總產量與全部總量。 固定 3 列 × 4 欄；每格 0～10000。列代表設備，欄代表時段；不可交換索引意義。\n\n【完整規格】\n任務：用二維陣列保存三台設備在四個時段的產量，計算每台設備總產量、每時段總產量與全部總量。\n輸入：依列輸入 12 個整數：先輸入設備 0 的四時段，再設備 1、設備 2。\n輸出：輸出 rows 三筆、cols 四筆，以及 total。\n限制：固定 3 列 × 4 欄；每格 0～10000。列代表設備，欄代表時段；不可交換索引意義。\n範例輸入：\n10 20 30 40\n5 15 25 35\n8 12 16 24\n範例輸出：\nrows=100 80 60\ncols=23 47 71 99\ntotal=240\n\n【課堂提問】\n為何 rows 和 cols 的陣列長度不同？\n\n【參考答案】\nrows 為每台設備保存一個結果，共 3 筆；cols 為每個時段保存一個結果，共 4 筆。\n\n【來源與增補】\nA pp.36–46｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 Input
