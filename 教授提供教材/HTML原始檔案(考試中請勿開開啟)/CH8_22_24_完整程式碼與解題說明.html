">fputs\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s\">&quot;Invalid integer input\u003c/span>\u003cspan class=\"se\">\\n\u003c/span>\u003cspan class=\"s\">&quot;\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">stderr\u003c/span>\u003cspan class=\"p\">);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"11\">\u003cspan class=\"lineno\" aria-hidden=\"true\">11\u003c/span>\u003cspan class=\"w\">            \u003c/span>\u003cspan class=\"k\">return\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">EXIT_FAILURE\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"12\">\u003cspan class=\"lineno\" aria-hidden=\"true\">12\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"13\">\u003cspan class=\"lineno\" aria-hidden=\"true\">13\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"14\">\u003cspan class=\"lineno\" aria-hidden=\"true\">14\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">for\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"kt\">int\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">N\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">&gt;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">--\u003c/span>\u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"15\">\u003cspan class=\"lineno\" aria-hidden=\"true\">15\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"n\">printf\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s\">&quot;%d%c&quot;\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">a\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">-\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">],\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">==\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">?\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"sc\">&#39;\\n&#39;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"sc\">&#39; &#39;\u003c/span>\u003cspan class=\"p\">);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"16\">\u003cspan class=\"lineno\" aria-hidden=\"true\">16\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">return\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">EXIT_SUCCESS\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"17\">\u003cspan class=\"lineno\" aria-hidden=\"true\">17\u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>","build":"gcc -std=c17 -Wall -Wextra -Wpedantic 01_reverse.c -o 01_reverse"}],"notes":[{"page":10,"title":"案例 01｜反向輸出 10 筆量測值","text":"【本頁目標】\n案例 01｜反向輸出 10 筆量測值\n完整題目：先確認任務、輸入、輸出與限制\n\n【教師講解】\n先不要展示解答。請學生用自己的話重述任務，再指出輸入格式、輸出格式與無效資料的處理。依序讀入 10 筆整數量測值，保留原本儲存順序，再由最後一筆往前輸出。不得把題目改成排序。 每筆介於 −10000～10000；缺項、非數字或超出範圍即失敗。入門數值文字約定見導讀頁。\n\n【完整規格】\n任務：依序讀入 10 筆整數量測值，保留原本儲存順序，再由最後一筆往前輸出。不得把題目改成排序。\n輸入：標準輸入：恰好 10 個整數，以空白或換行分隔。\n輸出：由第 10 筆到第 1 筆輸出；數字間一個空白，最後換行。\n限制：每筆介於 −10000～10000；缺項、非數字或超出範圍即失敗。入門數值文字約定見導讀頁。\n範例輸入：\n34 82 49 102 7 94 23 11 50 31\n範例輸出：\n31 50 11 23 94 7 102 49 82 34\n\n【課堂提問】\n為何輸出迴圈讀 a[i−1]，而不是 a[i]？\n\n【參考答案】\ni 由元素數量 10 開始；先減 1 才對應最後有效索引 9。i>0 也避免 unsigned 倒數下溢。\n\n【來源與增補】\nA pp.12–13\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":11,"title":"案例 01｜核心解法與圖解","text":"【本頁目標】\n案例 01｜核心解法與圖解\n反向輸出 10 筆量測值\n\n【教師講解】\n依下列順序帶讀圖解：1. 先以正向迴圈填入 a[0]～a[9]。 2. 第二個迴圈從 i=10 遞減，讀取 a[i−1]。 3. 只改變輸出順序，不交換陣列元素。 錯誤的起點 a[10] 已越界；最後有效索引是 9。此題不是就地反轉。\n\n【課堂提問】\n為何輸出迴圈讀 a[i−1]，而不是 a[i]？\n\n【參考答案】\ni 由元素數量 10 開始；先減 1 才對應最後有效索引 9。i>0 也避免 unsigned 倒數下溢。\n\n【來源與增補】\nA pp.12–13\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":12,"title":"案例 01｜完整程式 1/1","text":"【本頁目標】\n案例 01｜完整程式 1/1\n01_reverse.c\n\n【教師講解】\n本頁為 01_reverse.c 的第 1/1 段，對應原始檔第 1～17 行。所有程式頁依序接續，沒有省略程式碼。建立固定長度陣列，逐筆檢查 scanf 回傳值及範圍。讀入全部成功後才由 i=N 向下讀 a[i-1]；這只是反向輸出，沒有修改原陣列次序。\n\n【程式帶讀】\n對應 01_reverse.c，原始碼第 1～17 行。這是完整檔案第 1/1 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n#include \u003cstdio.h>\n#include \u003cstdlib.h>\n#define N 10\n\nint main(void) {\n    int a[N];\n    for (int i = 0; i \u003c N; ++i) {\n        if (scanf(\"%d\", &a[i]) != 1 ||\n            a[i] \u003c -10000 || a[i] > 10000) {\n            fputs(\"Invalid integer input\\n\", stderr);\n            return EXIT_FAILURE;\n        }\n    }\n    for (int i = N; i > 0; --i)\n        printf(\"%d%c\", a[i - 1], i == 1 ? '\\n' : ' ');\n    return EXIT_SUCCESS;\n}\n\n【課堂提問】\n為何輸出迴圈讀 a[i−1]，而不是 a[i]？\n\n【參考答案】\ni 由元素數量 10 開始；先減 1 才對應最後有效索引 9。i>0 也避免 unsigned 倒數下溢。\n\n【來源與增補】\nA pp.12–13\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":13,"title":"案例 01｜測試與常見錯誤","text":"【本頁目標】\n案例 01｜測試與常見錯誤\n先預測結果，再執行；不只測一般資料。\n\n【教師講解】\n依表格逐組測試，確認返回狀態、stdout、stderr 與檔案內容。錯誤的起點 a[10] 已越界；最後有效索引是 9。此題不是就地反轉。 對隨機或平台相依輸出，應測試性質，而不是把單一次執行結果當成唯一答案。\n\n【測試判讀】\n正常｜10 筆題目資料｜31 50 … 82 34｜確認前後次序\n邊界｜含負值與 0｜全部正確反向｜不是數值排序\n缺項｜1 2 後結束輸入｜失敗；stderr 訊息｜不可讀未初始化值\n格式錯誤｜1 2 x｜失敗；stderr 訊息｜檢查 scanf 回傳\n本頁列出教學代表測試。附件測試器另外包含一般值、邊界與錯誤路徑；未模擬磁碟滿載、斷電、併發或所有作業系統。\n\n【課堂提問】\n為何輸出迴圈讀 a[i−1]，而不是 a[i]？\n\n【參考答案】\ni 由元素數量 10 開始；先減 1 才對應最後有效索引 9。i>0 也避免 unsigned 倒數下溢。\n\n【來源與增補】\nA pp.12–13\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"}],"source_tests":["正常｜10 筆題目資料｜31 50 … 82 34｜確認前後次序","邊界｜含負值與 0｜全部正確反向｜不是數值排序","缺項｜1 2 後結束輸入｜失敗；stderr 訊息｜不可讀未初始化值","格式錯誤｜1 2 x｜失敗；stderr 訊息｜檢查 scanf 回傳"],"annotation":{"lines":[[6,12,"先讀入並驗證全部 10 筆","輸入尚未完整前不輸出反向結果；每次 scanf 都檢查成功賦值數及本題數值範圍。"],[14,15,"以 i > 0 保護 i−1","i 依序為 10 到 1，實際存取索引為 9 到 0；陣列本身沒有交換元素。"]],"boundary":"題目要求恰好 10 筆；這份入門程式只讀取前 10 筆，不會額外檢查尾端是否還有第 11 筆。互動保留此行為，不把它改稱為嚴格整行解析。"}},{"task":"讀入一個非負整數，從個位數往高位數檢查，找出第一個「再次出現」的數字；完全沒有重複則明確回報。","input":"標準輸入：一個十進位整數 n。","output":"輸出 Repeated digit: d；若無重複，輸出 No repeated digit。","limits":"0 ≤ n ≤ 2147483647。n=0 視為一個數字 0；不保留前導零，負數與錯誤輸入拒絕。","sample_in":"28212","sample_out":"Repeated digit: 2","id":"02","num":2,"title":"用布林陣列偵測重複數字","chapter":"8","tag":"原稿案例補強","pages":[14,18],"source":"A pp.23–25","logic":["seen[10] 初值全 false；索引就是數字 0～9。","digit=n%10 取得個位數，先檢查 seen[digit]。","未出現則設 true、n/=10；do…while 讓 0 也被處理一次。"],"pitfall":"不能先把 seen[digit] 設為 true 再判斷，否則每個數字都會被誤判為重複。","question":"為何 n=0 不使用 while(n>0) 就結束？","answer":"題目把 0 視為具有一位數的有效輸入；do…while 至少執行一次，與題意一致。","codes":[{"filename":"02_repeated_digits.c","pages":[16,17],"code":"#include \u003cstdbool.h>\n#include \u003cstdio.h>\n#include \u003cstdlib.h>\n \nint main(void) {\n    bool seen[10] = {false};\n    long n;\n    int repeated = -1;\n    if (scanf(\"%ld\", &n) != 1 ||\n        n \u003c 0 || n > 2147483647L) {\n        fputs(\"Expected 0..2147483647\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    do {\n        int digit = (int)(n % 10);\n        if (seen[digit]) {\n            repeated = digit;\n            break;\n        }\n        seen[digit] = true;\n        n /= 10;\n    } while (n > 0);\n    if (repeated >= 0)\n        printf(\"Repeated digit: %d\\n\", repeated);\n    else\n        puts(\"No repeated digit\");\n    return EXIT_SUCCESS;\n}\n","sha256":"9ec3aacca1a9fcd4330c79beef61c5b97bd0e8544ffaddc3fb2c450cba2e9780","lineCount":28,"html":"\u003cspan class=\"code-line\" data-line=\"1\">\u003cspan class=\"lineno\" aria-hidden=\"true\">1\u003c/span>\u003cspan class=\"cp\">#include\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"cpf\">&lt;stdbool.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"2\">\u003cspan class=\"lineno\" aria-hidden=\"true\">2\u003c/span>\u003cspan class=\"cp\">#include\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"cpf\">&lt;stdio.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"3\">\u003cspan class=\"lineno\" aria-hidden=\"true\">3\u003c/span>\u003cspan class=\"cp\">#include\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"cpf\">&lt;stdlib.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"4\">\u003cspan class=\"lineno\" aria-hidden=\"true\">4\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"5\">\u003cspan class=\"lineno\" aria-hidden=\"true\">5\u003c/span>\u003cspan class=\"kt\">int\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">main\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"kt\">void\u003c/span>\u003cspan class=\"p\">)\u003c/ 02_repeated_digits"}],"notes":[{"page":14,"title":"案例 02｜用布林陣列偵測重複數字","text":"【本頁目標】\n案例 02｜用布林陣列偵測重複數字\n完整題目：先確認任務、輸入、輸出與限制\n\n【教師講解】\n先不要展示解答。請學生用自己的話重述任務，再指出輸入格式、輸出格式與無效資料的處理。讀入一個非負整數，從個位數往高位數檢查，找出第一個「再次出現」的數字；完全沒有重複則明確回報。 0 ≤ n ≤ 2147483647。n=0 視為一個數字 0；不保留前導零，負數與錯誤輸入拒絕。\n\n【完整規格】\n任務：讀入一個非負整數，從個位數往高位數檢查，找出第一個「再次出現」的數字；完全沒有重複則明確回報。\n輸入：標準輸入：一個十進位整數 n。\n輸出：輸出 Repeated digit: d；若無重複，輸出 No repeated digit。\n限制：0 ≤ n ≤ 2147483647。n=0 視為一個數字 0；不保留前導零，負數與錯誤輸入拒絕。\n範例輸入：\n28212\n範例輸出：\nRepeated digit: 2\n\n【課堂提問】\n為何 n=0 不使用 while(n>0) 就結束？\n\n【參考答案】\n題目把 0 視為具有一位數的有效輸入；do…while 至少執行一次，與題意一致。\n\n【來源與增補】\nA pp.23–25\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":15,"title":"案例 02｜核心解法與圖解","text":"【本頁目標】\n案例 02｜核心解法與圖解\n用布林陣列偵測重複數字\n\n【教師講解】\n依下列順序帶讀圖解：1. seen[10] 初值全 false；索引就是數字 0～9。 2. digit=n%10 取得個位數，先檢查 seen[digit]。 3. 未出現則設 true、n/=10；do…while 讓 0 也被處理一次。 不能先把 seen[digit] 設為 true 再判斷，否則每個數字都會被誤判為重複。\n\n【課堂提問】\n為何 n=0 不使用 while(n>0) 就結束？\n\n【參考答案】\n題目把 0 視為具有一位數的有效輸入；do…while 至少執行一次，與題意一致。\n\n【來源與增補】\nA pp.23–25\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":16,"title":"案例 02｜完整程式 1/2","text":"【本頁目標】\n案例 02｜完整程式 1/2\n02_repeated_digits.c\n\n【教師講解】\n本頁為 02_repeated_digits.c 的第 1/2 段，對應原始檔第 1～14 行。所有程式頁依序接續，沒有省略程式碼。建立長度 10 的 seen 表並全設 false。先驗證非負整數範圍，準備以十進位數字當成狀態表索引。\n\n【程式帶讀】\n對應 02_repeated_digits.c，原始碼第 1～14 行。這是完整檔案第 1/2 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n#include \u003cstdbool.h>\n#include \u003cstdio.h>\n#include \u003cstdlib.h>\n\nint main(void) {\n    bool seen[10] = {false};\n    long n;\n    int repeated = -1;\n    if (scanf(\"%ld\", &n) != 1 ||\n        n \u003c 0 || n > 2147483647L) {\n        fputs(\"Expected 0..2147483647\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    do {\n\n【課堂提問】\n為何 n=0 不使用 while(n>0) 就結束？\n\n【參考答案】\n題目把 0 視為具有一位數的有效輸入；do…while 至少執行一次，與題意一致。\n\n【來源與增補】\nA pp.23–25\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":17,"title":"案例 02｜完整程式 2/2","text":"【本頁目標】\n案例 02｜完整程式 2/2\n02_repeated_digits.c\n\n【教師講解】\n本頁為 02_repeated_digits.c 的第 2/2 段，對應原始檔第 15～28 行。所有程式頁依序接續，沒有省略程式碼。用 do-while 讓 0 也能被處理。每次以 %10 取數字，先查表再標记；再次遇見 true 即可回報重複，最後用 /=10 移除末位。\n\n【程式帶讀】\n對應 02_repeated_digits.c，原始碼第 15～28 行。這是完整檔案第 2/2 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n        int digit = (int)(n % 10);\n        if (seen[digit]) {\n            repeated = digit;\n            break;\n        }\n        seen[digit] = true;\n        n /= 10;\n    } while (n > 0);\n    if (repeated >= 0)\n        printf(\"Repeated digit: %d\\n\", repeated);\n    else\n        puts(\"No repeated digit\");\n    return EXIT_SUCCESS;\n}\n\n【課堂提問】\n為何 n=0 不使用 while(n>0) 就結束？\n\n【參考答案】\n題目把 0 視為具有一位數的有效輸入；do…while 至少執行一次，與題意一致。\n\n【來源與增補】\nA pp.23–25\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":18,"title":"案例 02｜測試與常見錯誤","text":"【本頁目標】\n案例 02｜測試與常見錯誤\n先預測結果，再執行；不只測一般資料。\n\n【教師講解】\n依表格逐組測試，確認返回狀態、stdout、stderr 與檔案內容。不能先把 seen[digit] 設為 true 再判斷，否則每個數字都會被誤判為重複。 對隨機或平台相依輸出，應測試性質，而不是把單一次執行結果當成唯一答案。\n\n【測試判讀】\n有重複｜28212｜Repeated digit: 2｜第 3 次取出的 2 已看過\n無重複｜9357｜No repeated digit｜各索引只設一次\n零｜0｜No repeated digit｜仍應處理一次\n零重複｜100｜Repeated digit: 0｜兩個 0 需要被辨認\n不合法｜−1｜失敗｜不可讓 digit 成負索引\n本頁列出教學代表測試。附件測試器另外包含一般值、邊界與錯誤路徑；未模擬磁碟滿載、斷電、併發或所有作業系統。\n\n【課堂提問】\n為何 n=0 不使用 while(n>0) 就結束？\n\n【參考答案】\n題目把 0 視為具有一位數的有效輸入；do…while 至少執行一次，與題意一致。\n\n【來源與增補】\nA pp.23–25\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"}],"source_tests":["有重複｜28212｜Repeated digit: 2｜第 3 次取出的 2 已看過","無重複｜9357｜No repeated digit｜各索引只設一次","零｜0｜No repeated digit｜仍應處理一次","零重複｜100｜Repeated digit: 0｜兩個 0 需要被辨認","不合法｜−1｜失敗｜不可讓 digit 成負索引"],"annotation":{"lines":[[6,8,"資料值直接當作索引","seen[digit] 表示數字 digit 是否已經出現；repeated=-1 代表尚未找到重複。"],[14,22,"先檢查，再標記","do…while 讓輸入 0 也檢查一次；由右至左第一次碰到已標記位置便停止。"],[23,26,"輸出明確的兩種結果","找到重複時輸出數字，否則輸出 No repeated digit；前導零不屬於整數值的一部分。"]],"boundary":"互動陣列中的 T/F 是布林狀態的顯示方式，不是對 C bool 物件位元組表示的宣稱。"}},{"task":"讀入全班成績，計算總分、平均、最高分、最低分、及格人數，並統計五個成績區間。","input":"先輸入人數 n，再輸入 n 個整數成績。","output":"輸出 count、sum、min、max、average（小數 2 位）、pass 與五個 bins。","limits":"1 ≤ n ≤ 100；0 ≤ 成績 ≤ 100；及格為 ≥60。分組：0–59、60–69、70–79、80–89、90–100。","sample_in":"5\n59 60 75 90 100","sample_out":"count=5 sum=384 min=59 max=100\naverage=76.80 pass=4\nbins=1 1 1 0 2","id":"03","num":3,"title":"班級成績統計與分布","chapter":"8","tag":"新增案例","pages":[19,23],"source":"A pp.8,26–30｜新增","logic":["先驗證人數與每筆成績，再開始統計。","以第一筆初始化 min/max；用同一趟掃描累加。","100 分併入最後一組；平均前轉為 double。"],"pitfall":"sum/n 若先做整數除法再指定給 double，小數已經遺失；需用 (double)sum/n。","question":"為何 bins[score/10] 不能直接用在長度 10 的陣列？","answer":"100/10=10，會存取第 11 格而越界。本題採明確的五區間映射，把 90～100 合併。","codes":[{"filename":"03_score_stats.c","pages":[21,22],"code":"#include \u003cstdio.h>\n#include \u003cstdlib.h>\n#define CAP 100\n \nint main(void) {\n    int score[CAP], bins[5] = {0};\n    int n, sum = 0, pass = 0;\n    if (scanf(\"%d\", &n) != 1 || n \u003c 1 || n > CAP) {\n        fputs(\"Expected count 1..100\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    for (int i = 0; i \u003c n; ++i) {\n        if (scanf(\"%d\", &score[i]) != 1 ||\n            score[i] \u003c 0 || score[i] > 100) {\n            fputs(\"Invalid score\\n\", stderr);\n            return EXIT_FAILURE;\n        }\n    }\n    int low = score[0], high = score[0];\n    for (int i = 0; i \u003c n; ++i) {\n        int s = score[i];\n        sum += s;\n        if (s \u003c low) low = s;\n        if (s > high) high = s;\n        if (s >= 60) ++pass;\n        int b = s \u003c 60 =\"w\"> \u003c/span>\u003cspan class=\"n\">high\u003c/span>\u003cspan class=\"p\">);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"31\">\u003cspan class=\"lineno\" aria-hidden=\"true\">31\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"n\">printf\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s\">&quot;average=%.2f pass=%d\u003c/span>\u003cspan class=\"se\">\\n\u003c/span>\u003cspan class=\"s\">&quot;\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"kt\">double\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"n\">sum\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">/\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">n\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">pass\u003c/span>\u003cspan class=\"p\">);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"32\">\u003cspan class=\"lineno\" aria-hidden=\"true\">32\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"n\">printf\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s\">&quot;bins=%d %d %d %d %d\u003c/span>\u003cspan class=\"se\">\\n\u003c/span>\u003cspan class=\"s\">&quot;\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"33\">\u003cspan class=\"lineno\" aria-hidden=\"true\">33\u003c/span>\u003cspan class=\"w\">           \u003c/span>\u003cspan class=\"n\">bins\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">],\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">bins\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">],\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">bins\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">2\u003c/span>\u003cspan class=\"p\">],\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">bins\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">3\u003c/span>\u003cspan class=\"p\">],\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">bins\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">4\u003c/span>\u003cspan class=\"p\">]);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"34\">\u003cspan class=\"lineno\" aria-hidden=\"true\">34\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">return\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">EXIT_SUCCESS\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"35\">\u003cspan class=\"lineno\" aria-hidden=\"true\">35\u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>","build":"gcc -std=c17 -Wall -Wextra -Wpedantic 03_score_stats.c -o 03_score_stats"}],"notes":[{"page":19,"title":"案例 03｜班級成績統計與分布","text":"【本頁目標】\n案例 03｜班級成績統計與分布\n完整題目：先確認任務、輸入、輸出與限制\n\n【教師講解】\n先不要展示解答。請學生用自己的話重述任務，再指出輸入格式、輸出格式與無效資料的處理。讀入全班成績，計算總分、平均、最高分、最低分、及格人數，並統計五個成績區間。 1 ≤ n ≤ 100；0 ≤ 成績 ≤ 100；及格為 ≥60。分組：0–59、60–69、70–79、80–89、90–100。\n\n【完整規格】\n任務：讀入全班成績，計算總分、平均、最高分、最低分、及格人數，並統計五個成績區間。\n輸入：先輸入人數 n，再輸入 n 個整數成績。\n輸出：輸出 count、sum、min、max、average（小數 2 位）、pass 與五個 bins。\n限制：1 ≤ n ≤ 100；0 ≤ 成績 ≤ 100；及格為 ≥60。分組：0–59、60–69、70–79、80–89、90–100。\n範例輸入：\n5\n59 60 75 90 100\n範例輸出：\ncount=5 sum=384 min=59 max=100\naverage=76.80 pass=4\nbins=1 1 1 0 2\n\n【課堂提問】\n為何 bins[score/10] 不能直接用在長度 10 的陣列？\n\n【參考答案】\n100/10=10，會存取第 11 格而越界。本題採明確的五區間映射，把 90～100 合併。\n\n【來源與增補】\nA pp.8,26–30｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":20,"title":"案例 03｜核心解法與圖解","text":"【本頁目標】\n案例 03｜核心解法與圖解\n班級成績統計與分布\n\n【教師講解】\n依下列順序帶讀圖解：1. 先驗證人數與每筆成績，再開始統計。 2. 以第一筆初始化 min/max；用同一趟掃描累加。 3. 100 分併入最後一組；平均前轉為 double。 sum/n 若先做整數除法再指定給 double，小數已經遺失；需用 (double)sum/n。\n\n【課堂提問】\n為何 bins[score/10] 不能直接用在長度 10 的陣列？\n\n【參考答案】\n100/10=10，會存取第 11 格而越界。本題採明確的五區間映射，把 90～100 合併。\n\n【來源與增補】\nA pp.8,26–30｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":21,"title":"案例 03｜完整程式 1/2","text":"【本頁目標】\n案例 03｜完整程式 1/2\n03_score_stats.c\n\n【教師講解】\n本頁為 03_score_stats.c 的第 1/2 段，對應原始檔第 1～18 行。所有程式頁依序接續，沒有省略程式碼。配置固定容量 100 的資料陣列與五格 bins。先確認有效筆數與每筆 0～100 分的範圍；失敗時不讓未完成資料進入統計。\n\n【程式帶讀】\n對應 03_score_stats.c，原始碼第 1～18 行。這是完整檔案第 1/2 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n#include \u003cstdio.h>\n#include \u003cstdlib.h>\n#define CAP 100\n\nint main(void) {\n    int score[CAP], bins[5] = {0};\n    int n, sum = 0, pass = 0;\n    if (scanf(\"%d\", &n) != 1 || n \u003c 1 || n > CAP) {\n        fputs(\"Expected count 1..100\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    for (int i = 0; i \u003c n; ++i) {\n        if (scanf(\"%d\", &score[i]) != 1 ||\n            score[i] \u003c 0 || score[i] > 100) {\n            fputs(\"Invalid score\\n\", stderr);\n            return EXIT_FAILURE;\n        }\n    }\n\n【課堂提問】\n為何 bins[score/10] 不能直接用在長度 10 的陣列？\n\n【參考答案】\n100/10=10，會存取第 11 格而越界。本題採明確的五區間映射，把 90～100 合併。\n\n【來源與增補】\nA pp.8,26–30｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":22,"title":"案例 03｜完整程式 2/2","text":"【本頁目標】\n案例 03｜完整程式 2/2\n03_score_stats.c\n\n【教師講解】\n本頁為 03_score_stats.c 的第 2/2 段，對應原始檔第 19～35 行。所有程式頁依序接續，沒有省略程式碼。從第一筆設定最小值與最大值，走訪 n 筆更新總分、及格數與區間。90～100 共用最後一格，避免把 100 分當成索引 5。平均值先轉 double，輸出保留兩位小數。\n\n【程式帶讀】\n對應 03_score_stats.c，原始碼第 19～35 行。這是完整檔案第 2/2 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n    int low = score[0], high = score[0];\n    for (int i = 0; i \u003c n; ++i) {\n        int s = score[i];\n        sum += s;\n        if (s \u003c low) low = s;\n        if (s > high) high = s;\n        if (s >= 60) ++pass;\n        int b = s \u003c 60 ? 0 : (s >= 90 ? 4 : s / 10 - 5);\n        ++bins[b];\n    }\n    printf(\"count=%d sum=%d min=%d max=%d\\n\",\n           n, sum, low, high);\n    printf(\"average=%.2f pass=%d\\n\", (double)sum / n, pass);\n    printf(\"bins=%d %d %d %d %d\\n\",\n           bins[0], bins[1], bins[2], bins[3], bins[4]);\n    return EXIT_SUCCESS;\n}\n\n【課堂提問】\n為何 bins[score/10] 不能直接用在長度 10 的陣列？\n\n【參考答案】\n100/10=10，會存取第 11 格而越界。本題採明確的五區間映射，把 90～100 合併。\n\n【來源與增補】\nA pp.8,26–30｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":23,"title":"案例 03｜測試與常見錯誤","text":"【本頁目標】\n案例 03｜測試與常見錯誤\n先預測結果，再執行；不只測一般資料。\n\n【教師講解】\n依表格逐組測試，確認返回狀態、stdout、stderr 與檔案內容。sum/n 若先做整數除法再指定給 double，小數已經遺失；需用 (double)sum/n。 對隨機或平台相依輸出，應測試性質，而不是把單一次執行結果當成唯一答案。\n\n【測試判讀】\n一般｜59 60 75 90 100｜平均 76.80；及格 4｜驗證各組與平均\n單筆｜n=1，score=100｜min=max=100｜初始化不可假設 0\n分界｜0,59,60,69,70,89,100｜bins=2 2 1 1 1｜確認閉區間\n容量｜n=0 或 101｜失敗｜先驗證才寫陣列\n範圍｜score=101｜失敗｜不能當成新分組\n本頁列出教學代表測試。附件測試器另外包含一般值、邊界與錯誤路徑；未模擬磁碟滿載、斷電、併發或所有作業系統。\n\n【課堂提問】\n為何 bins[score/10] 不能直接用在長度 10 的陣列？\n\n【參考答案】\n100/10=10，會存取第 11 格而越界。本題採明確的五區間映射，把 90～100 合併。\n\n【來源與增補】\nA pp.8,26–30｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"}],"source_tests":["一般｜59 60 75 90 100｜平均 76.80；及格 4｜驗證各組與平均","單筆｜n=1，score=100｜min=max=100｜初始化不可假設 0","分界｜0,59,60,69,70,89,100｜bins=2 2 1 1 1｜確認閉區間","容量｜n=0 或 101｜失敗｜先驗證才寫陣列","範圍｜score=101｜失敗｜不能當成新分組"],"annotation":{"lines":[[10,18,"驗證後才進行統計","先檢查人數及全部成績，避免資料讀到一半便使用未初始化元素。"],[19,27,"一次掃描維護多個統計值","用第一筆初始化上下界；分組判斷讓 100 分仍落在 bins[4]，不會存取 bins[5]。"],[28,34,"平均不是整數除法","sum 轉成 double 後再除以 n；輸出固定兩位小數，分布順序與題目一致。"]],"boundary":"互動直條圖與逐步累加是本次 HTML 的教學呈現；五個區間及計算規則沿用投影片與完整 C 程式。"}},{"task":"量測陣列中的位置代表時間。找出 max(a[j]−a[i])，且必須滿足 i\u003cj；比較雙迴圈與單次掃描兩種解法。","input":"先輸入 n，再輸入 n 個整數量測值。","output":"同一行輸出 brute 與 linear 的結果，兩者必須相同。","limits":"2 ≤ n ≤ 100；數值介於 −10000～10000。必須選兩個不同時刻；全程下降時答案可能為負。","sample_in":"5\n10 15 90 200 110","sample_out":"brute=190 linear=190","id":"04","num":4,"title":"有先後順序的最大增幅","chapter":"8","tag":"原稿案例補強","pages":[24,29],"source":"A pp.59–60｜新增線性解法","logic":["暴力法枚舉所有 i\u003cj，時間 O(n²)。","線性法在處理 j 前，保存 a[0..j−1] 的最小值。","先用當前值計算增幅，再更新最小值；時間 O(n)、額外空間 O(1)。"],"pitfall":"不加順序限制的 max−min 是另一道題。best=0 會把全下降資料錯答成 0。","question":"為何要先算差值，再更新 min_before？","answer":"計算時 min_before 只能來自更早的位置，才能保證 i\u003cj；先更新會把當前元素當成自己的前值。","codes":[{"filename":"04_ordered_difference.c","pages":[26,27,28],"code":"#include \u003cstdio.h>\n#include \u003cstdlib.h>\n#define CAP 100\n \nstatic long long brute(const int a[], int n) {\n    long long best = (long long)a[1] - a[0];\n    for (int i = 0; i \u003c n - 1; ++i)\n        for (int j = i + 1; j \u003c n; ++j) {\n            long long d = (long long)a[j] - a[i];\n            if (d > best) best = d;\n        }\n    return best;\n}\n \nstatic long long linear(const int a[], int n) {\n    int min_before = a[0];\n    long long best = (long long)a[1] - a[0];\n    for (int j = 1; j \u003c n; ++j) {\n        long long d = (long long)a[j] - min_before;\n        if (d > best) best = d;\n        if (a[j] \u003c min_before) min_before = a[j];\n    }\n    return best;\n}\n \nint main(void) {\n    int a[CAP], n;\n    if (scanf(\"%d\", &n) != 1 || n \u003c 2 || n > CAP) {\n        fputs(\"Expected count 2..100\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    for (int i = 0; i \u003c n; ++i) {\n        if (scanf(\"%d\", &a[i]) != 1 ||\n            a[i] \u003c -10000 || a[i] > 10000) {\n            fputs(\"Invalid sample\\n\", stderr);\n            return EXIT_FAILURE;\n        }\n    }\n    printf(\"brute=%lld linear=%lld\\n\", brute(a, n), linear(a, n));\n    return EXIT_SUCCESS;\n}\n","sha256":"30cd708cb8b0d586cd4f79b7f57ad742dd46f2d1d9f3171d5901a63cfc9b07bb","lineCount":41,"html":"\u003cspan class=\"code-line\" data-line=\"1\">\u003cspan class=\"lineno\" aria-hidden=\"true\">1\u003c/span>\u003cspan class=\"cp\">#include\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"cpf\">&lt;stdio.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"2\">\u003cspan class=\"lineno\" aria-hidden=\"true\">2\u003c/span>\u003cspan class=\"cp\">#include\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"cpf\">&lt;stdlib.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"3\">\u003cspan class=\"lineno\" aria-hidden=\"true\">3\u003c/span>\u003cspan class=\"cp\">#define CAP 100\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"4\">\u003cspan class=\"lineno\" aria-hidden=\"true\">4\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"5\">\u003cspan class=\"lineno\" aria-hidden=\"true\">5\u003c/span>\u003cspan class=\"k\">static\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"kt\">long\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"kt\">long\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">brute\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"k\">const\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"kt\">int\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">a\u003c/span>\u003cspan class=\"p\">[],\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"kt\">int\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">n\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">{\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"6\">\u003cspan class=\"lineno\" aria-hidden=\"true\">6\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"kt\">long\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"kt\">long\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">best\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"kt\">long\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"kt\">long\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"n\">a\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">]\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">-\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">a\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">];\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"7\">\u003cspan class=\"lineno\" aria-hidden=\"true\">7\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">for\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"kt\">int\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">&lt;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">n\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">-\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">++\u003c/span>\u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"p\">)\u00 ">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"37\">\u003cspan class=\"lineno\" aria-hidden=\"true\">37\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"38\">\u003cspan class=\"lineno\" aria-hidden=\"true\">38\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"39\">\u003cspan class=\"lineno\" aria-hidden=\"true\">39\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"n\">printf\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s\">&quot;brute=%lld linear=%lld\u003c/span>\u003cspan class=\"se\">\\n\u003c/span>\u003cspan class=\"s\">&quot;\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">brute\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">a\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">n\u003c/span>\u003cspan class=\"p\">),\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">linear\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">a\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">n\u003c/span>\u003cspan class=\"p\">));\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"40\">\u003cspan class=\"lineno\" aria-hidden=\"true\">40\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">return\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">EXIT_SUCCESS\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"41\">\u003cspan class=\"lineno\" aria-hidden=\"true\">41\u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>","build":"gcc -std=c17 -Wall -Wextra -Wpedantic 04_ordered_difference.c -o 04_ordered_difference"}],"notes":[{"page":24,"title":"案例 04｜有先後順序的最大增幅","text":"【本頁目標】\n案例 04｜有先後順序的最大增幅\n完整題目：先確認任務、輸入、輸出與限制\n\n【教師講解】\n先不要展示解答。請學生用自己的話重述任務，再指出輸入格式、輸出格式與無效資料的處理。量測陣列中的位置代表時間。找出 max(a[j]−a[i])，且必須滿足 i\u003cj；比較雙迴圈與單次掃描兩種解法。 2 ≤ n ≤ 100；數值介於 −10000～10000。必須選兩個不同時刻；全程下降時答案可能為負。\n\n【完整規格】\n任務：量測陣列中的位置代表時間。找出 max(a[j]−a[i])，且必須滿足 i\u003cj；比較雙迴圈與單次掃描兩種解法。\n輸入：先輸入 n，再輸入 n 個整數量測值。\n輸出：同一行輸出 brute 與 linear 的結果，兩者必須相同。\n限制：2 ≤ n ≤ 100；數值介於 −10000～10000。必須選兩個不同時刻；全程下降時答案可能為負。\n範例輸入：\n5\n10 15 90 200 110\n範例輸出：\nbrute=190 linear=190\n\n【課堂提問】\n為何要先算差值，再更新 min_before？\n\n【參考答案】\n計算時 min_before 只能來自更早的位置，才能保證 i\u003cj；先更新會把當前元素當成自己的前值。\n\n【來源與增補】\nA pp.59–60｜新增線性解法\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":25,"title":"案例 04｜核心解法與圖解","text":"【本頁目標】\n案例 04｜核心解法與圖解\n有先後順序的最大增幅\n\n【教師講解】\n依下列順序帶讀圖解：1. 暴力法枚舉所有 i\u003cj，時間 O(n²)。 2. 線性法在處理 j 前，保存 a[0..j−1] 的最小值。 3. 先用當前值計算增幅，再更新最小值；時間 O(n)、額外空間 O(1)。 不加順序限制的 max−min 是另一道題。best=0 會把全下降資料錯答成 0。\n\n【課堂提問】\n為何要先算差值，再更新 min_before？\n\n【參考答案】\n計算時 min_before 只能來自更早的位置，才能保證 i\u003cj；先更新會把當前元素當成自己的前值。\n\n【來源與增補】\nA pp.59–60｜新增線性解法\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":26,"title":"案例 04｜完整程式 1/3","text":"【本頁目標】\n案例 04｜完整程式 1/3\n04_ordered_difference.c\n\n【教師講解】\n本頁為 04_ordered_difference.c 的第 1/3 段，對應原始檔第 1～14 行。所有程式頁依序接續，沒有省略程式碼。暴力版只枚舉 j>i 的配對。以第一組合法配對初始化 best，而不是以 0 初始化；全部遞減時答案仍可能為負。\n\n【程式帶讀】\n對應 04_ordered_difference.c，原始碼第 1～14 行。這是完整檔案第 1/3 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n#include \u003cstdio.h>\n#include \u003cstdlib.h>\n#define CAP 100\n\nstatic long long brute(const int a[], int n) {\n    long long best = (long long)a[1] - a[0];\n    for (int i = 0; i \u003c n - 1; ++i)\n        for (int j = i + 1; j \u003c n; ++j) {\n            long long d = (long long)a[j] - a[i];\n            if (d > best) best = d;\n        }\n    return best;\n}\n\n\n【課堂提問】\n為何要先算差值，再更新 min_before？\n\n【參考答案】\n計算時 min_before 只能來自更早的位置，才能保證 i\u003cj；先更新會把當前元素當成自己的前值。\n\n【來源與增補】\nA pp.59–60｜新增線性解法\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":27,"title":"案例 04｜完整程式 2/3","text":"【本頁目標】\n案例 04｜完整程式 2/3\n04_ordered_difference.c\n\n【教師講解】\n本頁為 04_ordered_difference.c 的第 2/3 段，對應原始檔第 15～28 行。所有程式頁依序接續，沒有省略程式碼。線性版維持處理位置之前的最小值。先計算目前元素可形成的差，再更新前綴最小值。long long 的轉型在相減之前完成。\n\n【程式帶讀】\n對應 04_ordered_difference.c，原始碼第 15～28 行。這是完整檔案第 2/3 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\nstatic long long linear(const int a[], int n) {\n    int min_before = a[0];\n    long long best = (long long)a[1] - a[0];\n    for (int j = 1; j \u003c n; ++j) {\n        long long d = (long long)a[j] - min_before;\n        if (d > best) best = d;\n        if (a[j] \u003c min_before) min_before = a[j];\n    }\n    return best;\n}\n\nint main(void) {\n    int a[CAP], n;\n    if (scanf(\"%d\", &n) != 1 || n \u003c 2 || n > CAP) {\n\n【課堂提問】\n為何要先算差值，再更新 min_before？\n\n【參考答案】\n計算時 min_before 只能來自更早的位置，才能保證 i\u003cj；先更新會把當前元素當成自己的前值。\n\n【來源與增補】\nA pp.59–60｜新增線性解法\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":28,"title":"案例 04｜完整程式 3/3","text":"【本頁目標】\n案例 04｜完整程式 3/3\n04_ordered_difference.c\n\n【教師講解】\n本頁為 04_ordered_difference.c 的第 3/3 段，對應原始檔第 29～41 行。所有程式頁依序接續，沒有省略程式碼。主程式檢查 n>=2 與每筆範圍，再對相同輸入同時呼叫暴力版和線性版。相同答案是基本測試，但還要涵蓋全遞減、相等及邊界案例。\n\n【程式帶讀】\n對應 04_ordered_difference.c，原始碼第 29～41 行。這是完整檔案第 3/3 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n        fputs(\"Expected count 2..100\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    for (int i = 0; i \u003c n; ++i) {\n        if (scanf(\"%d\", &a[i]) != 1 ||\n            a[i] \u003c -10000 || a[i] > 10000) {\n            fputs(\"Invalid sample\\n\", stderr);\n            return EXIT_FAILURE;\n        }\n    }\n    printf(\"brute=%lld linear=%lld\\n\", brute(a, n), linear(a, n));\n    return EXIT_SUCCESS;\n}\n\n【課堂提問】\n為何要先算差值，再更新 min_before？\n\n【參考答案】\n計算時 min_before 只能來自更早的位置，才能保證 i\u003cj；先更新會把當前元素當成自己的前值。\n\n【來源與增補】\nA pp.59–60｜新增線性解法\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":29,"title":"案例 04｜測試與常見錯誤","text":"【本頁目標】\n案例 04｜測試與常見錯誤\n先預測結果，再執行；不只測一般資料。\n\n【教師講解】\n依表格逐組測試，確認返回狀態、stdout、stderr 與檔案內容。不加順序限制的 max−min 是另一道題。best=0 會把全下降資料錯答成 0。 對隨機或平台相依輸出，應測試性質，而不是把單一次執行結果當成唯一答案。\n\n【測試判讀】\n一般｜10 15 90 200 110｜190｜200−10\n全下降｜9 7 3｜−2｜不能錯設 best=0\n相同值｜4 4 4｜0｜仍須兩個位置\n兩筆邊界｜−10000 10000｜20000｜先轉 long long 再相減\n資料不足｜n=1｜失敗｜不能讀 a[1]\n本頁列出教學代表測試。附件測試器另外包含一般值、邊界與錯誤路徑；未模擬磁碟滿載、斷電、併發或所有作業系統。\n\n【課堂提問】\n為何要先算差值，再更新 min_before？\n\n【參考答案】\n計算時 min_before 只能來自更早的位置，才能保證 i\u003cj；先更新會把當前元素當成自己的前值。\n\n【來源與增補】\nA pp.59–60｜新增線性解法\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"}],"source_tests":["一般｜10 15 90 200 110｜190｜200−10","全下降｜9 7 3｜−2｜不能錯設 best=0","相同值｜4 4 4｜0｜仍須兩個位置","兩筆邊界｜−10000 10000｜20000｜先轉 long long 再相減","資料不足｜n=1｜失敗｜不能讀 a[1]"],"annotation":{"lines":[[5,13,"暴力解法作為對照","枚舉所有 i\u003cj；初值使用 a[1]−a[0]，保留全下降資料的負答案。"],[15,24,"先比較差值，再更新最小值","處理 j 時 min_before 只包含較早位置；若先把 a[j] 放進最小值，便可能把同一時刻配對而錯得 0。"],[38,40,"同一輸入交給兩種解法","輸出 brute 與 linear 便於交叉驗證；不以無序的全域最大值減最小值取代題目。"]],"boundary":"互動主要逐步呈現線性解法，最後另以暴力枚舉核對；完整 C 原始碼仍保留兩個函式。"}},{"task":"用二維陣列保存三台設備在四個時段的產量，計算每台設備總產量、每時段總產量與全部總量。","input":"依列輸入 12 個整數：先輸入設備 0 的四時段，再設備 1、設備 2。","output":"輸出 rows 三筆、cols 四筆，以及 total。","limits":"固定 3 列 × 4 欄；每格 0～10000。列代表設備，欄代表時段；不可交換索引意義。","sample_in":"10 20 30 40\n5 15 25 35\n8 12 16 24","sample_out":"rows=100 80 60\ncols=23 47 71 99\ntotal=240","id":"05","num":5,"title":"三台設備 × 四時段產量表","chapter":"8","tag":"新增案例","pages":[32,36],"source":"A pp.36–46｜新增","logic":["以 qty[r][c] 同時表達設備與時段。","外層走設備 r，內層走時段 c。","每讀取一格，加入 rows[r]、cols[c] 與 total。"],"pitfall":"qty[r,c] 使用的是逗號運算子，不是二維索引；正確寫法必須是 qty[r][c]。","question":"為何 rows 和 cols 的陣列長度不同？","answer":"rows 為每台設備保存一個結果，共 3 筆；cols 為每個時段保存一個結果，共 4 筆。","codes":[{"filename":"05_matrix_report.c","pages":[34,35],"code":"#include \u003cstdio.h>\n#include \u003cstdlib.h>\n#define ROWS 3\n#define COLS 4\n \nint main(void) {\n    int qty[ROWS][COLS];\n    long rows[ROWS] = {0}, cols[COLS] = {0}, total = 0;\n    for (int r = 0; r \u003c ROWS; ++r)\n        for (int c = 0; c \u003c COLS; ++c) {\n            if (scanf(\"%d\", &qty[r][c]) != 1 ||\n                qty[r][c] \u003c 0 || qty[r][c] > 10000) {\n                fputs(\"Invalid quantity\\n\", stderr);\n                return EXIT_FAILURE;\n            }\n        }\n    for (int r = 0; r \u003c ROWS; ++r)\n        for (int c = 0; c \u003c COLS; ++c) {\n            rows[r] += qty[r][c];\n            cols[c] += qty[r][c];\n            total += qty[r][c];\n        }\n    printf(\"rows=%ld %ld %ld\\n\", rows[0], rows[1], rows[2]);\n    printf(\"cols=%ld %ld %ld %ld\\n\",\n           cols[0], cols[1], cols[2], cols[3]);\n    printf(\"total=%ld\\n\", total);\n    return EXIT_SUCCESS;\n}\n","sha256":"d7963b11a8f8c6e2ac8495d40f5d42d29eb0a716b49260a01988ec9f2d985252","lineCount":28,"html":"\u003cspan class=\"code-line\" data-line=\"1\">\u003cspan class=\"lineno\" aria-hidden=\"true\">1\u003c/span>\u003cspan class=\"cp\">#include\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"cpf\">&lt;stdio.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"2\">\u003cspan class=\"lineno\" aria-hidden=\"true\">2\u003c/span>\u003cspan class=\"cp\">#include\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"cpf\">&lt;stdlib.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"3\">\u003cspan class=\"lineno\" aria-hidden=\"true\">3\u003c/span>\u003cspan class=\"cp\">#define ROWS 3\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"4\">\u003cspan class=\"lineno\" aria-hidden=\"true\">4\u003c/span>\u003cspan class=\"cp\">#define COLS 4\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"5\">\u003cspan class=\"lineno\" aria-hidden=\"true\">5\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"6\">\u003cspan class=\"lineno\" aria-hidden=\"true\">6\u003c/span>\u003cspan class=\"kt\">int\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">main\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"kt\">void\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">{\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"7\">\u003cspan class=\"lineno\" aria-hidden=\"true\">7\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"kt\">int\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">qty\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">ROWS\u003c/span>\u003cspan class=\"p\">][\u003c/span>\u003cspan class=\"n\">COLS\u003c/span>\u003cspan class=\"p\">];\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"8\">\u003cspan class=\"lineno\" aria-hidden=\"true\">8\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"kt\">long\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">rows\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">ROWS\u003c/span>\u003cspan class=\"p\">]\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">{\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">},\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">cols\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">COLS\u003c/span>\u003cspan class=\"p\">]\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">{\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">},\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">total\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"9\">\u003cspan class=\"lineno\" aria-hidden=\"true\">9\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">for\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"kt\">int\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">r\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">r\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">&lt;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">ROWS\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">++\u003c/span>\u003cspan class=\"n\">r\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"10\">\u003cspan class=\"lineno\" aria-hidden=\"true\">10\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"k\">for\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"kt\">int\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">c\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">c\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">&lt;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">COLS\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">++\u003c/span>\u003cspan class=\"n\">c\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">{\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"11\">\u003cspan class=\"lineno\" aria-hidden=\"true\">11\u003c/span>\u003cspan class=\"w\">            \u003c/span>\u003cspan class=\"k\">if\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">scanf\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s\">&quot;%d&quot;\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">&amp;\u003c/span>\u003cspan class=\"n\">qty\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">r\u003c/span>\u003cspan class=\"p\">][\u003c/span>\u003cspan class=\"n\">c\u003c/span>\u003cspan class=\"p\">])\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">!=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">||\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"12\">\u003cspan class=\"lineno\" aria-hidden=\"true\">12\u003c/span>\u003cspan class=\"w\">                \u003c/span>\u003cspan class=\"n\">qty\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">r\u003c/span>\u003cspan class=\"p\">][\u003c/span>\u003cspan class=\"n\">c\u003c/span>\u003cspan class=\"p\">]\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">&lt;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">||\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">qty\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">r\u003c/span>\u003cspan class=\"p\">][\u003c/span>\u003cspan class=\"n\">c\u003c/span>\u003cspan class=\"p\">]\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">&gt;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">10000\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">{\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"13\">\u003cspan class=\"lineno\" aria-hidden=\"true\">13\u003c/span>\u003cspan class=\"w\">                \u003c/span>\u003cspan class=\"n\">fputs\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s\">&quot;Invalid quantity\u003c/span>\u003cspan class=\"se\">\\n\u003c/span>\u003cspan class=\"s\">&quot;\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">stderr\u003c/span>\u003cspan class=\"p\">);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"14\">\u003cspan class=\"lineno\" aria-hidden=\"true\">14\u003c/span>\u003cspan class=\"w\">                \u003c/span>\u003cspan class=\"k\">return\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">EXIT_FAILURE\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"15\">\u003cspan class=\"lineno\" aria-hidden=\"true\">15\u003c/span>\u003cspan class=\"w\">            \u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"16\">\u003cspan class=\"lineno\" aria-hidden=\"true\">16\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"17\">\u003cspan class=\"lineno\" aria-hidden=\"true\">17\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">for\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"kt\">int\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">r\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">r\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">&lt;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">ROWS\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">++\u003c/span>\u003cspan class=\"n\">r\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"18\">\u003cspan class=\"lineno\" aria-hidden=\"true\">18\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"k\">for\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"kt\">int\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">c\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">c\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">&lt;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">COLS\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">++\u003c/span>\u003cspan class=\"n\">c\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p\">{\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"19\">\u003cspan class=\"lineno\" aria-hidden=\"true\">19\u003c/span>\u003cspan class=\"w\">            \u003c/span>\u003cspan class=\"n\">rows\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">r\u003c/span>\u003cspan class=\"p\">]\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">+=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">qty\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">r\u003c/span>\u003cspan class=\"p\">][\u003c/span>\u003cspan class=\"n\">c\u003c/span>\u003cspan class=\"p\">];\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"20\">\u003cspan class=\"lineno\" aria-hidden=\"true\">20\u003c/span>\u003cspan class=\"w\">            \u003c/span>\u003cspan class=\"n\">cols\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">c\u003c/span>\u003cspan class=\"p\">]\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">+=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">qty\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">r\u003c/span>\u003cspan class=\"p\">][\u003c/span>\u003cspan class=\"n\">c\u003c/span>\u003cspan class=\"p\">];\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"21\">\u003cspan class=\"lineno\" aria-hidden=\"true\">21\u003c/span>\u003cspan class=\"w\">            \u003c/span>\u003cspan class=\"n\">total\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">+=\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">qty\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">r\u003c/span>\u003cspan class=\"p\">][\u003c/span>\u003cspan class=\"n\">c\u003c/span>\u003cspan class=\"p\">];\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"22\">\u003cspan class=\"lineno\" aria-hidden=\"true\">22\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"23\">\u003cspan class=\"lineno\" aria-hidden=\"true\">23\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"n\">printf\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s\">&quot;rows=%ld %ld %ld\u003c/span>\u003cspan class=\"se\">\\n\u003c/span>\u003cspan class=\"s\">&quot;\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">rows\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">],\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">rows\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">],\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">rows\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">2\u003c/span>\u003cspan class=\"p\">]);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"24\">\u003cspan class=\"lineno\" aria-hidden=\"true\">24\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"n\">printf\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s\">&quot;cols=%ld %ld %ld %ld\u003c/span>\u003cspan class=\"se\">\\n\u003c/span>\u003cspan class=\"s\">&quot;\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"25\">\u003cspan class=\"lineno\" aria-hidden=\"true\">25\u003c/span>\u003cspan class=\"w\">           \u003c/span>\u003cspan class=\"n\">cols\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">],\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">cols\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">],\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">cols\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">2\u003c/span>\u003cspan class=\"p\">],\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">cols\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">3\u003c/span>\u003cspan class=\"p\">]);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"26\">\u003cspan class=\"lineno\" aria-hidden=\"true\">26\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"n\">printf\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s\">&quot;total=%ld\u003c/span>\u003cspan class=\"se\">\\n\u003c/span>\u003cspan class=\"s\">&quot;\u003c/span>\u003cspan class=\"p\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">total\u003c/span>\u003cspan class=\"p\">);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"27\">\u003cspan class=\"lineno\" aria-hidden=\"true\">27\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">return\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">EXIT_SUCCESS\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"28\">\u003cspan class=\"lineno\" aria-hidden=\"true\">28\u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>","build":"gcc -std=c17 -Wall -Wextra -Wpedantic 05_matrix_report.c -o 05_matrix_report"}],"notes":[{"page":32,"title":"案例 05｜三台設備 × 四時段產量表","text":"【本頁目標】\n案例 05｜三台設備 × 四時段產量表\n完整題目：先確認任務、輸入、輸出與限制\n\n【教師講解】\n先不要展示解答。請學生用自己的話重述任務，再指出輸入格式、輸出格式與無效資料的處理。用二維陣列保存三台設備在四個時段的產量，計算每台設備總產量、每時段總產量與全部總量。 固定 3 列 × 4 欄；每格 0～10000。列代表設備，欄代表時段；不可交換索引意義。\n\n【完整規格】\n任務：用二維陣列保存三台設備在四個時段的產量，計算每台設備總產量、每時段總產量與全部總量。\n輸入：依列輸入 12 個整數：先輸入設備 0 的四時段，再設備 1、設備 2。\n輸出：輸出 rows 三筆、cols 四筆，以及 total。\n限制：固定 3 列 × 4 欄；每格 0～10000。列代表設備，欄代表時段；不可交換索引意義。\n範例輸入：\n10 20 30 40\n5 15 25 35\n8 12 16 24\n範例輸出：\nrows=100 80 60\ncols=23 47 71 99\ntotal=240\n\n【課堂提問】\n為何 rows 和 cols 的陣列長度不同？\n\n【參考答案】\nrows 為每台設備保存一個結果，共 3 筆；cols 為每個時段保存一個結果，共 4 筆。\n\n【來源與增補】\nA pp.36–46｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":33,"title":"案例 05｜核心解法與圖解","text":"【本頁目標】\n案例 05｜核心解法與圖解\n三台設備 × 四時段產量表\n\n【教師講解】\n依下列順序帶讀圖解：1. 以 qty[r][c] 同時表達設備與時段。 2. 外層走設備 r，內層走時段 c。 3. 每讀取一格，加入 rows[r]、cols[c] 與 total。 qty[r,c] 使用的是逗號運算子，不是二維索引；正確寫法必須是 qty[r][c]。\n\n【課堂提問】\n為何 rows 和 cols 的陣列長度不同？\n\n【參考答案】\nrows 為每台設備保存一個結果，共 3 筆；cols 為每個時段保存一個結果，共 4 筆。\n\n【來源與增補】\nA pp.36–46｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":34,"title":"案例 05｜完整程式 1/2","text":"【本頁目標】\n案例 05｜完整程式 1/2\n05_matrix_report.c\n\n【教師講解】\n本頁為 05_matrix_report.c 的第 1/2 段，對應原始檔第 1～14 行。所有程式頁依序接續，沒有省略程式碼。以 ROWS、COLS 表達資料語意，準備三列四欄資料、三個列總和、四個欄總和。巢狀迴圈讀入每個合法值。\n\n【程式帶讀】\n對應 05_matrix_report.c，原始碼第 1～14 行。這是完整檔案第 1/2 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n#include \u003cstdio.h>\n#include \u003cstdlib.h>\n#define ROWS 3\n#define COLS 4\n\nint main(void) {\n    int qty[ROWS][COLS];\n    long rows[ROWS] = {0}, cols[COLS] = {0}, total = 0;\n    for (int r = 0; r \u003c ROWS; ++r)\n        for (int c = 0; c \u003c COLS; ++c) {\n            if (scanf(\"%d\", &qty[r][c]) != 1 ||\n                qty[r][c] \u003c 0 || qty[r][c] > 10000) {\n                fputs(\"Invalid quantity\\n\", stderr);\n                return EXIT_FAILURE;\n\n【課堂提問】\n為何 rows 和 cols 的陣列長度不同？\n\n【參考答案】\nrows 為每台設備保存一個結果，共 3 筆；cols 為每個時段保存一個結果，共 4 筆。\n\n【來源與增補】\nA pp.36–46｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":35,"title":"案例 05｜完整程式 2/2","text":"【本頁目標】\n案例 05｜完整程式 2/2\n05_matrix_report.c\n\n【教師講解】\n本頁為 05_matrix_report.c 的第 2/2 段，對應原始檔第 15～28 行。所有程式頁依序接續，沒有省略程式碼。每讀入一個 qty[r][c]，同步更新 rows[r]、cols[c] 及 total。觀察索引的位置和目標總和所代表的維度一致，最後分別輸出。\n\n【程式帶讀】\n對應 05_matrix_report.c，原始碼第 15～28 行。這是完整檔案第 2/2 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n            }\n        }\n    for (int r = 0; r \u003c ROWS; ++r)\n        for (int c = 0; c \u003c COLS; ++c) {\n            rows[r] += qty[r][c];\n            cols[c] += qty[r][c];\n            total += qty[r][c];\n        }\n    printf(\"rows=%ld %ld %ld\\n\", rows[0], rows[1], rows[2]);\n    printf(\"cols=%ld %ld %ld %ld\\n\",\n           cols[0], cols[1], cols[2], cols[3]);\n    printf(\"total=%ld\\n\", total);\n    return EXIT_SUCCESS;\n}\n\n【課堂提問】\n為何 rows 和 cols 的陣列長度不同？\n\n【參考答案】\nrows 為每台設備保存一個結果，共 3 筆；cols 為每個時段保存一個結果，共 4 筆。\n\n【來源與增補】\nA pp.36–46｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":36,"title":"案例 05｜測試與常見錯誤","text":"【本頁目標】\n案例 05｜測試與常見錯誤\n先預測結果，再執行；不只測一般資料。\n\n【教師講解】\n依表格逐組測試，確認返回狀態、stdout、stderr 與檔案內容。qty[r,c] 使用的是逗號運算子，不是二維索引；正確寫法必須是 qty[r][c]。 對隨機或平台相依輸出，應測試性質，而不是把單一次執行結果當成唯一答案。\n\n【測試判讀】\n一般｜題目 3×4 資料｜列 100/80/60；總量 240｜行列語意正確\n全部為零｜12 個 0｜所有統計皆為 0｜初值與空產能\n單格非零｜qty[1][2]=5，其餘 0｜rows[1]=cols[2]=5｜定位特定座標\n超出限制｜−1 或 10001｜失敗｜不能接受非法產量\n本頁列出教學代表測試。附件測試器另外包含一般值、邊界與錯誤路徑；未模擬磁碟滿載、斷電、併發或所有作業系統。\n\n【課堂提問】\n為何 rows 和 cols 的陣列長度不同？\n\n【參考答案】\nrows 為每台設備保存一個結果，共 3 筆；cols 為每個時段保存一個結果，共 4 筆。\n\n【來源與增補】\nA pp.36–46｜新增\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"}],"source_tests":["一般｜題目 3×4 資料｜列 100/80/60；總量 240｜行列語意正確","全部為零｜12 個 0｜所有統計皆為 0｜初值與空產能","單格非零｜qty[1][2]=5，其餘 0｜rows[1]=cols[2]=5｜定位特定座標","超出限制｜−1 或 10001｜失敗｜不能接受非法產量"],"annotation":{"lines":[[7,16,"第一組巢狀迴圈只負責讀取","r 對應設備、c 對應時段；12 格全部通過範圍檢查後才統計。"],[17,22,"第二組迴圈同時更新三個總量","每格加進 rows[r]、cols[c]、total；列和與欄和都應等於 total。"],[23,27,"輸出有清楚的維度意義","rows 有三筆、cols 有四筆；不能把欄總和當成設備總產量。"]],"boundary":"投影片解法摘要寫「每讀取一格，加入總量」；完整 C 程式實際分成「先讀完」與「再統計」兩組迴圈。本 HTML 保留摘要原文，逐步圖解則依完整程式的實際順序。"}},{"task":"以本金 100 作為數值運算練習，比較起始利率及其後四個整數百分比利率，列出逐年複利後的金額。","input":"標準輸入：起始年利率 rate（整數百分比）與年數 years。","output":"輸出 5 個利率欄，每年一列，金額顯示小數 2 位。","limits":"0 ≤ rate ≤ 20；1 ≤ years ≤ 30。每年複利一次；本金固定 100。不涉及費用、稅務或投資建議。","sample_in":"6 5","sample_out":"第 5 年：\n133.82 140.26 146.93 153.86 161.05","id":"06","num":6,"title":"五種利率的逐年複利表","chapter":"8","tag":"原稿案例補強","pages":[37,41],"source":"A pp.31–35","logic":["value[5] 分別保存五種情境的「當年餘額」。","外層迴圈推進年份；內層更新每個利率。","value[i] *= 1.0 + (rate+i)/100.0；只保存最近一年的狀態。"],"pitfall":"除以 100 會做整數除法；此題必須除以 100.0。顯示四捨五入不代表中間值已被截斷。","question":"為何不需要保存 years×5 的整張表？","answer":"下一年只依賴上一年的餘額，已經輸出的歷史資料不再參與計算，因此五個狀態值就足夠。","codes":[{"filename":"06_interest_table.c","pages":[39,40],"code":"#include \u003cstdio.h>\n#include \u003cstdlib.h>\n#define RATES 5\n \nint main(void) {\n    int rate, years;\n    double value[RATES];\n    if (scanf(\"%d%d\", &rate, &years) != 2 ||\n        rate \u003c 0 || rate > 20 || years \u003c 1 || years > 30) {\n        fputs(\"Expected rate 0..20 and years 1..30\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    printf(\"Year\");\n    for (int i = 0; i \u003c RATES; ++i) {\n        value[i] = 100.0;\n        printf(\" %7d%%\", rate + i);\n    }\n    putchar('\\n');\n    for (int year = 1; year \u003c= years; ++year) {\n        printf(\"%4d\", year);\n        for (int i = 0; i \u003c RATES; ++i) {\n            value[i] *= 1.0 + (rate + i) / 100.0;\n            printf(\" %8.2f\", value[i]);\n        }\n        putchar('\\n');\n    }\n    return EXIT_SUCCESS;\n}\n","sha256":"69132704cb18c390c7be1be062a99c0447ecd475c571ff77b271251247555d66","lineCount":28,"html":"\u003cspan class=\"code-line\" data-line=\"1\">\u003cspan class=\"lineno\" aria-hidden=\"true\">1\u003c/span>\u003cspan class=\"cp\">#include\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"cpf\">&lt;stdio.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"2\">\u003cspan class=\"lineno\" aria-hidden=\"true\">2\u003c/span>\u003cspan clas 3cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"p\">]);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"24\">\u003cspan class=\"lineno\" aria-hidden=\"true\">24\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"25\">\u003cspan class=\"lineno\" aria-hidden=\"true\">25\u003c/span>\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"n\">putchar\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sc\">&#39;\\n&#39;\u003c/span>\u003cspan class=\"p\">);\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"26\">\u003cspan class=\"lineno\" aria-hidden=\"true\">26\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"27\">\u003cspan class=\"lineno\" aria-hidden=\"true\">27\u003c/span>\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"k\">return\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">EXIT_SUCCESS\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"28\">\u003cspan class=\"lineno\" aria-hidden=\"true\">28\u003c/span>\u003cspan class=\"p\">}\u003c/span>\u003c/span>","build":"gcc -std=c17 -Wall -Wextra -Wpedantic 06_interest_table.c -o 06_interest_table"}],"notes":[{"page":37,"title":"案例 06｜五種利率的逐年複利表","text":"【本頁目標】\n案例 06｜五種利率的逐年複利表\n完整題目：先確認任務、輸入、輸出與限制\n\n【教師講解】\n先不要展示解答。請學生用自己的話重述任務，再指出輸入格式、輸出格式與無效資料的處理。以本金 100 作為數值運算練習，比較起始利率及其後四個整數百分比利率，列出逐年複利後的金額。 0 ≤ rate ≤ 20；1 ≤ years ≤ 30。每年複利一次；本金固定 100。不涉及費用、稅務或投資建議。\n\n【完整規格】\n任務：以本金 100 作為數值運算練習，比較起始利率及其後四個整數百分比利率，列出逐年複利後的金額。\n輸入：標準輸入：起始年利率 rate（整數百分比）與年數 years。\n輸出：輸出 5 個利率欄，每年一列，金額顯示小數 2 位。\n限制：0 ≤ rate ≤ 20；1 ≤ years ≤ 30。每年複利一次；本金固定 100。不涉及費用、稅務或投資建議。\n範例輸入：\n6 5\n範例輸出：\n第 5 年：\n133.82 140.26 146.93 153.86 161.05\n\n【課堂提問】\n為何不需要保存 years×5 的整張表？\n\n【參考答案】\n下一年只依賴上一年的餘額，已經輸出的歷史資料不再參與計算，因此五個狀態值就足夠。\n\n【來源與增補】\nA pp.31–35\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":38,"title":"案例 06｜核心解法與圖解","text":"【本頁目標】\n案例 06｜核心解法與圖解\n五種利率的逐年複利表\n\n【教師講解】\n依下列順序帶讀圖解：1. value[5] 分別保存五種情境的「當年餘額」。 2. 外層迴圈推進年份；內層更新每個利率。 3. value[i] *= 1.0 + (rate+i)/100.0；只保存最近一年的狀態。 除以 100 會做整數除法；此題必須除以 100.0。顯示四捨五入不代表中間值已被截斷。\n\n【課堂提問】\n為何不需要保存 years×5 的整張表？\n\n【參考答案】\n下一年只依賴上一年的餘額，已經輸出的歷史資料不再參與計算，因此五個狀態值就足夠。\n\n【來源與增補】\nA pp.31–35\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":39,"title":"案例 06｜完整程式 1/2","text":"【本頁目標】\n案例 06｜完整程式 1/2\n06_interest_table.c\n\n【教師講解】\n本頁為 06_interest_table.c 的第 1/2 段，對應原始檔第 1～14 行。所有程式頁依序接續，沒有省略程式碼。確認利率與年數的限制，建立五個初始值同為 100 的 double 元素。先印出五個不同利率的欄位標題。\n\n【程式帶讀】\n對應 06_interest_table.c，原始碼第 1～14 行。這是完整檔案第 1/2 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n#include \u003cstdio.h>\n#include \u003cstdlib.h>\n#define RATES 5\n\nint main(void) {\n    int rate, years;\n    double value[RATES];\n    if (scanf(\"%d%d\", &rate, &years) != 2 ||\n        rate \u003c 0 || rate > 20 || years \u003c 1 || years > 30) {\n        fputs(\"Expected rate 0..20 and years 1..30\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    printf(\"Year\");\n    for (int i = 0; i \u003c RATES; ++i) {\n\n【課堂提問】\n為何不需要保存 years×5 的整張表？\n\n【參考答案】\n下一年只依賴上一年的餘額，已經輸出的歷史資料不再參與計算，因此五個狀態值就足夠。\n\n【來源與增補】\nA pp.31–35\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":40,"title":"案例 06｜完整程式 2/2","text":"【本頁目標】\n案例 06｜完整程式 2/2\n06_interest_table.c\n\n【教師講解】\n本頁為 06_interest_table.c 的第 2/2 段，對應原始檔第 15～28 行。所有程式頁依序接續，沒有省略程式碼。外層迴圈是年度，內層迴圈是利率欄位。每格使用前一年度同一格的值更新；100.0 確保除法是浮點運算。這是數值迭代教學，不是金融預測。\n\n【程式帶讀】\n對應 06_interest_table.c，原始碼第 15～28 行。這是完整檔案第 2/2 段，依頁序合併即可，不需補寫省略片段。提醒學生先讀題目頁的輸入資料前提；程式使用的語法片段與整體錯誤契約應一起理解。\n\n        value[i] = 100.0;\n        printf(\" %7d%%\", rate + i);\n    }\n    putchar('\\n');\n    for (int year = 1; year \u003c= years; ++year) {\n        printf(\"%4d\", year);\n        for (int i = 0; i \u003c RATES; ++i) {\n            value[i] *= 1.0 + (rate + i) / 100.0;\n            printf(\" %8.2f\", value[i]);\n        }\n        putchar('\\n');\n    }\n    return EXIT_SUCCESS;\n}\n\n【課堂提問】\n為何不需要保存 years×5 的整張表？\n\n【參考答案】\n下一年只依賴上一年的餘額，已經輸出的歷史資料不再參與計算，因此五個狀態值就足夠。\n\n【來源與增補】\nA pp.31–35\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":41,"title":"案例 06｜測試與常見錯誤","text":"【本頁目標】\n案例 06｜測試與常見錯誤\n先預測結果，再執行；不只測一般資料。\n\n【教師講解】\n依表格逐組測試，確認返回狀態、stdout、stderr 與檔案內容。除以 100 會做整數除法；此題必須除以 100.0。顯示四捨五入不代表中間值已被截斷。 對隨機或平台相依輸出，應測試性質，而不是把單一次執行結果當成唯一答案。\n\n【測試判讀】\n原稿數值｜rate=6，years=5｜第 5 年如右側範例｜確認遞推\n零利率｜rate=0，years=1｜第一欄 100.00｜0% 不增加\n最短期間｜years=1｜只有一列資料｜迴圈起訖\n錯誤年數｜years=0｜失敗｜避免無意義輸出\n本頁列出教學代表測試。附件測試器另外包含一般值、邊界與錯誤路徑；未模擬磁碟滿載、斷電、併發或所有作業系統。\n\n【課堂提問】\n為何不需要保存 years×5 的整張表？\n\n【參考答案】\n下一年只依賴上一年的餘額，已經輸出的歷史資料不再參與計算，因此五個狀態值就足夠。\n\n【來源與增補】\nA pp.31–35\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"}],"source_tests":["原稿數值｜rate=6，years=5｜第 5 年如右側範例｜確認遞推","零利率｜rate=0，years=1｜第一欄 100.00｜0% 不增加","最短期間｜years=1｜只有一列資料｜迴圈起訖","錯誤年數｜years=0｜失敗｜避免無意義輸出"],"annotation":{"lines":[[8,12,"限制練習規模","先檢查利率與年數，避免超出題目規定後仍產生表格。"],[13,18,"五個情境共用一維陣列","每格起始為 100，索引 i 對應 rate+i 個百分點。"],[19,25,"逐年覆寫最新狀態","乘數使用 100.0 形成浮點除法；只保存上一年的餘額便能算出下一年。"]],"boundary":"這是陣列與巢狀迴圈的數值題，不是金融試算建議。互動以 JavaScript 浮點推演；下方 C 實測保留真正 printf 的字距及小數格式。"}},{"task":"從 4 種花色、13 種點數的牌組發出 n 張不重複的牌，用二維布林表記錄已發出的牌。","input":"標準輸入：張數 n 與 unsigned 整數亂數種子 seed。","output":"輸出 n 個二字元牌碼，例如 7c；牌碼間以空白分隔。n=0 只輸出換行。","limits":"0 ≤ n ≤ 52。點數 23456789tjqka；花色 cdhs。同一實作／種子可重現；跨編譯器不保證相同牌序。","sample_in":"5 1","sample_out":"5 張合法、互不重複的牌\n（精確序列依 C 函式庫而異）","id":"07","num":7,"title":"不重複發牌與狀態表","chapter":"8","tag":"原稿案例補強","pages":[42,46],"source":"A pp.49–55","logic":["rand()%4 與 rand()%13 取得花色、點數。","in_hand[suit][rank] 已為 true 就重新抽。","新牌才標記、輸出並增加 dealt；查表轉成牌碼。"],"pitfall":"rand()%n 可能有模數偏差；這是陣列與狀態管理練習，不是公平抽獎或密碼用途的亂數設計。","question":"發到重複牌時，能否把 dealt 加一？","answer":"不可以。dealt 代表成功輸出的不同牌張數，而不是抽樣嘗試次數。只有確認新牌後才增加。","codes":[{"filename":"07_deal_cards.c","pages":[44,45],"code":"#include \u003cstdbool.h>\n#include \u003cstdio.h>\n#include \u003cstdlib.h>\n#define SUITS 4\n#define RANKS 13\n \nint main(void) {\n    const char ranks[] = \"23456789tjqka\";\n    const char suits[] = \"cdhs\";\n    bool in_hand[SUITS][RANKS] = {{false}};\n    int n;\n    unsigned seed;\n    if (scanf(\"%d%u\", &n, &seed) != 2 || n \u003c 0 || n > 52) {\n        fputs(\"Expected count 0..52 and unsigned seed\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    srand(seed);\n    int dealt = 0;\n    while (dealt \u003c n) {\n        int suit = rand() % SUITS;\n        int rank = rand() % RANKS;\n        if (in_hand[suit][rank]) continue;\n        in_hand[suit][rank] = true;\n        printf(\"%c%c%s\", ranks[rank], suits[suit],\n               dealt + 1 == n ? \"\" : \" \");\n        ++dealt;\n    }\n    putchar('\\n');\n    return EXIT_SUCCESS;\n}\n","sha256":"d2cef2367ed68d846c12b9f02c93f97118653d4e4b5bcf227b6b7d843ee38187","lineCount":30,"html":"\u003cspan class=\"code-line\" data-line=\"1\">\u003cspan class=\"lineno\" aria-hidden=\"true\">1\u003c/span>\u003cspan class=\"cp\">#include\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"cpf\">&lt;stdbool.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"code-line\" data-line=\"2\">\u003cspan class=\"lineno\" aria-hidden=\"true\">2\u003c/span>\u003cspan class=\"cp\">#include\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"cpf\">&lt;stdio.h&gt;\u003c/span>\u003c/spa
