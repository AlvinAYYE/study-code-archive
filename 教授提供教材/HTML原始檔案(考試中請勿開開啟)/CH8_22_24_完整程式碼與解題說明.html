          failed = 1;\n    if (fclose(out) != 0) failed = 1;\n    if (failed) {\n        fputs(\"Report write failed\\n\", stderr);\n        if (remove(argv[2]) != 0)\n            fputs(\"Warning: partial report remains\\n\", stderr);\n        return EXIT_FAILURE;\n    }\n    puts(\"Report created\");\n    return EXIT_SUCCESS;\n}\n\n【課堂提問】\n這個專題在哪三個位置直接使用陣列？\n\n【參考答案】\nids/scores 保存最多 100 筆資料；seen[1000] 記錄 ID 是否出現；line[128] 承接每一行文字。\n\n【來源與增補】\nA+B+C｜新增整合實作\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":129,"title":"案例 15｜測試與常見錯誤","notes":"【本頁目標】\n案例 15｜測試與常見錯誤\n先預測結果，再執行；不只測一般資料。\n\n【教師講解】\n依表格逐組測試，確認返回狀態、stdout、stderr 與檔案內容。先輸出報表再驗證剩餘輸入，會留下半份結果。本題先完整載入與驗證，再建立目的檔。 對隨機或平台相依輸出，應測試性質，而不是把單一次執行結果當成唯一答案。\n\n【測試判讀】\n正常｜題目四筆資料｜平均 80.00；及格 3｜檔案→陣列→報表\n重複 ID｜S001 出現兩次｜失敗；不產生報表｜seen[1000] 去重\n格式／數值｜86abc、101、超大整數｜失敗並指出行號｜拒絕不完整解析\n空檔／超量｜0 筆或 101 筆｜失敗；不產生報表｜有效範圍 1～100\n目的已存在｜已存在的報表｜失敗；原檔不變｜建立模式保護資料\n本頁列出教學代表測試。附件測試器另外包含一般值、邊界與錯誤路徑；未模擬磁碟滿載、斷電、併發或所有作業系統。\n\n【課堂提問】\n這個專題在哪三個位置直接使用陣列？\n\n【參考答案】\nids/scores 保存最多 100 筆資料；seen[1000] 記錄 ID 是否出現；line[128] 承接每一行文字。\n\n【來源與增補】\nA+B+C｜新增整合實作\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":130,"title":"專題結果｜正常輸出與失敗時的檔案狀態","notes":"【本頁目標】\n專題結果｜正常輸出與失敗時的檔案狀態\n同樣重要的兩個答案：算出什麼，以及哪些檔案不該被改動。\n\n【教師講解】\n用四筆樣本逐筆重算總分 320、平均 80、及格 3。接著示範在第二行加入非法分數時，報表不應被建立；如果目的報表早已存在，內容應維持不變。這比只看終端機印出成功更能驗證整合行為。\n\n【課堂提問】\n輸入驗證全部通過，就可以在寫入前印出 Report created 嗎？\n\n【參考答案】\n不能。fprintf 或 fclose 仍可能失敗；完成訊息必須放在所有必要輸出成功之後。\n\n【來源與增補】\nA+B+C｜新增整合實作\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":131,"title":"課堂檢核｜先判斷問題，再提出最小修正","notes":"【本頁目標】\n課堂檢核｜先判斷問題，再提出最小修正\n請先說明理由；教師備忘錄附參考答案。\n\n【教師講解】\n本頁可以作為分組討論或隨堂短答。第一題 i=N 越界，改 i\u003cN。第二題以 fread 回傳控制，再檢查 ferror。第三題輸入副作用可能消失，應改 if 再視需要 assert。第四題改用本次有效長度 n。第五題回傳值是主要契約，errno 可能是殘留值。請學生先提出原因，再寫修正，避免只背「標準答案」。\n\n【表格帶讀】\n片段／說法｜要回答的問題｜討論方向\nfor(i=0; i\u003c=N; ++i) a[i]=0;｜哪一次迭代越界？｜索引與長度\nwhile(!feof(fp)) fread(...);｜為何不能預測下一次讀取？｜回傳值與狀態\nassert(scanf(\"%d\",&n)==1);｜NDEBUG 後有何差異？｜副作用與外部驗證\nfwrite(buf,1,sizeof buf,out);｜最後一塊只有 1 byte 時如何？｜容量與有效長度\nerrno != 0 就宣告任務失敗｜為何可能誤判？｜診斷與實際結果\n\n【課堂提問】\n這五個問題的共同根源是什麼？\n\n【參考答案】\n把不同概念當成同一件事：長度與索引、預測與狀態、檢查與副作用、容量與有效長度、診斷與成功契約。\n\n【來源與增補】\nA+B+C｜新增檢核\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":132,"title":"交作業前｜讓「可執行」升級為「可驗證」","notes":"【本頁目標】\n交作業前｜讓「可執行」升級為「可驗證」\n把程式、測試與說明當成同一份交付內容。\n\n【教師講解】\n使用這一頁做作業驗收，不只看能不能編譯。特別要求同一份資料的人工預期結果，和失敗情況下的檔案狀態。程式需要清楚標示受支援的輸入範圍與平台限制；沒有進行的故障測試也應坦白列出，不能把正常執行當成所有錯誤都已驗證。\n\n【課堂提問】\n安全複製器除了比對輸出檔，還應測什麼？\n\n【參考答案】\n至少測目的檔已存在、來源與目的相同、空檔、區塊邊界及來源不存在；並確認失敗時原檔沒有被改動。\n\n【來源與增補】\nA+B+C｜新增驗收表\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":133,"title":"附錄 A｜printf 常用轉換與長度修飾子","notes":"【本頁目標】\n附錄 A｜printf 常用轉換與長度修飾子\n需要細節時回查；不必把所有規格放在主講解頁。\n\n【教師講解】\n附錄保留原稿完整規格查詢功能，而不是逐頁列一兩個項目。整數長度與有號性要一起看；對 z/t 修飾子的有號對應型別，不能簡化成所有轉換都直接要求同一個型別。%n 屬特殊用途，必須傳入正確指標，且不應使用外部輸入作格式字串。\n\n【表格帶讀】\n格式類別｜對應型別／意義｜注意\nd/i；o/u/x/X｜int；unsigned int｜進位表示與符號規則不同\nf/e/g/a｜double；小數／科學／有效數字／十六進位浮點｜float 透過可變參數時提升為 double\nhh/h/l/ll｜char/short 經提升；long；long long｜配 d/u/x 等選擇相應整數長度\nj / z / t｜intmax_t；size_t；ptrdiff_t 相關｜修飾子需配合實際 signed/unsigned 轉換\nL + 浮點轉換｜long double｜例如 %Lf\nc / s / p / n / %｜字元／字串／位址／記錄已輸出數／百分號｜%n 寫入物件，不輸出字元\n\n【課堂提問】\nprintf(\"%n\", &n) 會輸出 n 的值嗎？\n\n【參考答案】\n不會。它把本次呼叫到此為止已輸出的字元數寫進 n。\n\n【來源與增補】\nB pp.67–85\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":134,"title":"附錄 B｜scanf 的型別與格式語意","notes":"【本頁目標】\n附錄 B｜scanf 的型別與格式語意\n輸入函式操作物件位址，格式不匹配可能造成未定義行為。\n\n【教師講解】\n用作課後索引表。原稿完整枚舉的 j/z/t 等修飾子，主教材已說明型別匹配原則；實際使用時仍應按函式規格查對有號性。特別提醒 %u 不等於「拒絕負號」，輸入合法性要由規格另外保證或以 strtol 解析後檢查。\n\n【表格帶讀】\n格式／修飾子｜接收物件｜提醒\n%d / %i｜int*｜%i 依前綴辨別進位；%d 固定十進位\n%u / %o / %x｜unsigned int*｜仍可能接受符號，不能代替非負驗證\n%f / %lf / %Lf｜float* / double* / long double*｜與 printf 的參數提升不同\n%hhd / %hd / %ld / %lld｜signed char* / short* / long* / long long*｜目標值必須可由接收型別表示\n%s / %[ / %c｜char 陣列／字元物件｜%s 與 %[ 補 \\0；%c 不補\n%* / %n｜抑制指定／int* 計數｜兩者都不增加回傳的指定數\n\n【課堂提問】\n使用 %u 就可以保證使用者沒有輸入負數嗎？\n\n【參考答案】\n不能。格式可能接受符號並依無號轉換規則處理；要拒絕負數必須另外驗證。\n\n【來源與增補】\nB pp.95–109\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"},{"page":135,"title":"附錄 C｜明確標示原稿勘誤與安全補強（1/2）","notes":"【本頁目標】\n附錄 C｜明確標示原稿勘誤與安全補強（1/2）\n以本教材的 C17 基準解讀；不是把平台實驗結果當成語言保證。\n\n【教師講解】\n此頁集中保留修正紀錄，讓授課者可追溯到原始投影片，避免學生回去對照原稿時困惑。修正的基準是本教材採用的 C17 與實際可驗證格式輸出，不把差異悄悄隱藏在重排內容中。\n\n【表格帶讀】\n原稿位置｜需要釐清的內容｜本教材處理\nA p.16｜空初始列的合法性敘述｜C17 使用 {0}，不採 {}\nA p.27｜C++ 的 std::size_t 圖片｜C 語言改說 size_t，輸出用 %zu\nB p.13 / p.64｜stderr 一定顯示螢幕｜限定為只重導向 stdout 的情境\nB p.57｜輸出後才 setvbuf｜先設定緩衝，再對該串流 I/O\nB p.81｜%.4g 的 1234.56 結果｜修正為 1235\n\n【課堂提問】\n為何要把原稿頁碼保留下來？\n\n【參考答案】\n方便追溯、比較和備課，能清楚區分原始概念、新增案例與勘誤。\n\n【來源與增補】\nA+B｜勘誤清單；W1\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。\n【外部校核來源】\nW1 — https://www.open-std.org/jtc1/sc22/wg14/www/docs/n1570.pdf （C11 委員會草案，引用與 C17 共通的核心條款）\nW2 — https://learn.microsoft.com/en-us/cpp/overview/install-c17-support?view=msvc-170\nW3 — https://learn.microsoft.com/en-us/cpp/c-runtime-library/reference/fopen-wfopen?view=msvc-170\nW4 — https://learn.microsoft.com/en-us/cpp/c-runtime-library/reference/strtol-wcstol-strtol-l-wcstol-l?view=msvc-170"},{"page":136,"title":"附錄 C｜明確標示原稿勘誤與安全補強（2/2）","notes":"【本頁目標】\n附錄 C｜明確標示原稿勘誤與安全補強（2/2）\n保留原意，但不沿用會誤導學生的測試與安全假設。\n\n【教師講解】\n指出「補強」不一定表示原教材主題錯誤，而是教材示例缺少實務條件。例如原始 fcopy 說明主要資料移動，但未檢查所有輸出失敗；本教材以新的題目契約补上目的檔保护與不完整檔案處理。對於移植性限制，保留不同實作可能有不同結果的說明。\n\n【表格帶讀】\n原稿位置｜需要釐清的內容｜本教材處理\nB pp.132–135｜gets 的歷史敘述｜C17 不使用；改 fgets 並檢查長行\nB pp.128,143–146｜漏檢查 I/O、未初始化欄位、!feof 迴圈｜完整案例驗證有效長度與讀寫／關閉結果\nB pp.115–116｜find_int 的負數錯誤碼｜示範狀態與資料分離的介面\nB pp.152–159｜文字位移與 fpos_t 大檔推論｜依串流類型與實作說明限制\nC p.7｜1.0/0.0 與 errno 的關聯｜改用 log 並檢查 math_errhandling\nC p.5｜完成後一律停用 assert｜依專案策略；外部驗證不能依賴 assert\n\n【課堂提問】\n補上錯誤檢查之後，是否就能宣稱檔案寫入具備斷電交易安全？\n\n【參考答案】\n不能。這些檢查處理標準 I/O 回報的失敗，不等於作業系統與儲存裝置層的交易或持久化保證。\n\n【來源與增補】\nB+C｜勘誤／補強清單；W1\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。\n【外部校核來源】\nW1 — https://www.open-std.org/jtc1/sc22/wg14/www/docs/n1570.pdf （C11 委員會草案，引用與 C17 共通的核心條款）\nW2 — https://learn.microsoft.com/en-us/cpp/overview/install-c17-support?view=msvc-170\nW3 — https://learn.microsoft.com/en-us/cpp/c-runtime-library/reference/fopen-wfopen?view=msvc-170\nW4 — https://learn.microsoft.com/en-us/cpp/c-runtime-library/reference/strtol-wcstol-strtol-l-wcstol-l?view=msvc-170"},{"page":137,"title":"來源與教材邊界","notes":"【本頁目標】\n來源與教材邊界\n原稿為內容主幹；新增示例與勘誤在各頁標示，備忘錄保留來源。\n\n【教師講解】\n三份使用者提供的原稿分別為 Chapter 8 Arrays(1).pptx（64 頁）、Chapter 22 InputOutput(1).pptx（172 頁）、Chapter 24 Error Handling(1).pptx（9 頁）。外部參考僅用於確認 C 語意與平台介面：W1 WG14 N1570 公開委員會草案、W2 Microsoft Learn C11/C17 支援說明、W3 Microsoft fopen 文件、W4 Microsoft strtol 文件。N1570 是公開 C11 委員會草案，本文引用的是與本教材 C17 共同的核心規則，不宣稱它是 ISO C17 正式版。\n\n【課堂提問】\n新增案例是否是原稿作者原有的題目？\n\n【參考答案】\n不是。新增案例、規格、圖解與測試為本次重整時補充；以標籤和來源頁碼區分。\n\n【來源與增補】\nA+B+C；W1–W4\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。\n【外部校核來源】\nW1 — https://www.open-std.org/jtc1/sc22/wg14/www/docs/n1570.pdf （C11 委員會草案，引用與 C17 共通的核心條款）\nW2 — https://learn.microsoft.com/en-us/cpp/overview/install-c17-support?view=msvc-170\nW3 — https://learn.microsoft.com/en-us/cpp/c-runtime-library/reference/fopen-wfopen?view=msvc-170\nW4 — https://learn.microsoft.com/en-us/cpp/c-runtime-library/reference/strtol-wcstol-strtol-l-wcstol-l?view=msvc-170"},{"page":138,"title":"案例索引｜題目、解法、程式與測試都在一起","notes":"【本頁目標】\n案例索引｜題目、解法、程式與測試都在一起\n點選案例可跳回完整題目頁；附件提供同名獨立 .c 檔。\n\n【教師講解】\n本頁可用於課堂快速跳題。請始終先回到完整題目頁，避免只給學生看解答程式。附件有 16 支可獨立編譯的程式、測試資料、測試執行器與逐頁備忘錄；案例 10 的兩個版本接受同一個複製題目契約。\n\n【課堂提問】\n複習一題時應先看哪一頁？\n\n【參考答案】\n先看題目規格和輸入限制，再自行預測核心解法與測試，最後比對程式。\n\n【來源與增補】\nA+B+C｜新增索引\nA：Chapter 8 Arrays(1).pptx；B：Chapter 22 InputOutput(1).pptx；C：Chapter 24 Error Handling(1).pptx。頁碼指原始投影片。標記「新增」的題目規格、圖解、案例及測試是整合教學增補；標記「勘誤」處與原稿文字有明確差異。"}],"tests":[{"id":"01-01","example":"01","name":"題目資料","program":"01_reverse.c","stdin":"34 82 49 102 7 94 23 11 50 31\n","expect":{"stdout":"31 50 11 23 94 7 102 49 82 34\n","stderr":"","rc":0},"args":[],"files":{},"checks":{},"origin":"投影片代表情境具體化"},{"id":"01-02","example":"01","name":"含負數與零","program":"01_reverse.c","stdin":"-3 0 5 1 -2 100 3 7 9 -1\n","expect":{"stdout":"-1 9 7 3 100 -2 1 5 0 -3\n","stderr":"","rc":0},"args":[],"files":{},"checks":{},"origin":"投影片代表情境具體化"},{"id":"01-03","example":"01","name":"上下界","program":"01_reverse.c","stdin":"-10000 10000 -10000 10000 -10000 10000 -10000 10000 -10000 10000\n","expect":{"stdout":"10000 -10000 10000 -10000 10000 -10000 10000 -10000 10000 -10000\n","stderr":"","rc":0},"args":[],"files":{},"checks":{},"origin":"投影片代表情境具體化"},{"id":"01-04","example":"01","name":"相同值","program":"01_reverse.c","stdin":"7 7 7 7 7 7 7 7 7 7\n","expect":{"stdout":"7 7 7 7 7 7 7 7 7 7\n","stderr":"","rc":0},"args":[],"files":{},"checks":{},"origin":"投影片代表情境具體化"},{"id":"01-05","example":"01","name":"缺少8筆","program":"01_reverse.c","stdin":"1 2\n","expect":{"stdout":"","stderr":"Invalid integer input\n","rc":1},"args":[],"files":{},"checks":{},"origin":"本次補充測試"},{"id":"01-06","example":"01","name":"非數字","program":"01_reverse.c","stdin":"1 2 x\n","expect":{"stdout":"","stderr":"Invalid integer inp else if(a==='study'){prefs.study=!prefs.study;state.revealed.clear();savePrefs();updateNav();if(e)renderCase(e);notify(prefs.study?'題目模式已開啟；解答可逐題展開。':'題目模式已關閉；完整解答可直接閱覽。');}
else if(a==='complete'){prefs.done=prefs.done.includes(e.id)?prefs.done.filter(x=>x!==e.id):[...prefs.done,e.id];savePrefs();updateNav();b.textContent=prefs.done.includes(e.id)?'✓ 已標記完成':'標記本題已完成';b.classList.toggle('active',prefs.done.includes(e.id));b.setAttribute('aria-pressed',prefs.done.includes(e.id));}
else if(a==='reveal'){state.revealed.add(e.id);renderCase(e);$('#solution').scrollIntoView({behavior:'smooth'});}
else if(a==='code-tab'){state.codeIndex=Number(b.dataset.index);renderCode();drawFrame();}
else if(a==='copy-code')copyText(e.codes[state.codeIndex].code);
else if(a==='download-code')dl(e.codes[state.codeIndex].filename,e.codes[state.codeIndex].code,'text/x-c;charset=utf-8');
else if(a==='expand-code'){const el=$('#code-slab');el.classList.toggle('unlimited');b.textContent=el.classList.contains('unlimited')?'限制程式高度':'展開程式高度';}
else if(a==='build-trace')buildTrace(false);
else if(a==='reset-input'){delete state.labDrafts[e.id];if($('#lab-input'))$('#lab-input').value=defaultInput(e);$$('[data-option]').forEach(x=>x.selectedIndex=0);if($('#preset'))$('#preset').value='';if($('#upload-file'))$('#upload-file').value='';buildTrace(false);}
else if(['first','prev','next','last'].includes(a)){stopPlay();state.frame=a==='first'?0:a==='last'?state.lab.frames.length-1:Math.max(0,Math.min(state.lab.frames.length-1,state.frame+(a==='next'?1:-1)));drawFrame();}
else if(a==='play'){if(state.timer){stopPlay();}else{if(state.frame>=state.lab.frames.length-1)state.frame=0;b.textContent='暫停';b.setAttribute('aria-pressed','true');drawFrame();state.timer=setInterval(()=>{if(!state.lab)return stopPlay();state.frame=Math.min(state.frame+1,state.lab.frames.length-1);drawFrame();},650);}}
else if(a==='artifact'){const ar=state.lab?.artifact;if(ar)dl(ar.name,'hex'in ar?hexBytes(ar.hex):ar.text,'hex'in ar?'application/octet-stream':'text/plain;charset=utf-8');}
else if(a==='hex-fixture'){const n=Number(b.dataset.size);$('#lab-input').value=Array.from({length:n},(_,i)=>(i%256).toString(16).padStart(2,'0').toUpperCase()).join(' ');buildTrace(false);}
else if(a==='csv-fixture'){const kind=b.dataset.kind;$('#lab-input').value=kind==='duplicate'?'S001,86\nS001,100\n':kind==='bad'?'S001,86\nS002,90abc\n':'S001,86\n\nS003,75\n';buildTrace(false);}
else if(a==='download-input'){const value=$('#lab-input').value;if(e.id==='10'){const tokens=value.trim().split(/\s+/);if(value.trim()&&tokens.some(t=>!/^[0-9a-f]{2}$/i.test(t)))return notify('HEX 格式不完整，請先修正每個 byte 為兩位十六進位。');dl('input.bin',hexBytes(tokens.join('')),'application/octet-stream');}else dl(e.id==='15'?'scores.csv':'input.txt',value);}
else if(a==='fixture'){const t=testSpecs.find(t=>t.id===b.dataset.test),v=t.files[b.dataset.file];dl(b.dataset.file.split('/').pop(),'hex'in v?hexBytes(v.hex):v.text,'hex'in v?'application/octet-stream':'text/plain;charset=utf-8');}
else if(a==='expand-tests')$$('.test').forEach(x=>x.open=true);
else if(a==='collapse-tests')$$('.test').forEach(x=>x.open=false);
else if(a==='download-notes-case')dl(`案例${e.id}_投影片${e.pages[0]}-${e.pages[1]}_教師備忘錄.md`,e.notes.map(n=>`## 第 ${n.page} 頁｜${n.title}\n\n${n.text}\n`).join('\n'));
else if(a==='download-notes')dl('CH8_22_24_138頁教師備忘錄.md',notesText());
else if(a==='expand-notes')$$('#notes-list details').forEach(x=>x.open=true);
else if(a==='collapse-notes')$$('#notes-list details').forEach(x=>x.open=false);
else if(a==='download-package')downloadPackage();
else if(a==='download-tests')dl('test_cases.json',JSON.stringify(testSpecs,null,2),'application/json;charset=utf-8');
else if(a==='print')printAll();
else if(a==='font'){prefs.size=prefs.size>=20?16:prefs.size+2;savePrefs();updateNav();}
else if(a==='menu'){$('#sidebar').classList.toggle('open');$('#scrim').classList.toggle('show');$('#menu-toggle').setAttribute('aria-expanded',$('#sidebar').classList.contains('open'));}
else if(a==='close-menu')closeMenu();
});
document.addEventListener('input',ev=>{if(ev.target.id==='global-search'){state.search=ev.target.value.trim();if(state.page!=='home')go('home');else renderHome();}if(ev.target.id==='note-search')filterNotes(ev.target.value.trim());if(ev.target.id==='step-range'){stopPlay();state.frame=Number(ev.target.value);drawFrame();}});
document.addEventListener('change',async ev=>{if(ev.target.id==='chapter-filter'){state.chapter=ev.target.value;if(state.page!=='home')go('home');else renderHome();}if(ev.target.id==='preset'&&ev.target.value!==''){const ps=getPresets(exById(state.id));$('#lab-input').value=ps[Number(ev.target.value)].text;buildTrace(false);}if(ev.target.id==='upload-file'){const file=ev.target.files?.[0];if(!file)return;const id=state.id;if(file.size>(id==='10'?65536:524288))return notify(id==='10'?'圖解檔案上限為 65536 bytes。':'本頁文字載入上限為 512 KiB；這不是 C 程式的來源規格。');try{const bytes=new Uint8Array(await file.arrayBuffer());if(state.id!==id)return;if(id==='10')$('#lab-input').value=[...bytes].map(x=>x.toString(16).padStart(2,'0').toUpperCase()).join(' ');else $('#lab-input').value=new TextDecoder('utf-8',{fatal:true,ignoreBOM:true}).decode(bytes);buildTrace(false);notify('已載入本頁記憶體，沒有上傳檔案。');}catch(e){notify('無法以 UTF-8 讀取這份檔案，請改用題目格式的文字檔。');}}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeMenu();if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();$('#global-search').focus();}});
window.addEventListener('hashchange',route);window.addEventListener('beforeprint',()=>{if(!$('#print-area').children.length)printAll(false);});
updateNav();route();
</script></body></html>
